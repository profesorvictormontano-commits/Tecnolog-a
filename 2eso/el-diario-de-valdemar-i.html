<title>El diario de Valdemar I</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  color-scheme:dark;
  --night:#13101f; --night2:#1c1830; --night3:#27213f; --line:#3d3760;
  --ink:#f1ebfa; --muted:#bdb4d6; --blood:#ee6178; --amber:#f4c15c; --ok:#78d9a9; --bad:#ff9494;
  --display:"Almendra","Palatino Linotype",Georgia,serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);font:17px/1.6 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0;color:var(--ink)}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
svg{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;max-width:100%;display:block}
svg .fa{fill:var(--amber);stroke:none}
svg .fb{fill:var(--blood);stroke:none}
svg .fl{fill:var(--night3)}
svg .sa{stroke:var(--amber)}
svg .fbs{fill:var(--blood);stroke:var(--blood);stroke-width:2}
svg .tx{font:700 26px var(--display);fill:var(--amber);stroke:none;text-anchor:middle}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(19,16,31,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.25rem;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:20px}
.stat{font-size:.85rem;color:var(--muted)}
.stat b{color:var(--amber);font-variant-numeric:tabular-nums;font-size:1rem}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.pip{height:6px;border-radius:3px;background:var(--line)}
.partban{background:var(--night2);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.partban b{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--amber)}
.partban span{font-size:.9rem;color:var(--muted)}
.pip.done{background:var(--amber)}
.pip.cur{background:var(--blood)}

.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
.stack{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:1.08rem;max-width:60ch}

.btn{appearance:none;border:0;cursor:pointer;background:var(--blood);color:#1a0f18;font-weight:700;padding:12px 22px;border-radius:999px;font-size:1rem;align-self:flex-start}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* portada */
.cover{display:flex;flex-direction:column;gap:24px;padding-top:12px}
.cover-moon{width:104px;height:78px}
.cover h1{font-size:clamp(2.6rem,9vw,4.4rem)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rule{background:var(--night2);border-radius:12px;padding:14px 16px}
.rule b{display:block;font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--amber);margin-bottom:2px}
.rule span{font-size:.93rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;max-width:380px}
.field label{font-size:.85rem;color:var(--muted)}
.inp{background:var(--night2);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;width:100%}
.inp:focus{border-color:var(--amber);outline:none}

/* relato */
.story{background:var(--night2);border-radius:16px;padding:22px 22px 24px}
.story p{font-size:1.06rem;max-width:62ch}
.story p+p{margin-top:12px}
.story .date{font-family:var(--display);color:var(--amber);font-size:1.15rem;margin-bottom:8px}
.figrow{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.fig{background:radial-gradient(circle at 50% 40%,var(--night3),var(--night2) 70%);border-radius:18px;padding:18px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.fig svg{width:100%;height:100%}
.heading h2{font-size:clamp(1.9rem,6vw,2.7rem)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:.83rem;background:var(--night3);color:var(--ink);padding:4px 11px;border-radius:999px}
.facts{display:grid;gap:0;margin:0}
.fact{display:grid;grid-template-columns:130px 1fr;gap:6px 18px;padding:14px 0;border-top:1px solid var(--line)}
.fact dt{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);padding-top:3px}
.fact dd{margin:0}
.evo{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;list-style:none;padding:0;margin:0}
.evo li{background:var(--night3);border-radius:10px;padding:6px 12px;font-size:.92rem}
.evo li+li::before{content:"→";color:var(--blood);margin-right:8px;font-weight:700}
.evo li{display:flex;align-items:center}
.warn dd{color:var(--muted)}

/* prueba */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{background:var(--night2);border-radius:10px;padding:8px 8px 9px;text-align:center;font-size:.78rem;color:var(--muted);border:1.5px solid transparent}
.step b{display:block;font-family:var(--display);font-weight:400;font-size:.98rem;color:var(--ink)}
.step.cur{border-color:var(--blood)}
.step.cur b{color:var(--blood)}
.step.ok{border-color:var(--ok)}
.step.ok b{color:var(--ok)}
.step.no{opacity:.55}
.qcard{background:var(--night2);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.qtext{font-size:1.14rem;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:var(--night);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .lt{font-family:var(--display);color:var(--amber);font-size:1.15rem;line-height:1.3;min-width:1.1em}
.opt[aria-checked="true"]{border-color:var(--amber);background:var(--night3)}
.opt:disabled{cursor:default}
.fbk{border-radius:12px;padding:14px 16px;border:1.5px solid var(--line);background:var(--night)}
.fbk.ok{border-color:var(--ok)}
.fbk.bad{border-color:var(--bad)}
.fbk b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;margin-bottom:2px}
.fbk.ok b{color:var(--ok)}
.fbk.bad b{color:var(--bad)}
.note{font-size:.88rem;color:var(--muted)}
details.reread{background:var(--night2);border-radius:14px;padding:0 18px}
details.reread summary{cursor:pointer;padding:14px 0;font-family:var(--display);font-size:1.15rem;color:var(--amber)}
details.reread[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
details.reread .stack{padding-bottom:18px}

/* resumen */
.big{font-family:var(--display);font-size:clamp(2.6rem,10vw,4rem);color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.badge{display:inline-block;font-family:var(--display);font-size:1.25rem;border:1.5px solid var(--amber);color:var(--amber);border-radius:10px;padding:6px 14px}
.lvrow{display:flex;gap:6px}
.lvdot{width:22px;height:8px;border-radius:4px;background:var(--line)}
.lvdot.a1{background:var(--ok)}
.lvdot.a2{background:var(--amber)}

/* diploma */
.diploma{border:2px solid var(--amber);outline:1px solid var(--amber);outline-offset:6px;border-radius:6px;padding:34px 22px;text-align:center;background:var(--night2);display:flex;flex-direction:column;gap:12px;align-items:center;margin:8px}
.diploma h2{font-size:clamp(2rem,8vw,3.2rem);color:var(--amber)}
.diploma .who{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.3rem)}
.diploma svg{width:84px;height:63px}
.stars{color:var(--amber);letter-spacing:.3em;font-size:1.3rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{font-variant-numeric:tabular-nums;color:var(--amber);white-space:nowrap}
.scroll{overflow-x:auto}
.credit{font-size:.8rem;color:var(--muted);text-align:center;opacity:.85}
.sitefoot{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.5;margin-top:10px;opacity:.85}
.exitwarn{position:fixed;left:50%;top:14px;transform:translateX(-50%);max-width:min(90vw,520px);background:var(--blood);color:#1a0f18;padding:14px 18px;border-radius:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.45);text-align:left;font-size:.9rem;line-height:1.4}
.exitwarn b{display:block;font-family:var(--display);font-size:1.05rem;margin-bottom:2px}
.diploma-wrap{display:flex;flex-direction:column;gap:16px}

/* informe de preguntas y respuestas (sección 5): a partir de la página 2 del
   certificado impreso, con el detalle de cada intento. */
.qa-report{margin-top:8px;padding-top:18px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:18px}
.qa-report>h3{font-size:1.3rem;color:var(--amber)}
.qa-inv{display:flex;flex-direction:column;gap:8px}
.qa-inv h4{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px;margin:0}
.qa-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.qa-item{background:var(--night2);border-radius:10px;padding:10px 14px;border:1.5px solid var(--line);font-size:.92rem}
.qa-item.qa-ok{border-color:var(--ok)}
.qa-item.qa-bad{border-color:var(--bad)}
.qa-q{margin-bottom:4px}
.qa-a,.qa-c{color:var(--muted)}
.qa-mark{font-weight:700}
.qa-item.qa-ok .qa-mark{color:var(--ok)}
.qa-item.qa-bad .qa-mark{color:var(--bad)}

@media print{
  .top,.btn,.row,details.reread,.fbk,.opts,.qcard .qmeta,.exitwarn{display:none!important}
  .top .note,.btn .note,.row .note,.fbk .note,.opts .note{display:none!important}
  body,html{background:#fff!important}
  body *{visibility:hidden}
  .diploma-wrap,.diploma-wrap *,.qa-report,.qa-report *{visibility:visible}
  .diploma-wrap{position:absolute;left:0;top:0;width:100%;color:#000!important}
  .diploma-wrap .diploma{border-color:#000;outline-color:#000}
  .diploma-wrap .big,.diploma-wrap .badge,.diploma-wrap h2,.diploma-wrap .stars{color:#000!important}
  .diploma-wrap .who{color:#000!important}
  .diploma-wrap .note{color:#333!important}
  .qa-report{position:relative;color:#000!important;page-break-before:always;border-top:none;margin-top:0;padding-top:0}
  .qa-report>h3,.qa-inv h4{color:#000!important;border-color:#000}
  .qa-item{border-color:#000!important;page-break-inside:avoid}
  .qa-item.qa-ok{border-color:#060!important}
  .qa-item.qa-bad{border-color:#900!important}
  .qa-a,.qa-c{color:#333!important}
  .qa-item.qa-ok .qa-mark{color:#060!important}
  .qa-item.qa-bad .qa-mark{color:#900!important}
  @page{size:A4;margin:14mm}
}

@media (max-width:560px){
  .figrow{grid-template-columns:1fr}
  .fig{max-width:240px}
  .fact{grid-template-columns:1fr;gap:2px}
  .steps{gap:4px}
  .step{font-size:.68rem;padding:6px 3px}
  .step b{font-size:.82rem}
  .story,.qcard{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function shuffleN(seed,n){const a=[];for(let i=0;i<n;i++)a.push(i);let x=seed;for(let i=n-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const actScore=a=>a===1?10:a===2?9.8:1;
function highestLevel(r){let h=0;for(let l=0;l<5;l++){if(r.p[l])h=l+1;else break;}return h;}
function invNota(r){
  const scores=r.p.map(actScore);
  const mean=scores.reduce((s,v)=>s+v,0)/5;
  const [mn,mx]=FRANJAS[highestLevel(r)];
  const pos=(mean-1)/9;
  return mn+pos*(mx-mn);
}
function baseNota(){return S.res.reduce((s,r)=>s+invNota(r),0)/N;}

/* ---- salidas de la ventana (sección 9, opción B) ----
   Única salida permitida sin penalización: nivel 5 (investigación), a través
   del botón «Busca información en internet». Cualquier otra salida de la
   ventana (cambiar de pestaña, minimizar, abrir otra app) penaliza y avisa. */
let warnPending=false;
function exemptScreen(){return S.screen==="quiz" && S.lvl===4;}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(S.screen && S.screen!=="cover" && S.screen!=="diploma" && !exemptScreen()){
      S.sal++;save();warnPending=true;
    }
  }else if(warnPending){
    warnPending=false;
    showExitWarning();
  }
});
function showExitWarning(){
  const old=document.querySelector(".exitwarn");if(old)old.remove();
  const w=document.createElement("div");
  w.className="exitwarn";
  w.setAttribute("role","alert");
  w.innerHTML="<b>Salida de la ventana registrada (nº "+S.sal+")</b>Resta 0,5 puntos en tu nota final y queda anotado en tu diploma. Solo puedes salir sin penalización en el nivel 5, con el botón «Busca información en internet».";
  document.body.appendChild(w);
  setTimeout(()=>{if(w.parentNode)w.remove();},7000);
}

function topbar(){
  const t=$("top");
  if(S.screen==="cover"){t.hidden=true;return;}
  t.hidden=false;
  const p=partOf(S.inv),idx=partIdx(p);
  const done=S.res.filter(r=>r.done).length;
  let pips="";
  for(let i=0;i<N;i++){pips+='<span class="pip '+(S.res[i]&&S.res[i].done?"done":(i===S.inv&&(S.screen==="entry"||S.screen==="quiz"||S.screen==="summary")?"cur":""))+'"></span>';}
  t.innerHTML='<div class="top-in"><div class="top-row"><div class="brand"><svg viewBox="0 0 120 90" aria-hidden="true">'+ICON.moon+'</svg>'+esc(CONF.title)+'</div>'
   +'<div class="stat">'+esc(S.name)+' · Parte '+(p+1)+' de '+NP+' · Inventos: <b>'+done+'/'+N+'</b></div></div>'
   +'<div class="pips" aria-hidden="true">'+pips+'</div></div>';
}

function entryBody(iv){
  return '<dl class="facts">'
   +'<div class="fact"><dt>Inventor/a</dt><dd><b>'+esc(iv.i)+'</b></dd></div>'
   +'<div class="fact"><dt>Su historia</dt><dd>'+esc(iv.b)+'</dd></div>'
   +'<div class="fact"><dt>Qué cambió</dt><dd>'+esc(iv.a)+'</dd></div>'
   +'<div class="fact"><dt>Evolución</dt><dd><ol class="evo">'+iv.e.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol></dd></div>'
   +'<div class="fact warn"><dt>Ojo</dt><dd>'+esc(iv.o)+'</dd></div></dl>';
}
function storyBlock(iv){return '<section class="story"><div class="date">Del diario de Valdemar</div><p>'+esc(iv.s)+'</p></section>';}
function footNote(){return '<p class="sitefoot" data-autor="'+CONF.artId+'">© '+CONF.year+' Víctor Manuel Montano Simón. Todos los derechos reservados. Prohibida su reproducción, modificación o uso con inteligencia artificial sin autorización del autor. · ID de obra '+CONF.artId+'</p>';}

function vCover(){
  const sv=load();
  return '<div class="cover"><svg class="cover-moon" viewBox="0 0 120 90" aria-hidden="true">'+ICON.moon+'</svg>'
   +'<div class="stack" style="gap:14px"><span class="eyebrow">Tecnología y Digitalización · 2.º ESO</span><h1>'+esc(CONF.title)+'</h1>'
   +'<p class="lede">'+esc(CONF.lede)+'</p></div>'
   +'<div class="rules">'
   +'<div class="rule"><b>5 niveles</b><span>Recuerda, comprende, aplica, deduce e investiga en internet.</span></div>'
   +'<div class="rule"><b>2 intentos</b><span>Si fallas, tendrás una pista y otra prueba del mismo nivel. Si vuelves a fallar, pasas al siguiente invento.</span></div>'
   +'<div class="rule"><b>Nota de 0 a 10</b><span>Superar el nivel 1 en todos los inventos da un 5. Cuanto más alto el nivel superado, más alta la nota.</span></div>'
   +'<div class="rule"><b>'+N+' inventos en 2 partes</b><span>Unos 40 minutos cada una. Al terminar los '+N+' recibirás tu diploma.</span></div></div>'
   +'<div class="field"><label for="nm">Escribe tu nombre y apellidos (saldrá en tu diploma)</label><input class="inp" id="nm" maxlength="60" autocomplete="name" value="'+esc(S.name||(sv?sv.name:""))+'"></div>'
   +'<div class="row"><button class="btn" data-act="start">Abrir el diario</button>'
   +(sv&&sv.res.some(r=>r.done)?'<button class="btn ghost" data-act="resume">Continuar donde lo dejé ('+esc(sv.name)+')</button>':'')
   +'<button class="btn ghost" data-act="fullscreen">Ver a pantalla completa</button></div>'
   +footNote()+'</div>';
}
function vIntro(){
  return '<div class="stack"><div class="figrow"><div class="fig">'+svg(CONF.introIcon,"Ilustración inicial")+'</div><div class="heading"><span class="eyebrow">'+esc(CONF.introEyebrow)+'</span><h2>'+esc(CONF.introTitle)+'</h2><div class="chips">'+CONF.introChips.map(c=>'<span class="chip">'+esc(c)+'</span>').join("")+'</div></div></div>'
   +'<section class="story"><div class="date">'+esc(CONF.introDate)+'</div>'+CONF.intro.map(p=>'<p>'+esc(p)+'</p>').join("")+'</section>'
   +'<button class="btn" data-act="first">'+esc(CONF.introBtn)+'</button></div>';
}
function vEntry(){
  const iv=INV[S.inv],p=partOf(S.inv),k=S.inv-p*PER+1;
  const ban=k===1?'<div class="partban"><b>Parte '+(p+1)+' de '+NP+': '+esc(PARTS[p].t)+'</b><span>'+esc(PARTS[p].d)+' · unos 40 minutos</span></div>':"";
  return '<div class="stack">'+ban+'<div class="figrow"><div class="fig">'+svg(iv.g,"Ilustración: "+iv.t)+'</div><div class="heading"><span class="eyebrow">Parte '+(p+1)+' · Invento '+k+' de '+PER+'</span><h2>'+esc(iv.t)+'</h2><div class="chips"><span class="chip">'+esc(iv.f)+'</span><span class="chip">'+esc(iv.l)+'</span></div></div></div>'
   +storyBlock(iv)+entryBody(iv)
   +'<button class="btn" data-act="quiz">Ir a la prueba</button></div>';
}
function vQuiz(){
  const iv=INV[S.inv],r=S.res[S.inv],L=S.lvl,q=curQ();
  let steps="";
  for(let l=0;l<5;l++){steps+='<div class="step '+(r.p[l]?"ok":(l===L?"cur":(l>L?"":"no")))+'"><b>'+(l+1)+'. '+LV[l][0]+'</b>'+LV[l][1]+'</div>';}
  const locked=!!S.fb;
  let body="";
  if(L<4){
    const perm=shuffle(S.inv*100+L*10+S.att);
    body='<div class="opts" role="radiogroup" aria-label="Opciones">'+perm.map((k,d)=>'<button class="opt" role="radio" aria-checked="'+(S.sel===d)+'" data-act="pick" data-i="'+d+'"'+(locked?" disabled":"")+'><span class="lt">'+"ABC"[d]+'</span><span>'+esc(q.o[k])+'</span></button>').join("")+'</div>';
  }else{
    body='<div class="field" style="max-width:none"><label for="ans">Tu respuesta (busca en internet y escribe solo el dato que se pide)</label><input class="inp" id="ans" autocomplete="off" value="'+esc(S.txt)+'"'+(locked?" disabled":"")+'></div>'
      +'<div class="row"><a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent(iv.t+" "+iv.i)+'" data-act="buscar">Busca información en internet</a></div>'
      +'<p class="note">Este es el único momento del diario en el que puedes salir de la ventana sin penalización. Tu profesor o profesora podrá revisar lo que escribas.</p>';
  }
  let fb="";
  if(S.fb){
    if(S.fb.ok) fb='<div class="fbk ok" role="status"><b>¡Nivel superado!</b>'+(S.att===1?"A la primera: puntuación completa.":"Lo has logrado en el segundo intento: puntúa un poco menos.")+'</div>';
    else if(S.att===1) fb='<div class="fbk bad" role="status"><b>Casi…</b>'+esc(L<4?"Pista: vuelve a leer "+SEC[q.s]+" en el diario y piensa con calma. Tendrás otra prueba de este mismo nivel.":"Pista: "+q.h+" Tendrás otra prueba de este mismo nivel.")+'</div>';
    else fb='<div class="fbk bad" role="status"><b>Este nivel se queda sin superar</b>No pasa nada: seguimos con el siguiente invento y el diario te dará nuevas oportunidades.</div>';
  }
  let btn="";
  if(!S.fb) btn='<button class="btn" data-act="check" id="chk"'+((L<4?S.sel<0:!S.txt.trim())?" disabled":"")+'>Comprobar</button>';
  else if(S.fb.ok) btn='<button class="btn" data-act="next">'+(L===4?"Terminar este invento":"Siguiente nivel")+'</button>';
  else if(S.att===1) btn='<button class="btn" data-act="retry">Otra prueba de este nivel</button>';
  else btn='<button class="btn" data-act="end">Pasar al siguiente invento</button>';
  return '<div class="stack"><div><span class="eyebrow">Parte '+(partOf(S.inv)+1)+' · Invento '+(S.inv-partOf(S.inv)*PER+1)+' de '+PER+'</span><h2 style="margin-top:4px">'+esc(iv.t)+'</h2></div>'
   +'<div class="steps">'+steps+'</div>'
   +'<section class="qcard"><div class="qmeta"><span>Nivel '+(L+1)+' · '+LV[L][0]+'</span><span>Intento '+S.att+' de 2</span></div><p class="qtext">'+esc(q.p)+'</p>'+body+fb+'<div class="row">'+btn+'</div></section>'
   +'<details class="reread"><summary>Releer el diario</summary><div class="stack">'+storyBlock(iv)+entryBody(iv)+'</div></details></div>';
}
function vSummary(){
  const iv=INV[S.inv],r=S.res[S.inv],sc=invNota(r),last=S.inv===N-1;
  const dots=r.p.map(a=>'<span class="lvdot '+(a?"a"+a:"")+'"></span>').join("");
  const lv=highestLevel(r);
  const nextAct=last?(CONF.epilogue?"epilogue":"diploma"):"nextinv";
  const nextLbl=last?(CONF.epilogue?"Pasar a la última página":"Recibir tu diploma"):"Pasar a la siguiente página";
  return '<div class="stack"><span class="eyebrow">Invento '+(S.inv+1)+' de '+N+' completado</span><h2>'+esc(iv.t)+'</h2>'
   +'<div class="row" style="gap:22px"><div><div class="big">'+fmt(sc)+'</div><div class="note">sobre 10 en este invento</div></div><div class="stack" style="gap:8px"><span class="badge">Nivel '+lv+' de 5 superado</span><div class="lvrow" aria-label="Niveles superados">'+dots+'</div><div class="note">verde: a la primera · dorado: al segundo intento</div></div></div>'
   +'<button class="btn" data-act="'+nextAct+'">'+nextLbl+'</button></div>';
}
function vEpilogue(){
  return '<div class="stack"><div class="figrow"><div class="fig">'+svg(CONF.epilogueIcon||"web","Ilustración final")+'</div><div class="heading"><span class="eyebrow">Última página</span><h2>'+esc(CONF.epilogueTitle)+'</h2></div></div>'
   +'<section class="story"><div class="date">'+esc(CONF.epilogueDate)+'</div>'+CONF.epilogue.map(p=>'<p>'+esc(p)+'</p>').join("")+'</section>'
   +'<div class="chips">'+INV.map(x=>'<span class="chip">'+esc(x.t)+'</span>').join("")+'</div>'
   +'<button class="btn" data-act="diploma">Recibir tu diploma</button></div>';
}
function qaReport(){
  let any=false;
  let body="";
  INV.forEach((iv,i)=>{
    const r=S.res[i];
    if(!r.log||!r.log.length)return;
    any=true;
    const items=r.log.map(e=>'<li class="qa-item '+(e.ok?"qa-ok":"qa-bad")+'"><div class="qa-q"><b>Nivel '+(e.lvl+1)+' · '+LV[e.lvl][0]+'</b> · intento '+e.att+' — '+esc(e.q)+'</div>'
      +'<div class="qa-a">Respuesta del alumno: «'+esc(e.given)+'» <span class="qa-mark">'+(e.ok?"✓ correcta":"✗ incorrecta")+'</span></div>'
      +(e.ok?"":'<div class="qa-c">Respuesta correcta: «'+esc(e.correct)+'»</div>')
      +'</li>').join("");
    body+='<div class="qa-inv"><h4>'+esc(iv.t)+'</h4><ol class="qa-list">'+items+'</ol></div>';
  });
  if(!any)return "";
  return '<div class="qa-report"><h3>Informe de preguntas y respuestas</h3>'+body+'</div>';
}
function vDiploma(){
  const n=finalNota(),rk=rankOf(n),st="★".repeat(stars(n))+"☆".repeat(5-stars(n));
  const when=new Date(S.issuedAt||Date.now());
  const whenStr=when.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"})+" · "+when.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  const rows=INV.map((iv,i)=>{const r=S.res[i];return '<tr><td>'+esc(iv.t)+'</td><td><div class="lvrow">'+r.p.map(a=>'<span class="lvdot '+(a?"a"+a:"")+'"></span>').join("")+'</div></td><td class="n">'+fmt(invNota(r))+'</td></tr>';}).join("");
  return '<div class="stack"><div class="diploma-wrap"><div class="diploma"><svg viewBox="0 0 120 90" aria-hidden="true">'+ICON.moon+'</svg><span class="eyebrow">Diploma de Valdemar · '+esc(CONF.title)+'</span>'
   +'<h2>'+rk+' '+esc(CONF.theme)+'</h2><p class="lede" style="text-align:center">Se otorga a</p><div class="who">'+esc(S.name||"Alumno/a")+'</div>'
   +'<div class="stars" aria-label="'+stars(n)+' de 5">'+st+'</div><div class="big">'+fmt(n)+'</div><span class="note">nota final sobre 10</span>'
   +'<span class="note">Fecha y hora de descarga: '+whenStr+'</span>'
   +(S.sal>0?'<span class="note">Salidas de la ventana fuera del nivel de investigación: '+S.sal+' (−'+fmt(penal())+' puntos)</span>':'')
   +'<span class="note">ID de obra: '+CONF.artId+'</span></div>'
   +'<h3>Resumen de los '+N+' inventos</h3><div class="scroll"><table class="tbl"><thead><tr><th>Invento</th><th>Niveles</th><th>Nota</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +footNote()+'</div>'
   +qaReport()
   +'<p class="note">Haz una captura de pantalla de este diploma, o pulsa «Imprimir / Guardar en PDF», y entrégalo a tu profesor o profesora.'+(CONF.nextHint?' '+esc(CONF.nextHint):'')+'</p>'
   +(redoAsk
    ?'<div class="fbk bad" role="alert"><b>¿Volver a hacerlo?</b><p>Se cargará el diario desde el principio con preguntas distintas y este diploma desaparecerá. Antes, imprímelo o guárdalo en PDF si lo necesitas.</p></div><div class="row"><button class="btn" data-act="redo">Sí, volver a hacer</button><button class="btn ghost" data-act="redo-no">Cancelar</button></div>'
    :'<div class="row"><button class="btn" data-act="print">Imprimir / Guardar en PDF</button><button class="btn ghost" data-act="redo-ask">Volver a hacer</button></div>')
   +'</div>';
}

function render(keep){
  topbar();
  const v={cover:vCover,intro:vIntro,entry:vEntry,quiz:vQuiz,summary:vSummary,epilogue:vEpilogue,diploma:vDiploma}[S.screen];
  const y=window.scrollY;
  $("app").innerHTML=v();
  window.scrollTo(0,keep?y:0);
}
function go(sc){S.screen=sc;S.sel=-1;S.txt="";S.fb=null;render(false);save();}

function check(){
  const iv=INV[S.inv],r=S.res[S.inv],L=S.lvl,q=curQ();
  let ok,given,correct;
  if(L<4){
    const perm=shuffle(S.inv*100+L*10+S.att);
    ok=perm[S.sel]===0;
    given=q.o[perm[S.sel]];
    correct=q.o[0];
  }else{
    const a=" "+norm(S.txt)+" ";
    ok=q.k.some(k=>a.includes(" "+norm(k)+" "));
    given=S.txt.trim();
    correct=q.k[0];
  }
  r.log.push({lvl:L,att:S.att,q:q.p,given:given,correct:correct,ok:ok});
  if(ok)r.p[L]=S.att;
  S.fb={ok:ok};
  save();
  render(true);
}
function finishInv(){S.res[S.inv].done=true;save();go("summary");}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="start"){
    const nm=$("nm").value.trim();
    if(!nm){$("nm").focus();$("nm").style.borderColor="var(--blood)";return;}
    S={name:nm,screen:"intro",inv:0,lvl:0,att:1,res:INV.map(newRes),sel:-1,txt:"",fb:null,sal:0,seed:Math.floor(Math.random()*1e9)+1};
    clearSave();render(false);save();
  }
  else if(a==="resume"){
    const sv=load();S={name:sv.name,screen:"entry",inv:0,lvl:0,att:1,res:sv.res,sel:-1,txt:"",fb:null,sal:sv.sal||0,seed:sv.seed||(Math.floor(Math.random()*1e9)+1)};
    S.res.forEach(r=>{if(!r.log)r.log=[];});
    while(S.res.length<N)S.res.push(newRes());
    S.inv=Math.min(sv.inv,N-1);
    if(S.res[S.inv].done){S.inv++;}
    if(S.inv>=N){go(CONF.epilogue?"epilogue":"diploma");}else{go("entry");}
  }
  else if(a==="fullscreen"){
    const el=document.documentElement;
    if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});
  }
  else if(a==="first"){S.inv=0;go("entry");}
  else if(a==="quiz"){S.lvl=0;S.att=1;go("quiz");}
  else if(a==="pick"){S.sel=+b.dataset.i;render(true);}
  else if(a==="check"){check();}
  else if(a==="next"){
    S.lvl++;
    if(S.lvl>4){finishInv();}else{S.att=1;S.sel=-1;S.txt="";S.fb=null;render(false);save();}
  }
  else if(a==="retry"){S.att=2;S.sel=-1;S.txt="";S.fb=null;render(false);save();}
  else if(a==="end"){finishInv();}
  else if(a==="nextinv"){S.inv++;S.lvl=0;S.att=1;go("entry");}
  else if(a==="epilogue"){go("epilogue");}
  else if(a==="diploma"){S.issuedAt=new Date().toISOString();clearSave();go("diploma");}
  else if(a==="print"){S.issuedAt=S.issuedAt||new Date().toISOString();window.print();}
  else if(a==="redo-ask"){redoAsk=true;render(true);}
  else if(a==="redo-no"){redoAsk=false;render(true);}
  else if(a==="redo"||a==="reset"){
    redoAsk=false;clearSave();
    S={name:S.name,screen:"cover",inv:0,lvl:0,att:1,res:[],sel:-1,txt:"",fb:null,sal:0,seed:Math.floor(Math.random()*1e9)+1};
    render(false);
    try{window.scrollTo(0,0);}catch(e){}
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="ans"){S.txt=e.target.value;const c=$("chk");if(c)c.disabled=!S.txt.trim();}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(e.target.id==="ans"){const c=$("chk");if(c&&!c.disabled)c.click();}
    else if(e.target.id==="nm"){const s=document.querySelector('[data-act="start"]');if(s)s.click();}
  }
});
render(false);
</script>

</body></html>
