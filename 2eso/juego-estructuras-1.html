<style>
:root{
  --night:#1E1147; --deep:#140B35; --panel:#2A1A63; --panel2:#3A2585;
  --mint:#5CF2C6; --pink:#FF4FA3; --sun:#FFD23F; --sky:#43C6F0; --hood:#F29E38;
  --ink:#F6F2FF; --muted:#C3B8F0; --bad:#FF6B6B; --line:rgba(255,255,255,.14);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#1E1147; --panel:#2A1A63; --ink:#F6F2FF; } }
:root[data-theme="dark"]{ --night:#1E1147; --panel:#2A1A63; --ink:#F6F2FF; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg svg{width:100%;height:100%}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0}
button{font:inherit}
.hidden{display:none!important}

/* botones */
.btn{appearance:none;border:0;border-radius:999px;padding:13px 26px;font-family:var(--display);font-size:1.1rem;font-weight:600;cursor:pointer;background:var(--mint);color:#16103A;box-shadow:0 5px 0 #2BB38E;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2BB38E}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #B8277A}
.btn.sun{background:var(--sun);box-shadow:0 5px 0 #C99A10}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.mitem:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}

/* portada */
.cover{padding-top:18px;text-align:center}
.cover h1{font-size:clamp(2.1rem,7vw,3.4rem);font-weight:700;letter-spacing:-.01em}
.cover h1 .l2{display:block;color:var(--mint)}
.cover .hero{width:min(300px,78vw);margin:4px auto -6px}
.cover p.lead{max-width:34em;margin:10px auto 22px;color:var(--muted)}
.card{background:var(--panel);border-radius:26px;padding:20px;border:2px solid var(--line)}
.form{max-width:440px;margin:0 auto 16px;text-align:left}
.form label{display:block;font-weight:700;margin:10px 0 4px}
.form input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--deep);color:var(--ink);font:inherit}
.form .err{color:var(--bad);min-height:1.4em;font-size:.95rem;margin-top:6px}
.teacher{max-width:34em;margin:26px auto 0;font-size:.85rem;color:var(--muted);opacity:.85}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hud .who{font-family:var(--display);font-weight:500;font-size:.98rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{display:flex;align-items:center;gap:0}
.path i{display:block;width:13px;height:13px;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.path i.done{background:var(--mint);border-color:var(--mint)}
.path i.now{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 4px rgba(255,210,63,.25)}
.path b{display:block;width:16px;height:2px;background:var(--line)}

/* escena */
.scene{border-radius:26px;overflow:hidden;border:3px solid var(--panel2);background:#000;position:relative}
.scene svg{display:block;width:100%;height:auto}
.scene.mini svg{height:150px}
.fig .zone{pointer-events:none}
.place{font-family:var(--display);color:var(--sun);font-size:1rem;margin:16px 0 2px}
.stitle{font-size:1.7rem;margin-bottom:8px}
.narr{margin:0 0 16px}
.bubble{position:relative;background:#fff;color:#1b1340;border-radius:20px;padding:12px 16px;margin:0 0 16px;font-weight:600}
.bubble::before{content:"";position:absolute;left:28px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble strong{color:#B8277A}

/* animación Blip */
.bob{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes bob{50%{transform:translateY(-3px)}}
.shake{animation:shake .35s linear infinite}
@keyframes shake{25%{transform:translate(-4px,2px) rotate(-.5deg)}75%{transform:translate(4px,-2px) rotate(.5deg)}}
.fall{animation:fall 1.2s ease-in forwards;transform-box:fill-box;transform-origin:bottom center}
@keyframes fall{to{transform:translateY(40px) rotate(14deg) scaleY(.4);opacity:.25}}
.beam{animation:beam 1.6s ease-in forwards}
@keyframes beam{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.gone{animation:gone 1.4s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes gone{to{transform:translateY(-120px) scale(.3);opacity:0}}
@media (prefers-reduced-motion: reduce){.bob,.shake,.scanline{animation:none!important}}

/* modal escáner */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,5,30,.8);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px))}
.scanner{position:relative;max-width:720px;width:100%;background:#0D2B33;border:3px solid var(--mint);border-radius:26px;padding:22px 20px;box-shadow:0 0 40px rgba(92,242,198,.35);overflow:hidden}
.scanner::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(92,242,198,.05) 0 2px,transparent 2px 5px);pointer-events:none}
.scanline{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(transparent,rgba(92,242,198,.35),transparent);animation:scan 1.8s ease-in-out 1;pointer-events:none}
@keyframes scan{to{top:100%}}
.scanner h2{color:var(--mint);font-size:1.5rem;margin-bottom:4px}
.scanner .sub{color:#9EE9D5;margin:0 0 12px;font-size:.95rem}
.sec{background:rgba(92,242,198,.07);border-left:4px solid var(--mint);border-radius:0 16px 16px 0;padding:12px 14px;margin:12px 0}
.sec h3{font-size:1.15rem;color:var(--sun);margin-bottom:4px}
.sec p{margin:.3em 0}
.sec ul{margin:.3em 0;padding-left:1.2em}
.sec b{color:var(--mint)}
.fig{background:#fff;border-radius:16px;padding:8px;margin-top:8px}
.fig svg{display:block;width:100%;height:auto}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.icons div{background:#fff;color:#1b1340;border-radius:14px;padding:8px;text-align:center;font-size:.85rem;font-weight:700}
.icons svg{width:100%;height:auto;display:block}

/* peligro */
.danger{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle,rgba(120,0,40,.55),rgba(20,0,10,.92));animation:flash 1s steps(2) infinite}
@keyframes flash{50%{background:radial-gradient(circle,rgba(170,0,60,.6),rgba(20,0,10,.92))}}
@media (prefers-reduced-motion: reduce){.danger{animation:none}}
.dbox{max-width:480px;text-align:center;background:var(--deep);border:3px solid var(--pink);border-radius:26px;padding:24px 20px}
.dbox .sign{font-family:var(--display);font-size:2.4rem;font-weight:700;color:var(--pink);line-height:1}
.dbox svg{width:120px;height:120px;margin:4px auto}

/* prueba */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.lv{font-family:var(--display);font-weight:600;font-size:1.05rem;padding:5px 14px;border-radius:999px;background:var(--sun);color:#1b1340}
.lv.C{background:var(--sky)} .lv.P{background:var(--pink);color:#fff} .lv.A{background:var(--mint)} .lv.D{background:#B79CFF}
.lvsteps{display:flex;gap:6px}
.lvsteps span{width:26px;height:8px;border-radius:4px;background:var(--panel2)}
.lvsteps span.ok{background:var(--mint)} .lvsteps span.half{background:var(--sun)} .lvsteps span.ko{background:var(--bad)} .lvsteps span.now{background:#fff}
.integ{margin:6px 0 14px}
.integ .lab{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:14px;border-radius:7px;background:var(--deep);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint));transition:width .6s}
.second{font-size:.9rem;color:var(--sun);margin-bottom:6px;font-weight:700}
.qtext{font-family:var(--display);font-weight:500;font-size:1.3rem;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:16px;padding:12px 14px;cursor:pointer;font:inherit;line-height:1.4}
.opt.sel{border-color:var(--sun);background:#4A338F}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt.img{padding:8px;text-align:center}
.opt.img svg{display:block;width:100%;height:auto;background:#fff;border-radius:12px}
.opt.img span{display:block;font-size:.9rem;margin-top:6px}
.good{border-color:var(--mint)!important;background:#1B5E55!important}
.wrong{border-color:var(--bad)!important;background:#6B2440!important}
.locked .opt,.locked .chip,.locked .mitem,.locked .zone{pointer-events:none}
.sentence{font-size:1.1rem;line-height:2.4}
.sentence select{font:inherit;font-size:1rem;padding:5px 8px;border-radius:10px;border:2px solid var(--sun);background:var(--deep);color:var(--ink);max-width:100%}
.sentence select.good{background:#1B5E55!important} .sentence select.wrong{background:#6B2440!important}
.fillin{width:100%;max-width:320px;padding:12px 14px;border-radius:14px;border:2px solid var(--sun);background:var(--deep);color:var(--ink);font:inherit}

.pool{min-height:60px;border:2px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pool:empty::after{content:"Todas colocadas. Toca una tarjeta y luego este recuadro para devolverla.";color:var(--muted);font-size:.85rem}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bin{border:2px solid var(--line);border-radius:18px;background:var(--deep);padding:8px;min-height:120px;cursor:pointer}
.bin h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--sun);text-align:center}
.bin .drop{display:flex;flex-direction:column;gap:6px}
.bin.over{border-color:var(--sun);background:#2E2270}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;color:#1b1340;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.92rem;cursor:grab;border:3px solid transparent;line-height:1.25}
.chip.sel{border-color:var(--pink)}
.chip.lifting{opacity:.35}
.chip.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.4);transform:rotate(-3deg)}
.chip.good{border-color:var(--mint)!important;background:#D8FFF3!important}
.chip.wrong{border-color:var(--bad)!important;background:#FFE0E0!important}
.hintdrag{font-size:.85rem;color:var(--muted);margin:-4px 0 10px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .col{display:grid;gap:10px;align-content:start}
.mitem{border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;font-size:.95rem;text-align:left;position:relative;line-height:1.35}
.mitem.pick{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.mitem .tag{position:absolute;top:-9px;right:-7px;width:22px;height:22px;border-radius:50%;font-size:.8rem;font-weight:800;display:grid;place-items:center;color:#1b1340}

.hotwrap{background:#fff;border-radius:18px;padding:8px}
.hotwrap svg{display:block;width:100%;height:auto}
.zone{cursor:pointer}
.zone .hl{fill:transparent;stroke:transparent}
.zone:hover .hl{fill:rgba(67,198,240,.18)}
.zone.sel .hl{fill:rgba(255,210,63,.45);stroke:#E0A800;stroke-width:2}
.zone.lz .hl{stroke:rgba(255,210,63,.55)}
.zone.good .hl{fill:rgba(92,242,198,.55);stroke:#1B9E7A}
.zone.wrong .hl{fill:rgba(255,107,107,.5);stroke:#C0392B}
.zone path.hl{fill:none!important}
.zone.sel path.hl{stroke-width:16}.zone.good path.hl,.zone.wrong path.hl{stroke-width:16}

.fb{margin-top:16px;border-radius:18px;padding:14px 16px}
.fb.ok{background:#15473F;border:2px solid var(--mint)}
.fb.no{background:#4D1A33;border:2px solid var(--bad)}
.fb h3{font-size:1.2rem;margin-bottom:4px}
.fb .pista{margin-top:10px;background:rgba(255,210,63,.12);border-left:4px solid var(--sun);padding:8px 12px;border-radius:0 12px 12px 0}
.toast{margin-top:10px;color:var(--sun);font-weight:700;min-height:1.4em}
.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}

/* resultado parada */
.resbox{text-align:center;margin-top:14px}
.resbox h2{font-size:1.8rem}
.resbox .pct{font-family:var(--display);font-size:1.2rem;color:var(--muted);margin:4px 0 14px}

/* diploma */
.diploma{position:relative;background:#FFF8E6;color:#2A1A63;border-radius:24px;padding:28px 22px;text-align:center;border:10px solid transparent;background-clip:padding-box;box-shadow:0 0 0 4px var(--pink),0 0 0 10px var(--sun),0 0 0 14px var(--mint);margin:20px 8px}
.diploma .wm{position:absolute;inset:0;opacity:.08;pointer-events:none;overflow:hidden;border-radius:16px}
.diploma .wm svg{width:100%;height:100%}
.diploma .top{font-family:var(--display);font-size:1rem;color:#7A5BC8}
.diploma .name{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:700;margin:8px 0;color:#1E1147;border-bottom:3px dotted #C9B8F5;display:inline-block;padding:0 10px 4px}
.diploma .rank{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.1;margin:10px 0 2px;color:#B8277A}
.diploma .grade{font-family:var(--display);font-size:1.3rem;margin:6px 0 10px}
.diploma .blipd{width:120px;margin:0 auto}
.diploma table{margin:14px auto 6px;border-collapse:collapse;font-size:.9rem;text-align:left}
.diploma td,.diploma th{padding:4px 10px;border-bottom:1px solid #E6DCFB}
.diploma th{font-family:var(--display);font-weight:600}
.diploma .foot{font-size:.8rem;color:#6B5BA3;margin-top:10px}
.rules{max-width:440px;margin:0 auto 16px;text-align:left;background:#3B1840;border:2px solid var(--pink);border-radius:20px;padding:14px 16px;font-size:.95rem}
.rules h3{font-size:1.1rem;color:var(--pink);margin-bottom:4px}
.rules p{margin:.3em 0}
.exits{font-family:var(--display);font-size:.85rem;color:#1b1340;background:var(--sun);border-radius:999px;padding:2px 10px;white-space:nowrap}
.pause{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,5,30,.94)}
.pause .dbox{border-color:var(--sun)}
.pause .sign{color:var(--sun);font-size:2rem}
.dipwarn{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:700}
.stamp{position:absolute;right:14px;top:14px;width:78px;height:78px;border-radius:50%;border:3px dashed #B8277A;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#B8277A;transform:rotate(12deg);font-size:1.5rem;background:rgba(255,79,163,.07)}
@media (max-width:480px){.stamp{width:60px;height:60px;font-size:1.1rem;right:8px;top:8px}}
@media print{
  body{background:#fff}

}
.credit{text-align:center;font-family:var(--display);font-size:.9rem;letter-spacing:.02em;color:var(--ink);opacity:.4;margin:4px 0 8px}
.diploma .credit{color:#2A1A63;opacity:.35;margin:10px 0 0;font-size:.8rem}
.autoria{position:fixed;left:0;right:0;bottom:0;z-index:45;text-align:center;font-size:.68rem;line-height:1.3;padding:5px 10px calc(5px + env(safe-area-inset-bottom,0px));background:rgba(20,11,53,.88);color:var(--muted)}
main{padding-bottom:72px}
.diploma .idobra{font-size:.72rem;color:#6B5BA3;margin-top:4px}
.btn.search{background:var(--sky);color:#16103A;box-shadow:0 5px 0 #1F7FA0}
@media print{html,body{background:#fff!important}.autoria{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#555;font-size:8px;padding:2px}main{padding-bottom:0}@page{size:A4;margin:10mm}.diploma{page-break-inside:avoid;margin:6mm;padding:18px}}

.report{background:#fff;color:#1b1340;padding:10px;font-size:11px}

.report table{width:100%;border-collapse:collapse}

@media print{.printonly{display:block}.report{page-break-before:always}.diploma{zoom:.86}}
.trcard p{margin:0 0 10px}.trcard ul{margin:.2em 0;padding-left:1.2em}.trcard li{margin:.3em 0}
.fig.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.trwrap{background:#fff;border-radius:20px;padding:6px;border:3px solid var(--panel2);touch-action:manipulation}
.trwrap svg,.fig svg.trsvg{display:block;width:100%;height:auto}
.tleg{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;margin:8px 0 2px;color:inherit}
.tleg span{display:flex;align-items:center;gap:5px}.tleg i{display:inline-block;width:22px;height:6px;border-radius:3px}

<script>
/* ========= utilidades ========= */
const $ = s => document.querySelector(s);
const app = $('#app');
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zñ ]/g,'').trim();
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ========= fondo con marcas de agua ========= */
(function(){
  let stars='';
  for(let i=0;i<90;i++){const x=Math.random()*1200,y=Math.random()*900,r=Math.random()*1.6+.3;stars+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#fff" opacity="${(Math.random()*.6+.2).toFixed(2)}"/>`;}

  $('#bg').innerHTML=`<svg viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

  <rect width="1200" height="900" fill="#1E1147"/><rect width="1200" height="900" fill="url(#neb1)"/><rect width="1200" height="900" fill="url(#neb2)"/>
  ${stars}
  <g fill="none" stroke="#5CF2C6" stroke-width="3" opacity=".09">
    <path d="M60 880 L260 560 L460 880 Z M260 560 L330 880"/>
    <path d="M140 880 V800 A40 40 0 0 1 220 800 V880"/>
    <g>${lat}<line x1="1000" y1="860" x2="1048" y2="300"/><line x1="1100" y1="860" x2="1052" y2="300"/></g>
    <path d="M500 200 L560 60 L560 260 M860 200 L800 60 L800 260 M470 200 H890 M560 60 Q680 190 800 60"/>
  </g></svg>`;
})();

/* ========= Blip (extraterrestre original) ========= */

  const sweat = mood==='scared' ? '<path d="M22,-82 q4,7 0,10 q-4,-3 0,-10z" fill="#43C6F0"/>' : '';
  const arms = mood==='happy'
    ? '<path d="M-19,-44 Q-32,-56 -30,-66" stroke="#F29E38" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M19,-44 Q32,-56 30,-66" stroke="#F29E38" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="-30" cy="-69" r="5" fill="#6EE7B7"/><circle cx="30" cy="-69" r="5" fill="#6EE7B7"/>'
    : '<path d="M-19,-44 Q-30,-36 -27,-24" stroke="#F29E38" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M19,-44 Q30,-36 27,-24" stroke="#F29E38" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="-27" cy="-21" r="5" fill="#6EE7B7"/><circle cx="27" cy="-21" r="5" fill="#6EE7B7"/>';
  return `<g id="${id}" transform="translate(${x},${y}) scale(${s})"><g class="bob">
  <ellipse cx="0" cy="1" rx="22" ry="4" fill="#000" opacity=".25"/>
  <rect x="-12" y="-20" width="9" height="19" rx="4" fill="#3B2A6B"/><rect x="3" y="-20" width="9" height="19" rx="4" fill="#3B2A6B"/>
  <ellipse cx="-9" cy="-1" rx="8" ry="4" fill="#FF4FA3"/><ellipse cx="9" cy="-1" rx="8" ry="4" fill="#FF4FA3"/>
  <path d="M-21,-16 Q-24,-50 0,-52 Q24,-50 21,-16 Z" fill="#F29E38"/>
  <rect x="-10" y="-32" width="20" height="10" rx="4" fill="#DB8622"/>
  ${arms}
  <line x1="-9" y1="-88" x2="-17" y2="-108" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round"/><circle cx="-18" cy="-110" r="5" fill="#FFD23F"/>
  <line x1="9" y1="-88" x2="17" y2="-108" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="-110" r="5" fill="#FFD23F"/>
  <path d="M-30,-66 Q-30,-100 0,-100 Q30,-100 30,-66 Q30,-46 0,-46 Q-30,-46 -30,-66Z" fill="#DB8622"/>
  <ellipse cx="0" cy="-68" rx="24" ry="22" fill="#6EE7B7"/>
  <ellipse cx="-4" cy="-84" rx="10" ry="4" fill="#9CF5D6" opacity=".6"/>
  <ellipse cx="-10" cy="-69" rx="8" ry="${mood==='scared'?11:10}" fill="#1A1033"/><ellipse cx="10" cy="-69" rx="8" ry="${mood==='scared'?11:10}" fill="#1A1033"/>
  <circle cx="-7" cy="-73" r="3" fill="#fff"/><circle cx="13" cy="-73" r="3" fill="#fff"/><circle cx="-12" cy="-65" r="1.5" fill="#fff"/><circle cx="8" cy="-65" r="1.5" fill="#fff"/>
  <circle cx="-17" cy="-60" r="3" fill="#FF4FA3" opacity=".45"/><circle cx="17" cy="-60" r="3" fill="#FF4FA3" opacity=".45"/>
  ${mouth}${sweat}</g></g>`;
}
const SVG = (inner,vb='0 0 400 240',extra=(vb==='0 0 400 240'?'preserveAspectRatio="xMidYMax slice"':'')) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" ${extra}>${inner}</svg>`;

/* celosía (triangulada) */
function lattice(x1,y1,x2,y2,w,n,col='#FFD23F',sw=2){
  // vertical o horizontal según dimensiones
  let s='';
  if(Math.abs(x2-x1)<Math.abs(y2-y1)){ // vertical
    s+=`<line x1="${x1}" y1="${y1}" x2="${x1}" y2="${y2}"/><line x1="${x1+w}" y1="${y1}" x2="${x1+w}" y2="${y2}"/>`;
    const st=(y2-y1)/n; for(let i=0;i<n;i++){const ya=y1+i*st,yb=ya+st;s+=`<line x1="${x1}" y1="${ya}" x2="${x1+w}" y2="${yb}"/><line x1="${x1}" y1="${yb}" x2="${x1+w}" y2="${yb}"/>`;}
  } else {
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y1}"/><line x1="${x1}" y1="${y1+w}" x2="${x2}" y2="${y1+w}"/>`;
    const st=(x2-x1)/n; for(let i=0;i<n;i++){const xa=x1+i*st,xb=xa+st;s+=`<line x1="${xa}" y1="${y1+w}" x2="${xb}" y2="${y1}"/><line x1="${xb}" y1="${y1}" x2="${xb}" y2="${y1+w}"/>`;}
  }
  return `<g stroke="${col}" stroke-width="${sw}" stroke-linecap="round">${s}</g>`;
}

M_('¿Qué diferencia hay entre una estructura natural y una artificial?','La natural la forma la naturaleza; la artificial la construye el ser humano',['La artificial la forma la naturaleza; la natural la construye el ser humano','La natural es siempre más resistente que cualquier estructura artificial','La artificial no soporta esfuerzos y la natural sí es capaz de soportarlos'],'Natural: la forma la naturaleza. Artificial: la construyen las personas.'),
M_('Si una estructura es resistente pero no es rígida, ¿qué le ocurrirá al cargarla?','No llegará a romperse, pero se deformará bastante al cargarla',['Se romperá enseguida, aunque antes no llegue a deformarse nada','Volcará entera, aunque ninguna de sus piezas llegue a deformarse','No le pasará nada, porque con ser resistente ya es suficiente'],'Resistente: no se rompe. Si no es rígida, se deforma.'),
D_('Clasifica: ¿es una fuerza o un esfuerzo?',['Fuerza','Esfuerzo'],[['El viento que empuja una vela',0],['El peso de un coche sobre un puente',0],['Una persona que empuja una puerta',0],['La tensión interna de una cuerda estirada',1],['La tensión dentro de una viga cargada',1],['La tensión interna de un pilar aplastado',1]],'Las acciones externas son fuerzas; las tensiones internas, esfuerzos.'),
M_('¿Por qué un cuerpo que no se mueve puede estar soportando fuerzas?','Porque las fuerzas pueden deformarlo o tensarlo por dentro aunque siga en reposo',['Porque las fuerzas sólo existen cuando un cuerpo ya está en movimiento','Porque un cuerpo quieto nunca recibe fuerzas, sólo esfuerzos externos','Porque la gravedad deja de actuar cuando un cuerpo está en reposo'],'Las fuerzas también tienen efecto estático: deforman o tensan aunque no haya movimiento.')
],
P:[
D_('Clasifica estas estructuras según su origen:',['Estructura natural','Estructura artificial'],[['Esqueleto humano',0],['Caparazón de una tortuga',0],['Tronco de un árbol',0],['Puente de hierro',1],['Grúa torre',1],['Estantería',1]],'Las naturales las forma la naturaleza; las artificiales, las personas.'),
D_('Clasifica estas estructuras según su origen:',['Estructura natural','Estructura artificial'],[['Concha de un caracol',0],['Panal de abejas',0],['Tela de araña',0],['Torre Eiffel',1],['Silla de madera',1],['Esqueleto de un edificio',1]],'Panal y tela de araña los construyen animales: son naturales.'),
M_('Blip quiere saber si un objeto es una estructura. ¿Qué debe comprobar?','Si es capaz de soportar esfuerzos sin romperse, deformarse ni volcar',['Si está hecho de hormigón, acero o algún otro material de obra','Si tiene forma de triángulo o de arco en alguna de sus partes','Si lo ha fabricado una persona y no la propia naturaleza'],'Lo que define una estructura es que soporta esfuerzos.'),
X_('Relaciona cada construcción con su tipo de estructura.',[['Muralla de un castillo','Masiva'],['Aparcamiento de hormigón','Entramada'],['Grúa torre','Triangulada'],['Teleférico','Colgante']],'Muralla: masiva. Aparcamiento: entramada. Grúa: triangulada. Teleférico: colgante.'),
M_('Un puente recibe el empuje del viento y el peso de los coches. ¿Qué afirmación es correcta?','Son dos fuerzas externas distintas que provocan esfuerzos dentro del puente',['Son dos esfuerzos internos que el puente produce por sí mismo sin ayuda','Sólo el peso de los coches es una fuerza; el empuje del viento no cuenta','Ninguna de las dos afecta al puente si está bien construido y cimentado'],'Viento y peso son fuerzas externas; dentro del puente provocan esfuerzos.'),
M_('Blip ve una tienda de campaña: varillas, lona y cuerdas atadas a piquetas. ¿Qué parte forma la estructura?','Las varillas, las cuerdas tensas y las piquetas, que soportan los esfuerzos',['Sólo la lona exterior, porque es la parte que se ve desde fuera','Ninguna de ellas: una tienda de campaña no se considera estructura','Sólo el aire del interior, que empuja la lona hacia fuera'],'La estructura son los elementos que soportan esfuerzos: varillas, cuerdas y piquetas.'),
X_('Relaciona cada problema con la propiedad que le falta a la estructura.',[['La estantería se vuelca','Estabilidad'],['La balda se parte','Resistencia'],['El marco se tuerce','Rigidez']],'Volcar: estabilidad. Romperse: resistencia. Deformarse: rigidez.'),
D_('Clasifica: ¿es una fuerza o un esfuerzo?',['Fuerza','Esfuerzo'],[['La gravedad que tira de una lámpara',0],['Una ola que golpea un dique',0],['Un niño que tira de una cuerda',0],['La tensión dentro del cable de la lámpara',1],['La tensión interna del dique golpeado',1],['La tensión que sufre la cuerda por dentro',1]],'Fuerzas: acciones externas. Esfuerzos: tensiones internas.'),
M_('Blip coloca un libro sobre una mesa y no se ve ningún cambio. ¿Hay esfuerzos en la mesa?','Sí: el peso del libro produce tensiones internas en la mesa aunque no se vean',['No: si no se ve ninguna deformación en la mesa, no existe ningún esfuerzo','No: los esfuerzos sólo aparecen cuando la mesa se mueve o se desplaza','Sí, pero sólo dentro del libro, y nunca en la mesa que lo está sosteniendo'],'Toda carga provoca esfuerzos, aunque la deformación sea tan pequeña que no se vea.'),
M_('¿Cuál de estos NO es una estructura?','El agua de un vaso',['El tronco de un árbol','La carcasa de un ordenador','Una estantería metálica'],'El agua no soporta esfuerzos ni mantiene su forma.')
],
A:[
X_('Relaciona cada tipo de estructura con un ejemplo.',[['Masiva','Pirámide de Keops'],['Entramada','Edificio de pilares y vigas de hormigón'],['Triangulada','Torre eléctrica'],['Colgante','Puente Golden Gate']],'Pirámide: masiva. Edificio de pilares: entramada. Torre eléctrica: triangulada. Golden Gate: colgante.'),
X_('Relaciona cada construcción con su tipo de estructura.',[['Presa de gravedad','Masiva'],['Bloque de viviendas','Entramada'],['Cercha de un tejado','Triangulada'],['Puente atirantado','Colgante']],'Presa: masiva. Bloque: entramada. Cercha: triangulada. Atirantado: colgante.'),
D_('Clasifica cada construcción según su tipo de estructura:',['Masiva','Entramada','Triangulada','Colgante'],[['Pirámide de Keops',0],['Acueducto de Segovia',0],['Bloque de pisos',1],['Aparcamiento de plantas',1],['Grúa torre',2],['Torre Eiffel',2],['Teleférico',3],['Golden Gate',3]],'Dos ejemplos de cada tipo.'),
D_('Clasifica cada construcción según su tipo de estructura:',['Masiva','Entramada','Triangulada','Colgante'],[['Catedral gótica',0],['Muralla medieval',0],['Casa de pilares de madera',1],['Oficinas de hormigón',1],['Cercha de tejado',2],['Puente metálico de celosía',2],['Lámpara de techo',3],['Puente atirantado',3]],'Dos ejemplos de cada tipo.'),
S_('Completa el diagnóstico de Blip:',['Una estantería se vuelca: le falta ',o_(['estabilidad','resistencia','rigidez']),'. Una balda se parte: le falta ',o_(['resistencia','estabilidad','rigidez']),'. Un marco se tuerce: le falta ',o_(['rigidez','estabilidad','resistencia']),'.'],'Volcar: estabilidad. Romperse: resistencia. Deformarse: rigidez.'),
M_('Blip quiere una torre de 300 m muy ligera para su antena. ¿Qué tipo de estructura elegirías?','Triangulada, porque sus barras en triángulo son ligeras, resistentes y no se deforman',['Masiva, porque los muros macizos de piedra pesan mucho y por eso aguantan mejor','Colgante, porque unos cables colgados del cielo sostendrían bien la torre','Ninguna, porque las torres tan altas no necesitan ninguna estructura interior'],'Para mucha altura con poco peso, la triangulada es la mejor opción.'),
M_('Para construir un edificio de viviendas de 8 plantas, ¿qué estructura se usa normalmente?','Entramada: pilares y vigas de hormigón armado formando una retícula',['Masiva: muros de piedra de varios metros de grosor en todas las plantas','Colgante: cada planta cuelga de cables sujetos a una torre central','Triangulada: barras de madera finas formando triángulos en las paredes'],'La mayoría de edificios son entramados de hormigón armado.'),
S_('Completa con el ejemplo del árbol:',['El viento que empuja el árbol es una ',o_(['fuerza','estructura','cimentación']),' y la tensión que aparece en el tronco es un ',o_(['esfuerzo','movimiento','material']),'.'],'Viento: fuerza. Tensión interna del tronco: esfuerzo.'),
D_('Clasifica según el efecto de la fuerza:',['Efecto estático (deforma)','Efecto dinámico (movimiento)'],[['Aplastar una lata',0],['Doblar una regla',0],['Estirar un muelle',0],['Chutar un balón parado',1],['Frenar una bicicleta',1],['Empujar un carrito quieto',1]],'Deformar: estático. Cambiar el movimiento o el reposo: dinámico.'),
M_('Un compañero dice: «una cuerda no es una estructura porque es blanda». ¿Tiene razón?','No: si la cuerda soporta esfuerzos, como al sostener un peso, actúa como estructura',['Sí: sólo los objetos duros y rígidos pueden considerarse estructuras de verdad','Sí: una cuerda sólo transmite fuerzas de un sitio a otro, nunca soporta esfuerzos','No: la cuerda es una estructura porque siempre está fabricada con hilos de acero'],'Lo que importa es si soporta esfuerzos: una cuerda tensa soporta tracción.')
],
D:[
M_('Hay que construir un puente peatonal muy largo y ligero sobre un río ancho y profundo. ¿Qué tipo de estructura es la más adecuada?','Colgante: los cables de acero trabajan a tracción y salvan grandes distancias con poco peso',['Masiva: un gran muro de piedra maciza que atraviese el río de una orilla a la otra','Entramada: muchos pilares de hormigón muy juntos plantados en el fondo del río','Ninguna estructura: basta con un tablón largo apoyado en las dos orillas del río'],'Para grandes distancias con poco peso, los cables de una colgante son la mejor solución.'),
M_('Un puente es muy resistente y rígido, pero una crecida lo arrastra entero sin romperlo. ¿Qué propiedad le faltaba?','Estabilidad: no estaba bien cimentado ni anclado al terreno',['Resistencia: sus piezas no soportaban los esfuerzos del agua','Rigidez: su forma se deformaba demasiado con la corriente','Ninguna: si es resistente y rígido ya cumple con todas'],'Si se desplaza entero sin romperse ni deformarse, le falta estabilidad.'),
M_('Para una caseta de jardín pequeña y barata, ¿qué estructura y material elegirías?','Entramada de madera: ligera, fácil de trabajar y suficiente para algo pequeño',['Masiva de piedra: muros gruesos para que dure varios miles de años','Colgante de acero: cables gigantes sujetos a dos torres muy altas','Triangulada de acero: como una torre eléctrica de gran altura'],'La madera se usa en construcciones de pequeño tamaño.'),
M_('Una carpa de circo debe montarse y desmontarse rápido. ¿Qué solución encaja mejor?','Mástiles y lona sujetos con cables tensos anclados al suelo: ligera y desmontable',['Muros de hormigón macizo con una gran bóveda de piedra por encima: muy duradera','Pilares y vigas de hormigón armado, como un edificio de pisos: muy resistente','Una pirámide de bloques de piedra apilados sin cemento: muy fácil de mover'],'Cables tensos y lona: estructura colgante ligera y desmontable.'),
M_('Una grúa de obra tiene que ser alta, ligera y soportar mucho peso. ¿Por qué se construye triangulada y no masiva?','Una masiva pesaría demasiado y no se podría montar; la triangulada es ligera y rígida',['Porque la piedra no se puede encontrar en las ciudades donde se hacen las obras','Porque una masiva sería demasiado ligera y cualquier golpe de viento la volcaría','Porque las masivas sólo pueden construirse en el desierto, como las pirámides'],'Triangulada: mucha rigidez con poco peso, ideal para grúas.'),
M_('Al cargar una mesa vieja, sus patas se abren y la mesa se tuerce sin romperse. ¿Qué le falla?','La rigidez: sus uniones no están reforzadas y la mesa se deforma',['La estabilidad: la mesa vuelca hacia un lado por su base pequeña','La resistencia: las patas se parten en trozos por el peso','Nada: es normal que una mesa se deforme siempre que se carga'],'Deformarse sin romperse ni volcar indica falta de rigidez.'),
M_('Blip quiere salvar un barranco de 1 km con el menor peso posible. ¿Qué elemento será clave?','Cables de acero trabajando a tracción, sujetos a torres y anclajes',['Muros macizos de piedra apoyados en el fondo del barranco','Bóvedas de ladrillo que vayan de una orilla hasta la otra','Pilares de madera colocados cada pocos metros por el barranco'],'Los cables de acero salvan grandes distancias con muy poco peso.'),
M_('¿Por qué los huesos de las patas de un elefante son tan gruesos?','Porque soportan mucho peso y necesitan más resistencia frente a la compresión',['Porque así el animal es más ligero y puede correr más deprisa','Porque los huesos de las patas trabajan sobre todo a torsión','Porque los huesos gruesos se deforman más y amortiguan los golpes'],'El esqueleto es una estructura: las patas de un animal pesado sufren gran compresión.'),
M_('Una estantería alta y estrecha tiene los libros pesados arriba y nada abajo. ¿Qué cambio la haría más segura sin añadir piezas?','Colocar los libros pesados abajo para bajar el centro de gravedad',['Colocar más libros arriba para que haga más fuerza contra la pared','Quitar las baldas de abajo para que la estantería pese menos','Repartir los libros sólo en la balda más alta y dejar el resto vacío'],'Peso abajo = centro de gravedad bajo = más estabilidad.'),
M_('Un puente de folio plano se dobla, pero el mismo folio doblado en forma de U aguanta mucho más. ¿Por qué?','Porque la forma del perfil aumenta su altura y su rigidez frente a la flexión',['Porque al doblarlo el papel se convierte en un material más duro','Porque el papel doblado pesa menos y por eso se curva menos','Porque así el papel trabaja sólo a torsión, que resiste mucho mejor'],'Las propiedades dependen también de la forma: más altura de sección, más rigidez.')
]},

R:[
M_('Blip toca las paredes de la pirámide. Según su escáner, las estructuras masivas están formadas por…','Superficies resistentes, pesadas y macizas',['Barras unidas formando triángulos','Cables que cuelgan de torres altas','Una rejilla de pilares y vigas'],'Las masivas son macizas y pesadas: aguantan gracias a su gran cantidad de material.'),
F_('Completa: los elementos característicos de una estructura masiva son los muros, las bóvedas y los ________.',['arcos','arco'],'Muros, bóvedas y arcos son los elementos típicos de las masivas.'),
F_('Completa: las piedras con forma de cuña que forman un arco se llaman ________.',['dovelas','dovela'],'Las piezas de un arco se llaman dovelas.'),
S_('Completa la ficha del escáner:',['Los elementos de las estructuras masivas son los ',o_(['muros','pilotes','cables']),', las ',o_(['bóvedas','barras','péndolas']),' y los ',o_(['arcos','tirantes','perfiles']),'.'],'Muros, bóvedas y arcos.'),
M_('¿A qué esfuerzo trabajan principalmente los arcos de piedra?','Compresión',['Tracción','Torsión','Cortadura'],'Las dovelas se aprietan unas contra otras: compresión.'),
M_('¿Cuál de estos es un ejemplo de estructura masiva?','Las pirámides de Egipto',['La Torre Eiffel de París','El puente Golden Gate','Una grúa torre de obra'],'Las pirámides son el ejemplo clásico de estructura masiva.'),
X_('Relaciona cada tipo de arco con su forma.',[['Medio punto','Medio círculo exacto'],['Apuntado','Dos curvas que se unen en punta'],['Herradura','Más de medio círculo, cerrado abajo'],['Lobulado','Formado por varias curvas pequeñas']],'Son los cuatro arcos clásicos.'),
I_('¿Cuál de estos es un arco de MEDIO PUNTO?','arc',[['medio',''],['apuntado',''],['herradura',''],['lobulado','']],0,'El de medio punto es exactamente medio círculo.'),
I_('¿Cuál de estos es un arco APUNTADO?','arc',[['medio',''],['apuntado',''],['herradura',''],['lobulado','']],1,'El apuntado está formado por dos curvas que terminan en punta.'),
M_('¿Qué es una bóveda?','Un techo curvo de piedra, como un arco alargado',['Un pilar vertical que sostiene una viga','Un cable grueso que sujeta un tablero','Una barra diagonal colocada en un marco'],'La bóveda es como un arco alargado que forma un techo.')
],
C:[
M_('En el pasillo hay un arco de piedras sin cemento que no se cae. ¿Por qué aguanta?','Cada dovela empuja a la de al lado y todas trabajan a compresión, llevando el peso hacia los apoyos',['Las piedras trabajan a tracción, como una cuerda tensa que tira de los apoyos hacia el centro del arco','La piedra central está pegada con un mortero oculto y es la única que sujeta a todas las demás','El arco trabaja a torsión: las piedras se retuercen unas contra otras y así quedan bloqueadas'],'Las dovelas se aprietan unas contra otras: el arco trabaja a compresión.'),
M_('Cerca de las pirámides hay una presa de hormigón mucho más gruesa abajo que arriba. ¿Por qué?','Abajo el agua empuja con más fuerza y, además, tener el peso en la base la hace más estable',['Arriba se ahorra material para que la presa quede más bonita y se pueda pasear por encima','Así el agua puede pasar por encima con facilidad cuando el embalse está completamente lleno','Porque el hormigón resiste mejor la tracción en la parte baja y peor en la parte alta de la presa'],'El empuje del agua crece con la profundidad, y el peso abajo da estabilidad.'),
M_('¿Por qué las estructuras masivas son tan estables?','Porque son muy pesadas y tienen mucho material en su base',['Porque sus barras forman triángulos que no se deforman','Porque cuelgan de cables muy resistentes a la tracción','Porque son muy ligeras y el viento apenas las empuja'],'Mucho peso y base ancha: gran estabilidad.'),
M_('¿Cuál es el principal inconveniente de las estructuras masivas?','Pesan muchísimo, gastan mucho material y son lentas de construir',['Son poco estables y el viento las vuelca con mucha facilidad','Duran muy poco tiempo porque la piedra se rompe enseguida','Sólo resisten la tracción y se rompen cuando las aplastan'],'Son estables y duraderas, pero pesadas, caras y lentas de construir.'),
M_('¿Por qué la piedra es buena para arcos pero mala para una viga larga?','Resiste muy bien la compresión, pero se rompe con facilidad a flexión y tracción',['Resiste muy bien la tracción, pero se rompe con facilidad a compresión','Es demasiado ligera para soportar el peso de un tejado plano','Se dobla como una goma y por eso sólo sirve en forma de arco'],'En el arco la piedra trabaja a compresión; una viga trabajaría a flexión.'),
M_('En una catedral, ¿qué función cumplen los muros gruesos?','Soportan el peso de las bóvedas y lo llevan hasta el suelo',['Sirven sólo como decoración y no soportan ningún peso','Tiran de las bóvedas hacia arriba como si fueran cables','Permiten que el edificio se balancee con el viento sin romperse'],'Los muros reciben el peso de bóvedas y arcos y lo transmiten al suelo.'),
M_('¿Cómo reparte el peso un arco de piedra?','Cada dovela empuja a la siguiente y el peso baja siguiendo la curva hasta los apoyos',['Cada dovela tira de la siguiente como los eslabones de una cadena colgada','La dovela central sostiene ella sola todo el peso y las demás sólo decoran','El arco gira un poco sobre sí mismo y así el peso se va anulando'],'El peso se transmite de dovela en dovela, a compresión, hacia los apoyos.'),
M_('¿Por qué las pirámides han durado miles de años?','Son masivas: su gran peso y su base ancha las hacen muy estables',['Están hechas de acero inoxidable que no se oxida con el tiempo','Están formadas por triángulos de barras que no se deforman','Cuelgan de cables enterrados que las sujetan al suelo'],'Peso y base ancha: estabilidad muy alta.'),
D_('Clasifica estos elementos:',['Elemento de estructura masiva','Elemento de otro tipo'],[['Muro',0],['Bóveda',0],['Arco',0],['Viga',1],['Cable',1],['Barra en triángulo',1]],'Muros, bóvedas y arcos son de las masivas.'),
M_('¿Por qué los puentes romanos de piedra tienen forma de arco y no son planos?','Porque en arco la piedra trabaja a compresión, que es lo que mejor soporta',['Porque en arco la piedra trabaja a tracción, que es lo que mejor soporta','Porque los romanos no sabían cortar piedras con forma recta','Porque el arco hace que el puente pese mucho menos que uno plano'],'La piedra resiste muy bien la compresión, y el arco la hace trabajar así.')
],
P:[
I_('Blip quiere construir un refugio de piedra sin cemento. ¿Qué techo aguantará mejor el peso?','',[['losa','Losa plana sobre dos muros'],['boveda','Bóveda de piedras en arco'],['ramas','Tejado de ramas finas'],['columna','Columna alta de piedras sueltas']],1,'En la bóveda todas las piedras trabajan a compresión; una losa plana trabajaría a flexión y se partiría.'),
M_('Si quitas una piedra suelta de un muro muy grueso, normalmente no pasa nada. ¿Y si quitas una dovela de un arco?','El arco puede venirse abajo, porque cada dovela se sostiene gracias a las demás',['No pasa nada, porque en un arco cada piedra aguanta su propio peso sin depender de las otras','El arco se vuelve más rígido, porque al quitar peso las demás piedras se aprietan todavía más','Sólo se cae si el arco es de herradura; los de medio punto aguantan aunque les falten piezas'],'Las dovelas se sostienen unas a otras; si falta una, se rompe la cadena de compresión.'),
I_('¿Cuál de estos techos de piedra se partiría primero al cargarlo?','',[['losa','Losa plana sobre dos muros'],['boveda','Bóveda de piedras en arco'],['piramide','Pirámide maciza']],0,'La losa plana trabaja a flexión, y la piedra resiste mal la flexión.'),
I_('Blip ve un arco que se cierra hacia abajo, más que medio círculo. ¿Cuál es?','arc',[['medio',''],['apuntado',''],['herradura',''],['lobulado','']],2,'Es el arco de herradura.'),
M_('Un muro de piedra muy alto y fino se balancea. ¿Qué harías para que fuera más estable sin cambiar de material?','Hacerlo más ancho en la base, como una presa',['Hacerlo más alto para que pese más arriba','Hacerlo más fino para que el viento pase','Quitarle la cimentación para que se mueva'],'Base ancha y peso abajo dan estabilidad.'),
M_('¿Qué forma de techo usarías para cubrir con ladrillos un túnel largo?','Una bóveda: un arco alargado en el que los ladrillos trabajan a compresión',['Una losa plana de ladrillos, que trabajarían sobre todo a flexión','Un techo colgado de cables de ladrillo que trabajen a tracción','Una cercha de ladrillos unidos formando triángulos ligeros'],'La bóveda hace trabajar al ladrillo a compresión.'),
D_('¿Es buena idea construir esto con piedra?',['Buena idea con piedra','Mala idea con piedra'],[['Arco',0],['Muro grueso',0],['Bóveda',0],['Viga larga y plana',1],['Cable colgante',1],['Losa fina muy larga',1]],'La piedra va bien a compresión (arcos, muros, bóvedas) y mal a flexión o tracción.'),
M_('Una presa de gravedad aguanta el empuje del agua sin cables ni barras. ¿Gracias a qué?','A su enorme peso y a su base ancha, que le dan estabilidad',['A unos cables ocultos que la sujetan desde la otra orilla','A que el agua del embalse tira de ella hacia arriba','A que está hecha de barras de acero formando triángulos'],'Es masiva: aguanta por su propio peso.'),
M_('Blip apila piedras sin pegar formando un arco, pero se cae antes de colocar la última. ¿Por qué?','Hasta colocar la dovela central, las demás no pueden apoyarse entre sí',['Los arcos sólo aguantan si sus piedras están pegadas con cemento','La piedra no resiste la compresión y se aplasta al apilarla','Un arco sólo se sostiene si está colgado de un cable'],'El arco funciona cuando todas las dovelas se empujan entre sí.'),
M_('¿Qué pasaría si construyeras una pirámide boca abajo, apoyada en su punta?','Volcaría: su base sería mínima y todo el peso quedaría arriba',['Sería más estable, porque el peso empujaría hacia el suelo','Aguantaría igual, porque la forma no influye en la estabilidad','Sería más ligera y resistiría mejor los terremotos'],'Base pequeña y peso arriba: muy inestable.')

D:[

I_('Llega un fuerte terremoto a una región con construcciones de piedra. ¿Cuál tiene más posibilidades de resistir?','',[['muroFino','Muro alto y delgado'],['piramide','Pirámide ancha y baja'],['torrePesada','Torre con remate pesado arriba']],1,'Base ancha y peso abajo: la pirámide es la más estable.'),
M_('¿Por qué hoy casi no se construyen castillos con muros de varios metros de grosor?','Hay estructuras más ligeras y baratas, como las entramadas de hormigón armado',['Porque la piedra se ha agotado y ya no se encuentra en ninguna parte','Porque los muros gruesos son muy inestables y se caen con facilidad','Porque las masivas no resisten la compresión que produce el tejado'],'Las masivas son caras, pesadas y lentas; hoy hay alternativas más ligeras.'),
M_('Si un arco se construyera con piezas de goma blanda en vez de piedra, ¿qué pasaría?','Se aplastaría y deformaría, porque la goma resiste mal la compresión',['Aguantaría más, porque la goma es más ligera que la piedra','Funcionaría igual, porque en un arco el material no importa','Trabajaría a tracción y sería más resistente que uno de piedra'],'El arco necesita un material que resista bien la compresión.'),
M_('En una presa, ¿dónde conviene que el muro sea más grueso y por qué?','Abajo, porque ahí el agua empuja más y el peso en la base da estabilidad',['Arriba, porque ahí el agua empuja más y conviene tener más peso','En el centro, porque es donde el muro trabaja a torsión','Igual en todas partes, porque el agua empuja lo mismo arriba y abajo'],'El empuje crece con la profundidad.'),
M_('¿Por qué las catedrales tardaban décadas en construirse?','Eran masivas: había que tallar y colocar enormes cantidades de piedra',['Había que esperar a que el acero se enfriara entre una planta y otra','Sus cables tardaban años en tensarse por completo','El hormigón armado tardaba muchos años en fraguar'],'Las masivas necesitan muchísimo material y trabajo.'),
M_('Blip quiere un refugio que aguante tormentas durante siglos y no le importa el peso. ¿Qué elegirías?','Una estructura masiva de piedra con muros gruesos y bóveda',['Una tienda de lona ligera sujeta con cables finos','Una estructura triangulada de palos de madera fina','Una caseta de tablas colgada de las ramas de un árbol'],'Las masivas son muy estables y duraderas.'),
M_('¿Por qué un arco necesita apoyos firmes a ambos lados?','El peso baja por la curva y empuja hacia los apoyos; si ceden, el arco se abre y cae',['El arco tira de los apoyos hacia arriba como si fuera un cable tenso que los levanta','Los apoyos sólo sirven de decoración, porque el arco se sostiene en el aire él solo','El arco trabaja a torsión, y los apoyos sólo impiden que gire sobre sí mismo'],'El arco descarga su peso en los apoyos.'),
M_('Un pueblo quiere un puente de piedra de un solo arco de 500 m sobre un río. ¿Es buena idea?','No: un arco de piedra tan largo pesaría demasiado; mejor un puente colgante',['Sí: cuanto más largo es un arco de piedra, más resistente se vuelve','Sí: la piedra resiste muy bien la tracción en los tramos largos','No: la piedra no resiste la compresión y el arco se estiraría'],'Para grandes distancias, las estructuras colgantes son más ligeras.'),
M_('¿Qué tienen en común una presa, una pirámide y una muralla para ser tan estables?','Mucho peso y una base ancha que baja su centro de gravedad',['Barras en triángulo que impiden que se deformen','Cables tensos que las sujetan al terreno','Un material ligero que el viento no puede empujar'],'Son masivas: estables por su peso y su base.')
]},

M_('¿Qué es una cercha?','Una estructura de barras en triángulo que sostiene tejados y naves',['Un bloque de hormigón que reparte el peso de un pilar en el suelo','Un cable vertical que cuelga del cable principal de un puente','Una piedra con forma de cuña que forma parte de un arco'],'La cercha es el elemento típico de las trianguladas.'),

M_('¿Qué material se usa en la mayoría de edificios entramados?','Hormigón armado',['Piedra maciza','Vidrio templado','Ladrillo hueco'],'El hormigón armado se usa en la mayoría de construcciones.'),

C:[
M_('La grúa está hecha de triángulos y no de cuadrados. ¿Por qué?','El triángulo es el único polígono que no se deforma, aunque sus uniones puedan girar',['Porque los triángulos gastan más material y así la grúa pesa más y el viento no la mueve','Porque los cuadrados sólo sirven para estructuras de madera y la grúa está hecha de acero','Sólo por estética: los triángulos quedan más modernos y se ven mejor desde lejos en la obra'],'El cuadrado articulado se deforma; el triángulo no.'),
M_('¿Para qué sirve la zapata que hay debajo de cada pilar?','Aumenta la superficie de apoyo del pilar y reparte su peso sobre el suelo',['Une dos vigas entre sí para que el suelo de cada planta quede horizontal','Protege la base del pilar de la humedad del terreno para que no se oxide','Sujeta el tejado con cables para que el viento no lo levante en las tormentas'],'La zapata reparte el peso del pilar sobre más terreno.'),
M_('¿A qué esfuerzos trabaja principalmente una viga?','Flexión y cortadura',['Sólo a tracción','Torsión y pandeo','Sólo a compresión'],'La viga soporta flexión y cortadura.'),
M_('¿Por qué las trianguladas se usan en construcciones largas y ligeras?','Con poco material consiguen mucha resistencia y rigidez',['Son las estructuras más pesadas y macizas que existen','Sus barras trabajan sólo a torsión, que es muy resistente','No necesitan uniones entre sus barras para sostenerse'],'Ligeras y resistentes: ideales para grandes luces.'),
M_('¿Qué es el hormigón armado?','Hormigón con barras de acero en su interior para resistir mejor',['Hormigón mezclado con virutas de madera para que pese menos','Hormigón pintado por fuera para protegerlo de la lluvia','Hormigón sin agua que se coloca en bloques secos ya hechos'],'El acero le aporta la resistencia a tracción que le falta al hormigón.'),
M_('En una cercha, ¿a qué esfuerzos trabajan sus barras?','A tracción o a compresión, según la barra',['Sólo a torsión, porque giran sobre sus uniones','Sólo a flexión, porque todas se curvan con el peso','A ninguno, porque las barras no soportan esfuerzos'],'Las barras de una triangulada trabajan a tracción o compresión.'),
M_('¿Para qué sirven las viguetas?','Se apoyan en las vigas y sostienen el suelo de cada planta',['Se clavan en el terreno hasta llegar a la roca dura','Sujetan las torres de un puente colgante al suelo','Unen dos pilares en diagonal para formar triángulos'],'Las viguetas se apoyan en las vigas.'),
M_('¿Por qué el perfil doble T se usa tanto en vigas?','Porque resiste muy bien la flexión con poco material',['Porque sólo resiste la tracción, igual que un cable','Porque es el perfil más pesado y por eso aguanta más','Porque es el único perfil que no se oxida nunca'],'El doble T se usa sobre todo para flexión.'),
M_('¿Por qué una estructura entramada pesa mucho menos que una masiva del mismo tamaño?','Porque sólo tiene material en pilares y vigas, y el resto queda hueco',['Porque sus muros son de una piedra más ligera de lo normal','Porque cuelga de cables que le quitan todo el peso','Porque sus barras trabajan a torsión y eso las aligera'],'La retícula de pilares y vigas usa mucho menos material.'),
M_('¿Qué diferencia hay entre una zapata y una losa?','La zapata va bajo un pilar; la losa es una gran base bajo todo el edificio',['La losa va bajo un pilar; la zapata es una gran base bajo todo el edificio','La zapata es de madera y la losa siempre es de acero','Ninguna: son dos nombres distintos para el mismo elemento'],'Zapata: bajo cada pilar. Losa: base grande para suelos blandos.')

M_('Hay que construir sobre un terreno blando y uniforme sin roca cerca. ¿Qué cimentación eliges?','Una losa: una gran base que reparte el peso sobre todo el terreno',['Zapatas pequeñas y aisladas bajo cada uno de los pilares','Pilotes hasta la roca, aunque no haya roca a la que llegar','Ninguna: basta con apoyar los pilares sobre el barro'],'La losa permite asentarse en suelos blandos.'),
D_('Elige la cimentación adecuada para cada caso:',['Zapata','Losa','Pilote'],[['Terreno firme y pilares separados',0],['Caseta pequeña sobre roca',0],['Suelo blando sin roca cerca',1],['Edificio sobre arena blanda extensa',1],['Arcilla blanda con roca a 15 m',2],['Puente sobre un río con roca profunda',2]],'Firme: zapata. Blando extenso: losa. Roca profunda: pilotes.'),

],
D:[
M_('Hay que cubrir una nave industrial gigante sin columnas en medio para que entren camiones. ¿Qué solución elegirías?','Cerchas trianguladas de acero, ligeras y capaces de salvar grandes distancias',['Una bóveda maciza de piedra, muy pesada y resistente, apoyada sobre muros gruesos','Un techo de lona sin estructura, tensado sólo con cuerdas atadas a los camiones','Muchos pilares finos repartidos por el centro para que el techo no pueda doblarse'],'Las cerchas trianguladas cubren grandes luces sin apoyos intermedios.'),
M_('Se va a construir un edificio sobre arcilla blanda, y la roca dura está a 12 metros. ¿Qué cimentación es la más adecuada?','Pilotes que atraviesan la arcilla y se apoyan en la roca dura',['Zapatas pequeñas en la superficie, que son más baratas y rápidas','Ninguna: los pilares se apoyan directamente sobre la arcilla blanda','Una bóveda de piedra enterrada justo debajo de la planta baja'],'Los pilotes llegan hasta la roca firme.'),
M_('En un edificio se quita un pilar de la planta baja. ¿Qué es lo más probable?','La viga que se apoyaba en él se doblará mucho y la zona puede hundirse',['Nada, porque las vigas cuelgan del tejado y no necesitan pilares','El edificio será más estable porque pesará un poco menos','Los demás pilares trabajarán a tracción y lo compensarán'],'Sin ese apoyo, la viga queda con mucha más luz y se flexiona.'),
M_('Si alguien quitara todas las diagonales de una torre eléctrica, ¿qué pasaría?','Se deformaría con el viento y podría caer, porque perdería la triangulación',['Nada, porque las diagonales sólo sirven para que sea más bonita','Sería más rígida, porque tendría menos barras que se puedan mover','Pesaría más y por eso sería todavía más estable'],'Sin diagonales quedan cuadrados articulados que se deforman.'),
M_('¿Por qué para la Torre Eiffel se eligió una estructura triangulada de hierro?','Porque así podía ser muy alta, ligera y rígida a la vez',['Porque en aquella época no había piedra en Francia','Porque las trianguladas son las más pesadas y estables','Porque el hierro no necesita uniones entre sus piezas'],'Triangulación: altura y rigidez con poco peso.'),
M_('Una viga de madera de un granero se dobla demasiado. ¿Cuál es una buena solución?','Poner un pilar en el centro o usar una viga con más canto',['Poner una viga más fina para que pese menos','Pintarla para que la madera se vuelva más dura','Quitar los apoyos de los extremos para que se mueva'],'Columnas intermedias o más canto reducen la flexión.'),
M_('Para un puente de 30 m para camiones, ¿por qué se usan vigas doble T de acero y no listones planos?','El doble T resiste muy bien la flexión; el listón plano sólo sirve a tracción',['El listón plano resiste muy bien la flexión; el doble T sólo sirve a tracción','Porque el listón plano pesa muchísimo más que el doble T','Porque el doble T trabaja sólo a torsión y nunca se dobla'],'La viga del puente trabaja a flexión: perfil doble T.'),
M_('Una grúa torre tiene un contrapeso en el brazo corto. ¿Para qué sirve?','Para equilibrar la carga del brazo largo y que la grúa no vuelque',['Para que la grúa pese más arriba y sea menos estable','Para estirar los cables y que trabajen a compresión','Para que el brazo largo pueda girar sin necesidad de motor'],'El contrapeso mejora la estabilidad.'),
M_('Se construye un edificio entramado en zona de terremotos. ¿Qué conviene añadir?','Barras diagonales (triangulación) y uniones rígidas en los nudos',['Pilares más finos y separados para que el edificio pese menos','Más plantas encima para que su propio peso lo sujete al suelo','Quitar la cimentación para que el edificio se mueva libremente'],'Triangulación y uniones rígidas dan rigidez frente a empujes laterales.'),
M_('¿Por qué los pilares de las plantas bajas de un rascacielos son más gruesos que los de arriba?','Soportan el peso de todas las plantas de encima y trabajan a más compresión',['Trabajan a tracción porque el edificio tira de ellos hacia arriba','Así el edificio pesa más arriba y resulta más estable','Porque abajo el viento sopla más fuerte que arriba'],'Cuanto más abajo, más peso acumulado: más compresión.')
]},

M_('¿A qué esfuerzo trabajan las torres de un puente colgante?','Compresión: reciben el peso desde los cables y lo llevan al suelo',['Tracción: los cables tiran de ellas hacia arriba y las estiran','Torsión: el viento las hace girar sobre sí mismas','Ninguno: sólo sirven para que el puente sea más alto'],'Las torres trabajan a compresión.'),

M_('¿Por qué los cables de acero son tan útiles en las estructuras colgantes?','Son ligeros y resisten muchísimo cuando tiran de ellos',['Son muy pesados y resisten muy bien que los aplasten','Se pueden usar como pilares porque no se doblan','No necesitan sujetarse a ningún soporte'],'Ligeros y muy resistentes a tracción.'),
M_('Una lámpara cuelga del techo. ¿Qué tipo de estructura forma y a qué trabaja su cable?','Colgada; el cable trabaja a tracción',['Masiva; el cable trabaja a compresión','Triangulada; el cable trabaja a torsión','Entramada; el cable trabaja a flexión'],'La lámpara cuelga: el cable trabaja a tracción.'),

M_('¿Qué función tienen los tirantes o tensores en una grúa?','Sujetan y tensan el brazo para que no se doble, trabajando a tracción',['Empujan el brazo hacia arriba desde abajo, trabajando a compresión','Hacen girar la grúa sobre su base como si fueran un motor eléctrico','Sirven de contrapeso colgante para que la grúa no vuelque nunca'],'Los tirantes trabajan a tracción.'),

D:[
M_('Un meteorito rompe varias péndolas de un puente colgante. ¿Qué le pasa al tablero en esa zona?','Se queda sin sujeción, se dobla por flexión y puede caer',['Nada, porque las péndolas sólo decoran y el tablero se sostiene solo','Se vuelve más rígido, porque ya no tiene cables que lo hagan vibrar','Las torres se estiran hacia abajo y sujetan el tablero en esa zona'],'Sin péndolas, el tablero queda sin apoyos y se dobla.'),
M_('¿Por qué con los puentes colgantes se pueden salvar distancias de más de un kilómetro?','Los cables de acero son ligeros y resisten muchísimo a tracción, así se cubre mucha distancia con poco peso',['Porque el tablero es de piedra muy gruesa y aguanta por sí solo sin necesidad de apoyarse en nada más','Porque no necesitan cimentación: las torres flotan sobre el agua y se pueden colocar donde se quiera','Porque todos sus elementos trabajan a torsión, que es el esfuerzo que mejor resisten los cables de acero'],'Cables ligeros y muy resistentes a tracción.'),
M_('Si los anclajes de un puente colgante se soltaran del terreno, ¿qué pasaría?','Los cables dejarían de estar tensos y el tablero se vendría abajo',['Nada, porque los anclajes sólo decoran los extremos del puente','Las torres trabajarían a tracción y sujetarían el puente','El puente sería más rígido al quedar los cables sueltos'],'Sin anclajes, los cables no tienen de dónde tirar.'),
M_('¿Por qué las torres de un puente colgante tienen que ser tan altas?','Para que el cable principal cuelgue con curva y pueda sostener el tablero',['Para que los barcos más altos puedan pasar por encima de ellas','Para que trabajen a tracción y estiren el tablero hacia arriba','Para que el puente pese más y no se lo lleve el viento'],'La altura permite la curva del cable principal.'),
M_('Si un puente colgante se hiciera con cuerdas de algodón en vez de cables de acero, ¿qué ocurriría?','Se romperían, porque el algodón resiste muy poca tracción comparado con el acero',['Aguantaría más, porque el algodón es mucho más ligero y flexible que el acero','Funcionaría igual, porque los cables de un puente no soportan ningún esfuerzo','Las cuerdas trabajarían a compresión y serían más resistentes que el acero'],'El material de los cables debe resistir mucha tracción.'),
M_('Una marquesina cuelga de dos tirantes. Si uno se rompe, ¿qué pasa?','Ese lado pierde sujeción y la marquesina se inclina o cae',['Nada, porque los tirantes trabajan a compresión','El otro tirante se acorta y la sostiene sin problema','La marquesina sube porque pesa menos de ese lado'],'Cada tirante sostiene su parte trabajando a tracción.'),
M_('¿Por qué no se usa un puente colgante para cruzar un arroyo de 3 metros?','Para tan poca distancia basta una viga, más sencilla y barata',['Porque los cables no pueden medir menos de 100 metros','Porque en tramos cortos los cables trabajan a compresión','Porque los puentes colgantes sólo se construyen sobre el mar'],'Las colgantes compensan en grandes distancias.'),
M_('Un fuerte viento hace oscilar el tablero de un puente colgante. ¿Qué propiedad conviene mejorar?','La rigidez del tablero, para que no se deforme ni se mueva tanto',['La resistencia de las torres a la tracción, su esfuerzo principal','El peso de los cables, haciéndolos de piedra en vez de acero','Ninguna: los puentes colgantes no se ven afectados por el viento'],'Un tablero más rígido se deforma menos.'),
M_('¿Por qué las torres de un puente colgante necesitan una buena cimentación?','Porque reciben todo el peso del puente y lo transmiten al suelo a compresión',['Porque los cables tiran de ellas hacia arriba y podrían salir volando','Porque las torres flotarían sobre el agua si no se anclaran','Porque así trabajan a tracción en lugar de a compresión'],'Las torres concentran el peso del puente.'),
M_('Blip quiere cruzar una bahía de 2 km con poco material. ¿Qué puente elegirías?','Un puente colgante con cables de acero y torres altas',['Un puente de arco de piedra de un solo tramo','Un puente de vigas de madera sin apoyos intermedios','Un dique masivo de piedra que cierre toda la bahía'],'Para grandes luces con poco material: colgante.')

M_('¿Para qué sirven los cables que sujetan algunas antenas al suelo?','Son anclajes que mejoran la estabilidad y evitan que vuelquen',['Sirven para que la antena reciba mucho mejor la señal','Hacen que la antena trabaje a torsión al girar con el viento','Aumentan la rigidez de las uniones soldadas de la antena'],'Los anclajes mejoran la estabilidad.'),
M_('¿Por qué soldar las uniones de un marco lo hace más rígido?','Porque las uniones dejan de girar y el marco mantiene su forma',['Porque la soldadura hace que el marco pese bastante menos','Porque así las barras pasan a trabajar sólo a tracción','Porque la soldadura aumenta la base de apoyo del marco'],'Uniones rígidas: el marco no se deforma.'),

M_('¿Por qué un edificio con la planta baja sobre patas finas es peligroso en un terremoto?','Las patas son la parte débil: se deforman y todo el peso de arriba cae',['Porque pesa demasiado poco y el viento lo levanta del suelo','Porque las patas finas trabajan a tracción y se estiran hasta romperse','No lo es: las patas finas absorben todo el movimiento del suelo'],'La planta baja débil concentra la deformación.'),

M_('Blip pone un mástil de 10 m con una antena pesada arriba y se tambalea. ¿Qué cambio es más eficaz?','Sujetarlo con cables anclados al suelo en varias direcciones',['Subir la antena aún más alto para que pese más','Hacer el mástil más fino para que el viento pase','Quitarle la cimentación para que se mueva'],'Los anclajes evitan el vuelco.'),
M_('Una estructura es estable y rígida, pero se rompe al cargarla. ¿Qué debes cambiar?','El material o el grosor de las piezas, para hacerla más resistente',['La base, para hacerla todavía más ancha y más pesada','Las diagonales, quitándolas para que la estructura pese menos','Nada, porque ya cumple todas las propiedades que necesita'],'Si se rompe, le falta resistencia.'),
M_('¿Por qué muchos rascacielos llevan grandes barras diagonales en su estructura?','Para triangularla y que no se deforme con el viento ni con terremotos',['Para que el edificio pese más arriba y así sea más estable','Para que los ascensores puedan subir y bajar en diagonal','Para que las plantas trabajen sólo a torsión y no a compresión'],'Las diagonales dan rigidez.'),
M_('Una grúa vuelca al levantar una carga muy pesada. ¿Qué habría evitado el accidente?','Un contrapeso mayor o una base más ancha y bien anclada',['Un brazo más largo para alejar más la carga','Quitar el contrapeso para que la grúa pese menos','Cables más finos para que la carga suba antes'],'Más estabilidad: contrapeso y base.'),

C:[
M_('La balda de una estantería se curva con el peso de los libros. ¿Qué ocurre dentro de ella?','Está a flexión: la parte de arriba se comprime y la de abajo se estira (tracción)',['Está a flexión: la parte de arriba se estira (tracción) y la de abajo se comprime','Está a torsión: el peso de los libros hace que la balda se retuerza sobre sí misma','Sólo trabaja a cortadura: el peso intenta cortar la balda justo por sus dos apoyos'],'En flexión, arriba compresión y abajo tracción.'),
M_('¿Qué es el pandeo?','Cuando una pieza larga y delgada que está comprimida se curva hacia un lado',['Cuando una pieza larga y delgada se retuerce sobre sí misma al girar sus extremos','Cuando un par de fuerzas, como unas tijeras, corta una pieza en dos mitades','Cuando una cuerda o un cable se alarga porque tiran de él por los dos extremos'],'El pandeo afecta a piezas esbeltas comprimidas.'),
M_('En la flexión actúan a la vez dos esfuerzos. ¿Cuáles?','Tracción y compresión',['Torsión y cortadura','Pandeo y torsión','Cortadura y tracción'],'Arriba compresión y abajo tracción.'),
M_('¿Por qué la cuerda del juego de la soga trabaja a tracción?','Porque los equipos tiran de sus extremos y tienden a alargarla',['Porque los equipos la aprietan y tienden a acortarla','Porque los equipos la retuercen al tirar de ella','Porque los equipos intentan cortarla por la mitad'],'Tirar de los extremos: tracción.'),
M_('¿Por qué la pata de una silla con alguien sentado trabaja a compresión?','Porque el peso la aprieta contra el suelo y tiende a acortarla',['Porque el peso tira de ella hacia arriba y la alarga','Porque el peso la retuerce sobre sí misma','Porque el peso tiende a cortarla en dos'],'Apretar: compresión.'),
M_('¿Qué esfuerzo sufre un tornillo que une dos chapas que intentan deslizarse una sobre otra?','Cortadura, porque las chapas tienden a cortarlo',['Tracción, porque las chapas tienden a estirarlo','Torsión, porque las chapas lo hacen girar','Pandeo, porque las chapas lo comprimen de lado'],'Fuerzas paralelas opuestas: cortadura.'),
M_('¿Qué diferencia hay entre compresión y pandeo?','En el pandeo, la pieza comprimida es esbelta y se curva de lado',['En el pandeo, la pieza se estira en lugar de acortarse','En la compresión la pieza gira; en el pandeo se corta','No hay diferencia: son dos nombres del mismo esfuerzo'],'El pandeo es una inestabilidad de piezas esbeltas comprimidas.'),
M_('Al escurrir una toalla, ¿qué esfuerzo se produce y por qué?','Torsión, porque las manos giran en sentidos contrarios',['Tracción, porque las manos tiran hacia los lados','Flexión, porque la toalla se curva hacia abajo','Cortadura, porque las manos intentan partirla'],'Girar en sentidos opuestos: torsión.'),
M_('¿Por qué un trampolín trabaja a flexión cuando un nadador está en la punta?','Porque el peso tiende a curvarlo hacia abajo',['Porque el peso tiende a retorcerlo','Porque el peso tiende a cortarlo','Porque el peso tiende a estirarlo'],'Curvar: flexión.'),
M_('¿Por qué una regla de plástico apretada por sus extremos se curva hacia un lado?','Sufre pandeo: es larga, delgada y está comprimida',['Sufre tracción: los extremos tiran de ella','Sufre torsión: los extremos la hacen girar','Sufre cortadura: los extremos la parten'],'Es el ejemplo típico de pandeo.')
],

H_('Toca el elemento que trabaja a flexión porque el niño se sienta encima.','swing','asiento','El asiento se curva con el peso.'),

I_('¿Qué dibujo representa una cuerda de la que tiran por ambos lados?','esf',[['compresion',''],['traccion',''],['flexion',''],['pandeo','']],1,'Es tracción.'),
H_('Toca la pieza que trabaja a flexión y cortadura en esta estructura.','frame','viga','La viga trabaja a flexión y cortadura.'),

M_('Blip abre un bote de mermelada girando la tapa. ¿Qué esfuerzo sufre la tapa?','Torsión',['Tracción','Compresión','Pandeo'],'Girar en sentido contrario al bote: torsión.'),
D_('Clasifica cada elemento según su esfuerzo:',['Tracción','Compresión'],[['Cable de un teleférico',0],['Tirante de una grúa',0],['Cuerda de una cometa',0],['Pilar de un edificio',1],['Torre de un puente colgante',1],['Pata de una mesa',1]],'Tirar: tracción. Aplastar: compresión.'),
M_('Blip se cuelga de una barra de dominadas. ¿Qué esfuerzo sufre la barra y cuál sus brazos?','La barra, flexión; sus brazos, tracción',['La barra, tracción; sus brazos, flexión','La barra, torsión; sus brazos, compresión','La barra, compresión; sus brazos, cortadura'],'La barra se curva y los brazos se estiran.')
],
D:[
M_('La columna muy alta y fina de un mirador empieza a curvarse hacia un lado, aunque sólo recibe peso desde arriba. ¿Qué ocurre y cómo lo arreglarías?','Es pandeo: la haría más gruesa (menos esbelta) o la sujetaría con barras laterales',['Es torsión: la giraría en sentido contrario para que recuperase su forma recta','Es tracción: le colgaría más peso desde arriba para estirarla y enderezarla','Es cortadura: la cortaría por la mitad y la uniría con tornillos más resistentes'],'Pieza esbelta comprimida que se curva: pandeo.'),
M_('El hormigón resiste muy bien la compresión pero mal la tracción. ¿Por qué se ponen barras de acero en la parte de abajo de las vigas de hormigón armado?','Porque al flexionarse la viga, la parte de abajo trabaja a tracción y el acero sí la resiste',['Porque al flexionarse la viga, la parte de abajo trabaja a compresión y el hormigón necesita ayuda','Para que la viga pese menos, ya que el acero es más ligero que el mismo volumen de hormigón','Para que la viga no se oxide, porque el acero protege al hormigón de la humedad del ambiente'],'Abajo hay tracción, y el acero la resiste.'),
M_('¿Por qué los pilares muy altos y finos son peligrosos aunque su material sea resistente?','Porque pueden sufrir pandeo y curvarse de lado antes de romperse',['Porque trabajan a tracción y se estiran hasta romperse','Porque el viento los hace girar y sufren torsión','No lo son: un material resistente nunca falla'],'Las piezas esbeltas comprimidas pueden pandear.'),
M_('Una balda de estantería se dobla mucho. ¿Qué solución es correcta?','Poner un apoyo en el centro o una balda con más canto',['Poner los libros pesados justo en el centro','Hacer la balda más fina para que pese menos','Sujetar la balda sólo por uno de sus extremos'],'Más apoyos o más altura: menos flexión.'),
M_('En una viga de madera muy cargada, ¿por qué suele aparecer la grieta en la parte de abajo?','Porque abajo trabaja a tracción y la madera se abre al estirarse',['Porque abajo trabaja a compresión y la madera se aplasta','Porque abajo la viga gira sobre sí misma por torsión','Porque la parte de abajo no recibe ningún esfuerzo'],'En flexión, la parte inferior se estira.'),
M_('¿Por qué el eje de un motor debe resistir bien la torsión?','Porque el motor lo hace girar y la carga se opone, tendiendo a retorcerlo',['Porque el motor tira de él a lo largo y tiende a alargarlo','Porque el motor lo aplasta contra el suelo con su peso','Porque un eje que gira no sufre ningún esfuerzo, sólo se mueve'],'Giro con resistencia: torsión.'),
M_('Los tornillos que unen las piezas de una estantería se parten de lado. ¿Qué esfuerzo los ha roto?','Cortadura: las piezas tendían a deslizarse y cortarlos',['Tracción: las piezas tiraban de ellos a lo largo','Pandeo: los tornillos eran largos y estaban comprimidos','Torsión: el peso los hizo girar dentro del agujero'],'Piezas que deslizan sobre el tornillo: cortadura.'),
M_('Para el cable de un teleférico, ¿qué material es mejor y por qué?','Acero, porque resiste muchísimo a tracción',['Hormigón, porque resiste muchísimo a tracción','Piedra, porque resiste muy bien la flexión','Madera, porque resiste mejor la torsión'],'El cable trabaja a tracción: acero.'),
M_('Blip salta en un trampolín muy fino y se parte. ¿Qué le recomendarías al fabricante?','Hacerlo más grueso (más canto) para que resista mejor la flexión',['Hacerlo más largo para que se doble más suave y despacio','Hacerlo más fino y ligero para que pese menos en la punta','Cambiarlo por un cable de acero tenso para que no se curve'],'Más canto: más resistencia y rigidez a flexión.'),
M_('Las patas de una mesa alta y muy fina se doblan de lado al cargarla. ¿Qué ocurre y cómo se evita?','Pandeo: patas más gruesas o unidas con travesaños',['Tracción: patas más largas y más finas','Torsión: girar las patas al revés','Cortadura: cortar las patas por la mitad'],'Pandeo de piezas esbeltas.')
]}

/* pistas por bloque y nivel (se muestran en el juego antes de la segunda oportunidad) */
const HINT={
M:{R:'Piensa en una pirámide o un castillo: paredes gruesas (muros), techos curvos (bóvedas) y puertas curvas (arcos) hechas de dovelas.',C:'La piedra aguanta muy bien que la aprieten (compresión). Cuanto más peso y más base, más estable.',P:'En un arco, cada piedra depende de las que tiene al lado. Y la piedra se rompe si la doblas, pero no si la aprietas.',A:'Masiva = maciza y pesada, con muros, bóvedas y arcos. Medio punto: medio círculo; apuntado: en punta; herradura: se cierra abajo; lobulado: varias curvas.',D:'Imagina cuánto material y peso necesita una masiva. Base ancha y peso abajo = más estable.'},
E:{R:'Vertical = pilar. Horizontal = viga. Triangulada = barras en triángulo. Bajo el pilar va la cimentación.',C:'Un cuadrado de palitos con chinchetas se aplasta de lado; un triángulo no. La zapata reparte el peso del pilar.',P:'La viga es horizontal; el pilar, vertical; la zapata va enterrada bajo el pilar; las viguetas se apoyan en la viga.',A:'Rejilla de pilares y vigas = entramada. Barras en triángulo = triangulada. Doble T para flexión; cable sólo para tirar.',D:'Busca algo ligero que no se deforme. Si el suelo es blando, hay que repartir el peso o llegar a la roca.'},

function ansText(q,a){
  if(a===undefined||a===null||a===''||(Array.isArray(a)&&!a.some(Boolean))||(typeof a==='object'&&!Array.isArray(a)&&!Object.keys(a).length)) return 'Sin responder';
  if(q.t==='mc') return q.o[a];
  if(q.t==='img') return q.o[a][1]||NAMES[q.o[a][0]]||q.o[a][0];
  if(q.t==='hot') return NAMES[a]||a;
  if(q.t==='fill') return a;
  if(q.t==='sel') return a.map(x=>x||'(vacío)').join(' / ');
  if(q.t==='drag') return q.items.map((it,k)=>a[k]===undefined?null:`${it[0]} → ${q.bins[a[k]]}`).filter(Boolean).join('; ');
  if(q.t==='match') return Object.keys(a).map(l=>`${q.pairs[l][0]} → ${q.pairs[a[l]][1]}`).join('; ');
  return '';
}
function rightText(q){
  if(q.t==='mc') return q.o[q.a];
  if(q.t==='img') return q.o[q.a][1]||NAMES[q.o[q.a][0]];
  if(q.t==='hot') return NAMES[q.a]||q.a;
  if(q.t==='fill') return q.acc[0];
  if(q.t==='sel') return q.parts.filter(p=>typeof p!=='string').map(p=>p.o[p.a]).join(' / ');
  if(q.t==='drag') return q.items.map(it=>`${it[0]} → ${q.bins[it[1]]}`).join('; ');
  if(q.t==='match') return q.pairs.map(p=>`${p[0]} → ${p[1]}`).join('; ');
  return '';
}

function openScan(i){
  const s=STOPS[i]; const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="scanner" role="dialog" aria-modal="true" aria-labelledby="scT"><div class="scanline"></div>
   <h2 id="scT">Escáner de Blip: ${s.title.toLowerCase()}</h2><p class="sub">Análisis completado en: ${s.place}.</p>
   ${s.scan.map(x=>`<div class="sec"><h3>${x.h}</h3><p>${x.p}</p>${x.fig?figFor(x.fig):''}</div>`).join('')}
   <div class="actions"><button class="btn" id="closeScan">Cerrar el escáner</button></div></div>`;
  document.body.appendChild(m); m.scrollTop=0; $('#closeScan').focus({preventScroll:true});
  $('#closeScan').onclick=()=>{m.remove(); if(i===0){afterLanding();} else if(!ST.done[i]) showDanger(i);};
}

function afterLanding(){
  const b=document.querySelector('.actions');
  document.querySelector('.bubble').innerHTML='¡Entendido! Una estructura es algo capaz de <strong>soportar esfuerzos</strong>. Vamos a buscar las de los humanos.';
  b.innerHTML='<button class="btn sun" id="next">Seguir el viaje</button>';
  $('#next').onclick=()=>showStop(1);
}
