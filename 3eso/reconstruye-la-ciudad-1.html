<style>
:root{
  --night:#1E1147; --deep:#140B35; --panel:#2A1A63; --panel2:#3A2585;
  --mint:#5CF2C6; --pink:#FF4FA3; --sun:#FFD23F; --sky:#43C6F0; --hood:#F29E38;
  --ink:#F6F2FF; --muted:#C3B8F0; --bad:#FF6B6B; --line:rgba(255,255,255,.14);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#1E1147; --panel:#2A1A63; --ink:#F6F2FF; } }
:root[data-theme="dark"]{ --night:#1E1147; --panel:#2A1A63; --ink:#F6F2FF; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg svg{width:100%;height:100%}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0}
button{font:inherit}
.hidden{display:none!important}

/* botones */
.btn{appearance:none;border:0;border-radius:999px;padding:13px 26px;font-family:var(--display);font-size:1.1rem;font-weight:600;cursor:pointer;background:var(--mint);color:#16103A;box-shadow:0 5px 0 #2BB38E;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2BB38E}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #B8277A}
.btn.sun{background:var(--sun);box-shadow:0 5px 0 #C99A10}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.mitem:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}

/* portada */
.cover{padding-top:18px;text-align:center}
.cover h1{font-size:clamp(2.1rem,7vw,3.4rem);font-weight:700;letter-spacing:-.01em}
.cover h1 .l2{display:block;color:var(--mint)}
.cover .hero{width:min(300px,78vw);margin:4px auto -6px}
.cover p.lead{max-width:34em;margin:10px auto 22px;color:var(--muted)}
.card{background:var(--panel);border-radius:26px;padding:20px;border:2px solid var(--line)}
.form{max-width:440px;margin:0 auto 16px;text-align:left}
.form label{display:block;font-weight:700;margin:10px 0 4px}
.form input{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--deep);color:var(--ink);font:inherit}
.form .err{color:var(--bad);min-height:1.4em;font-size:.95rem;margin-top:6px}
.teacher{max-width:34em;margin:26px auto 0;font-size:.85rem;color:var(--muted);opacity:.85}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hud .who{font-family:var(--display);font-weight:500;font-size:.98rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{display:flex;align-items:center;gap:0}
.path i{display:block;width:13px;height:13px;border-radius:50%;background:var(--panel2);border:2px solid var(--line)}
.path i.done{background:var(--mint);border-color:var(--mint)}
.path i.now{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 4px rgba(255,210,63,.25)}
.path b{display:block;width:16px;height:2px;background:var(--line)}

/* escena */
.scene{border-radius:26px;overflow:hidden;border:3px solid var(--panel2);background:#000;position:relative}
.scene svg{display:block;width:100%;height:auto}
.scene.mini svg{height:150px}
.fig .zone{pointer-events:none}
.place{font-family:var(--display);color:var(--sun);font-size:1rem;margin:16px 0 2px}
.stitle{font-size:1.7rem;margin-bottom:8px}
.narr{margin:0 0 16px}
.bubble{position:relative;background:#fff;color:#1b1340;border-radius:20px;padding:12px 16px;margin:0 0 16px;font-weight:600}
.bubble::before{content:"";position:absolute;left:28px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble strong{color:#B8277A}

/* animación Blip */
.bob{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes bob{50%{transform:translateY(-3px)}}
.shake{animation:shake .35s linear infinite}
@keyframes shake{25%{transform:translate(-4px,2px) rotate(-.5deg)}75%{transform:translate(4px,-2px) rotate(.5deg)}}
.fall{animation:fall 1.2s ease-in forwards;transform-box:fill-box;transform-origin:bottom center}
@keyframes fall{to{transform:translateY(40px) rotate(14deg) scaleY(.4);opacity:.25}}
.beam{animation:beam 1.6s ease-in forwards}
@keyframes beam{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.gone{animation:gone 1.4s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes gone{to{transform:translateY(-120px) scale(.3);opacity:0}}
@media (prefers-reduced-motion: reduce){.bob,.shake,.scanline{animation:none!important}}

/* modal escáner */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,5,30,.8);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px))}
.scanner{position:relative;max-width:720px;width:100%;background:#0D2B33;border:3px solid var(--mint);border-radius:26px;padding:22px 20px;box-shadow:0 0 40px rgba(92,242,198,.35);overflow:hidden}
.scanner::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(92,242,198,.05) 0 2px,transparent 2px 5px);pointer-events:none}
.scanline{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(transparent,rgba(92,242,198,.35),transparent);animation:scan 1.8s ease-in-out 1;pointer-events:none}
@keyframes scan{to{top:100%}}
.scanner h2{color:var(--mint);font-size:1.5rem;margin-bottom:4px}
.scanner .sub{color:#9EE9D5;margin:0 0 12px;font-size:.95rem}
.sec{background:rgba(92,242,198,.07);border-left:4px solid var(--mint);border-radius:0 16px 16px 0;padding:12px 14px;margin:12px 0}
.sec h3{font-size:1.15rem;color:var(--sun);margin-bottom:4px}
.sec p{margin:.3em 0}
.sec ul{margin:.3em 0;padding-left:1.2em}
.sec b{color:var(--mint)}
.fig{background:#fff;border-radius:16px;padding:8px;margin-top:8px}
.fig svg{display:block;width:100%;height:auto}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.icons div{background:#fff;color:#1b1340;border-radius:14px;padding:8px;text-align:center;font-size:.85rem;font-weight:700}
.icons svg{width:100%;height:auto;display:block}

/* peligro */
.danger{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle,rgba(120,0,40,.55),rgba(20,0,10,.92));animation:flash 1s steps(2) infinite}
@keyframes flash{50%{background:radial-gradient(circle,rgba(170,0,60,.6),rgba(20,0,10,.92))}}
@media (prefers-reduced-motion: reduce){.danger{animation:none}}
.dbox{max-width:480px;text-align:center;background:var(--deep);border:3px solid var(--pink);border-radius:26px;padding:24px 20px}
.dbox .sign{font-family:var(--display);font-size:2.4rem;font-weight:700;color:var(--pink);line-height:1}
.dbox svg{width:120px;height:120px;margin:4px auto}

/* prueba */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.lv{font-family:var(--display);font-weight:600;font-size:1.05rem;padding:5px 14px;border-radius:999px;background:var(--sun);color:#1b1340}
.lv.C{background:var(--sky)} .lv.P{background:var(--pink);color:#fff} .lv.A{background:var(--mint)} .lv.D{background:#B79CFF}
.lvsteps{display:flex;gap:6px}
.lvsteps span{width:26px;height:8px;border-radius:4px;background:var(--panel2)}
.lvsteps span.ok{background:var(--mint)} .lvsteps span.half{background:var(--sun)} .lvsteps span.ko{background:var(--bad)} .lvsteps span.now{background:#fff}
.integ{margin:6px 0 14px}
.integ .lab{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:14px;border-radius:7px;background:var(--deep);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--sun),var(--mint));transition:width .6s}
.second{font-size:.9rem;color:var(--sun);margin-bottom:6px;font-weight:700}
.qtext{font-family:var(--display);font-weight:500;font-size:1.3rem;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:16px;padding:12px 14px;cursor:pointer;font:inherit;line-height:1.4}
.opt.sel{border-color:var(--sun);background:#4A338F}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt.img{padding:8px;text-align:center}
.opt.img svg{display:block;width:100%;height:auto;background:#fff;border-radius:12px}
.opt.img span{display:block;font-size:.9rem;margin-top:6px}
.good{border-color:var(--mint)!important;background:#1B5E55!important}
.wrong{border-color:var(--bad)!important;background:#6B2440!important}
.locked .opt,.locked .chip,.locked .mitem,.locked .zone{pointer-events:none}
.sentence{font-size:1.1rem;line-height:2.4}
.sentence select{font:inherit;font-size:1rem;padding:5px 8px;border-radius:10px;border:2px solid var(--sun);background:var(--deep);color:var(--ink);max-width:100%}
.sentence select.good{background:#1B5E55!important} .sentence select.wrong{background:#6B2440!important}
.fillin{width:100%;max-width:320px;padding:12px 14px;border-radius:14px;border:2px solid var(--sun);background:var(--deep);color:var(--ink);font:inherit}

.pool{min-height:60px;border:2px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pool:empty::after{content:"Todas colocadas. Toca una tarjeta y luego este recuadro para devolverla.";color:var(--muted);font-size:.85rem}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bin{border:2px solid var(--line);border-radius:18px;background:var(--deep);padding:8px;min-height:120px;cursor:pointer}
.bin h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--sun);text-align:center}
.bin .drop{display:flex;flex-direction:column;gap:6px}
.bin.over{border-color:var(--sun);background:#2E2270}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;color:#1b1340;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.92rem;cursor:grab;border:3px solid transparent;line-height:1.25}
.chip.sel{border-color:var(--pink)}
.chip.lifting{opacity:.35}
.chip.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.4);transform:rotate(-3deg)}
.chip.good{border-color:var(--mint)!important;background:#D8FFF3!important}
.chip.wrong{border-color:var(--bad)!important;background:#FFE0E0!important}
.hintdrag{font-size:.85rem;color:var(--muted);margin:-4px 0 10px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .col{display:grid;gap:10px;align-content:start}
.mitem{border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;font-size:.95rem;text-align:left;position:relative;line-height:1.35}
.mitem.pick{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.mitem .tag{position:absolute;top:-9px;right:-7px;width:22px;height:22px;border-radius:50%;font-size:.8rem;font-weight:800;display:grid;place-items:center;color:#1b1340}

.hotwrap{background:#fff;border-radius:18px;padding:8px}
.hotwrap svg{display:block;width:100%;height:auto}
.zone{cursor:pointer}
.zone .hl{fill:transparent;stroke:transparent}
.zone:hover .hl{fill:rgba(67,198,240,.18)}
.zone.sel .hl{fill:rgba(255,210,63,.45);stroke:#E0A800;stroke-width:2}
.zone.lz .hl{stroke:rgba(255,210,63,.55)}
.zone.good .hl{fill:rgba(92,242,198,.55);stroke:#1B9E7A}
.zone.wrong .hl{fill:rgba(255,107,107,.5);stroke:#C0392B}
.zone path.hl{fill:none!important}
.zone.sel path.hl{stroke-width:16}.zone.good path.hl,.zone.wrong path.hl{stroke-width:16}

.fb{margin-top:16px;border-radius:18px;padding:14px 16px}
.fb.ok{background:#15473F;border:2px solid var(--mint)}
.fb.no{background:#4D1A33;border:2px solid var(--bad)}
.fb h3{font-size:1.2rem;margin-bottom:4px}
.fb .pista{margin-top:10px;background:rgba(255,210,63,.12);border-left:4px solid var(--sun);padding:8px 12px;border-radius:0 12px 12px 0}
.toast{margin-top:10px;color:var(--sun);font-weight:700;min-height:1.4em}
.actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}

/* resultado parada */
.resbox{text-align:center;margin-top:14px}
.resbox h2{font-size:1.8rem}
.resbox .pct{font-family:var(--display);font-size:1.2rem;color:var(--muted);margin:4px 0 14px}

/* diploma */
.diploma{position:relative;background:#FFF8E6;color:#2A1A63;border-radius:24px;padding:28px 22px;text-align:center;border:10px solid transparent;background-clip:padding-box;box-shadow:0 0 0 4px var(--pink),0 0 0 10px var(--sun),0 0 0 14px var(--mint);margin:20px 8px}
.diploma .wm{position:absolute;inset:0;opacity:.08;pointer-events:none;overflow:hidden;border-radius:16px}
.diploma .wm svg{width:100%;height:100%}
.diploma .top{font-family:var(--display);font-size:1rem;color:#7A5BC8}
.diploma .name{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:700;margin:8px 0;color:#1E1147;border-bottom:3px dotted #C9B8F5;display:inline-block;padding:0 10px 4px}
.diploma .rank{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.1;margin:10px 0 2px;color:#B8277A}
.diploma .grade{font-family:var(--display);font-size:1.3rem;margin:6px 0 10px}
.diploma .blipd{width:120px;margin:0 auto}
.diploma table{margin:14px auto 6px;border-collapse:collapse;font-size:.9rem;text-align:left}
.diploma td,.diploma th{padding:4px 10px;border-bottom:1px solid #E6DCFB}
.diploma th{font-family:var(--display);font-weight:600}
.diploma .foot{font-size:.8rem;color:#6B5BA3;margin-top:10px}
.rules{max-width:440px;margin:0 auto 16px;text-align:left;background:#3B1840;border:2px solid var(--pink);border-radius:20px;padding:14px 16px;font-size:.95rem}
.rules h3{font-size:1.1rem;color:var(--pink);margin-bottom:4px}
.rules p{margin:.3em 0}
.exits{font-family:var(--display);font-size:.85rem;color:#1b1340;background:var(--sun);border-radius:999px;padding:2px 10px;white-space:nowrap}
.pause{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,5,30,.94)}
.pause .dbox{border-color:var(--sun)}
.pause .sign{color:var(--sun);font-size:2rem}
.dipwarn{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:700}
.stamp{position:absolute;right:14px;top:14px;width:78px;height:78px;border-radius:50%;border:3px dashed #B8277A;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#B8277A;transform:rotate(12deg);font-size:1.5rem;background:rgba(255,79,163,.07)}
@media (max-width:480px){.stamp{width:60px;height:60px;font-size:1.1rem;right:8px;top:8px}}
@media print{
  body{background:#fff}
  #bg,.hud,.noprint{display:none!important}
  main{max-width:none;padding:0}
  .diploma{margin:20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.credit{text-align:center;font-family:var(--display);font-size:.9rem;letter-spacing:.02em;color:var(--ink);opacity:.4;margin:4px 0 8px}
.diploma .credit{color:#2A1A63;opacity:.35;margin:10px 0 0;font-size:.8rem}
.autoria{position:fixed;left:0;right:0;bottom:0;z-index:45;text-align:center;font-size:.68rem;line-height:1.3;padding:5px 10px calc(5px + env(safe-area-inset-bottom,0px));background:rgba(20,11,53,.88);color:var(--muted)}
main{padding-bottom:72px}
.diploma .idobra{font-size:.72rem;color:#6B5BA3;margin-top:4px}
.btn.search{background:var(--sky);color:#16103A;box-shadow:0 5px 0 #1F7FA0}
@media print{html,body{background:#fff!important}.autoria{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#555;font-size:8px;padding:2px}main{padding-bottom:0}@page{size:A4;margin:10mm}.diploma{page-break-inside:avoid;margin:6mm;padding:18px}}
.printonly{display:none}
.report{background:#fff;color:#1b1340;padding:10px;font-size:11px}
.report h2{font-size:16px;margin:0 0 4px} .report p{margin:0 0 8px}
.report table{width:100%;border-collapse:collapse}
.report th,.report td{border:1px solid #CFC6EE;padding:4px 6px;text-align:left;vertical-align:top}
.report th{background:#EEE8FF} .report tr.rok td:last-child{color:#136B55;font-weight:700} .report tr.rko td:last-child{color:#B00020;font-weight:700}
.report tr{page-break-inside:avoid}
@media print{.printonly{display:block}.report{page-break-before:always}.diploma{zoom:.86}}
.trcard p{margin:0 0 10px}.trcard ul{margin:.2em 0;padding-left:1.2em}.trcard li{margin:.3em 0}
.fig.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.trwrap{background:#fff;border-radius:20px;padding:6px;border:3px solid var(--panel2);touch-action:manipulation}
.trwrap svg,.fig svg.trsvg{display:block;width:100%;height:auto}
.tleg{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;margin:8px 0 2px;color:inherit}
.tleg span{display:flex;align-items:center;gap:5px}.tleg i{display:inline-block;width:22px;height:6px;border-radius:3px}
.trcard .tleg{color:var(--muted)}
.tdots{display:flex;gap:6px;justify-content:center;margin:12px 0 0}.tdots i{width:10px;height:10px;border-radius:50%;background:var(--panel2)}.tdots i.now{background:var(--sun)}.tdots i.done{background:var(--mint)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:.95rem;margin-top:12px;padding:6px}
.partlab{font-family:var(--display);color:var(--sun);font-size:1.15rem;margin:6px 0 0}
.path .pdot{display:block;width:15px;height:15px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);padding:0;cursor:pointer}
.path .pdot.done{background:var(--mint);border-color:var(--mint)}.path .pdot.now{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 4px rgba(255,210,63,.25)}
.path .pdot[disabled]{cursor:default}
.navrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding-top:12px;border-top:2px dashed var(--line)}
.navlab{font-size:.85rem;color:var(--muted);width:100%}
.btn.small{font-size:.92rem;padding:8px 14px}
.donebadge{background:#15473F;border:2px solid var(--mint);border-radius:14px;padding:8px 12px;font-weight:700}

/* ========= fondo apocalíptico con marcas de agua ========= */

  <rect width="1200" height="900" fill="url(#skyg)"/><rect width="1200" height="900" fill="url(#glow)"/>

  ${sky}${ash}
  <g fill="none" stroke="#FFC300" stroke-width="3" opacity=".07">
    <path d="M90 880 V720 A70 70 0 0 1 230 720 V880"/><path d="M130 880 V760 A30 30 0 0 1 190 760"/>

/* ========= Vera, jefa del equipo de reconstrucción ========= */

  const brows = mood==='scared' ? '<path d="M-13,-77 L-5,-79 M13,-77 L5,-79" stroke="#3A2015" stroke-width="2" stroke-linecap="round"/>' : '<path d="M-13,-78 L-5,-77 M13,-78 L5,-77" stroke="#3A2015" stroke-width="2" stroke-linecap="round"/>';
  const sweat = mood==='scared' ? '<path d="M18,-74 q4,7 0,10 q-4,-3 0,-10z" fill="#5FB3C8"/>' : '';

}

const SVG = (inner,vb='0 0 400 240',extra=(vb==='0 0 400 240'?'preserveAspectRatio="xMidYMax slice"':'')) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" ${extra}>${inner}</svg>`;

/* celosía (triangulada) */
function lattice(x1,y1,x2,y2,w,n,col='#FFD23F',sw=2){
  // vertical o horizontal según dimensiones
  let s='';
  if(Math.abs(x2-x1)<Math.abs(y2-y1)){ // vertical
    s+=`<line x1="${x1}" y1="${y1}" x2="${x1}" y2="${y2}"/><line x1="${x1+w}" y1="${y1}" x2="${x1+w}" y2="${y2}"/>`;
    const st=(y2-y1)/n; for(let i=0;i<n;i++){const ya=y1+i*st,yb=ya+st;s+=`<line x1="${x1}" y1="${ya}" x2="${x1+w}" y2="${yb}"/><line x1="${x1}" y1="${yb}" x2="${x1+w}" y2="${yb}"/>`;}
  } else {
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y1}"/><line x1="${x1}" y1="${y1+w}" x2="${x2}" y2="${y1+w}"/>`;
    const st=(x2-x1)/n; for(let i=0;i<n;i++){const xa=x1+i*st,xb=xa+st;s+=`<line x1="${xa}" y1="${y1+w}" x2="${xb}" y2="${y1}"/><line x1="${xb}" y1="${y1}" x2="${xb}" y2="${y1+w}"/>`;}
  }
  return `<g stroke="${col}" stroke-width="${sw}" stroke-linecap="round">${s}</g>`;
}

M_('En el pasillo hay un arco de piedras sin cemento que no se cae. ¿Por qué aguanta?','Cada dovela empuja a la de al lado y todas trabajan a compresión, llevando el peso hacia los apoyos',['Las piedras trabajan a tracción, como una cuerda tensa que tira de los apoyos hacia el centro del arco','La piedra central está pegada con un mortero oculto y es la única que sujeta a todas las demás','El arco trabaja a torsión: las piedras se retuercen unas contra otras y así quedan bloqueadas'],'Las dovelas se aprietan unas contra otras: el arco trabaja a compresión.'),
M_('Cerca de las pirámides hay una presa de hormigón mucho más gruesa abajo que arriba. ¿Por qué?','Abajo el agua empuja con más fuerza y, además, tener el peso en la base la hace más estable',['Arriba se ahorra material para que la presa quede más bonita y se pueda pasear por encima','Así el agua puede pasar por encima con facilidad cuando el embalse está completamente lleno','Porque el hormigón resiste mejor la tracción en la parte baja y peor en la parte alta de la presa'],'El empuje del agua crece con la profundidad, y el peso abajo da estabilidad.'),
M_('¿Por qué las estructuras masivas son tan estables?','Porque son muy pesadas y tienen mucho material en su base',['Porque sus barras forman triángulos que no se deforman','Porque cuelgan de cables muy resistentes a la tracción','Porque son muy ligeras y el viento apenas las empuja'],'Mucho peso y base ancha: gran estabilidad.'),
M_('¿Cuál es el principal inconveniente de las estructuras masivas?','Pesan muchísimo, gastan mucho material y son lentas de construir',['Son poco estables y el viento las vuelca con mucha facilidad','Duran muy poco tiempo porque la piedra se rompe enseguida','Sólo resisten la tracción y se rompen cuando las aplastan'],'Son estables y duraderas, pero pesadas, caras y lentas de construir.'),
M_('¿Por qué la piedra es buena para arcos pero mala para una viga larga?','Resiste muy bien la compresión, pero se rompe con facilidad a flexión y tracción',['Resiste muy bien la tracción, pero se rompe con facilidad a compresión','Es demasiado ligera para soportar el peso de un tejado plano','Se dobla como una goma y por eso sólo sirve en forma de arco'],'En el arco la piedra trabaja a compresión; una viga trabajaría a flexión.'),
M_('En una catedral, ¿qué función cumplen los muros gruesos?','Soportan el peso de las bóvedas y lo llevan hasta el suelo',['Sirven sólo como decoración y no soportan ningún peso','Tiran de las bóvedas hacia arriba como si fueran cables','Permiten que el edificio se balancee con el viento sin romperse'],'Los muros reciben el peso de bóvedas y arcos y lo transmiten al suelo.'),
M_('¿Cómo reparte el peso un arco de piedra?','Cada dovela empuja a la siguiente y el peso baja siguiendo la curva hasta los apoyos',['Cada dovela tira de la siguiente como los eslabones de una cadena colgada','La dovela central sostiene ella sola todo el peso y las demás sólo decoran','El arco gira un poco sobre sí mismo y así el peso se va anulando'],'El peso se transmite de dovela en dovela, a compresión, hacia los apoyos.'),
M_('¿Por qué las pirámides han durado miles de años?','Son masivas: su gran peso y su base ancha las hacen muy estables',['Están hechas de acero inoxidable que no se oxida con el tiempo','Están formadas por triángulos de barras que no se deforman','Cuelgan de cables enterrados que las sujetan al suelo'],'Peso y base ancha: estabilidad muy alta.'),
D_('Clasifica estos elementos:',['Elemento de estructura masiva','Elemento de otro tipo'],[['Muro',0],['Bóveda',0],['Arco',0],['Viga',1],['Cable',1],['Barra en triángulo',1]],'Muros, bóvedas y arcos son de las masivas.'),
M_('¿Por qué los puentes romanos de piedra tienen forma de arco y no son planos?','Porque en arco la piedra trabaja a compresión, que es lo que mejor soporta',['Porque en arco la piedra trabaja a tracción, que es lo que mejor soporta','Porque los romanos no sabían cortar piedras con forma recta','Porque el arco hace que el puente pese mucho menos que uno plano'],'La piedra resiste muy bien la compresión, y el arco la hace trabajar así.')
],
P:[
I_('Vera quiere construir un refugio de piedra sin cemento. ¿Qué techo aguantará mejor el peso?','',[['losa','Losa plana sobre dos muros'],['boveda','Bóveda de piedras en arco'],['ramas','Tejado de ramas finas'],['columna','Columna alta de piedras sueltas']],1,'En la bóveda todas las piedras trabajan a compresión; una losa plana trabajaría a flexión y se partiría.'),
M_('Si quitas una piedra suelta de un muro muy grueso, normalmente no pasa nada. ¿Y si quitas una dovela de un arco?','El arco puede venirse abajo, porque cada dovela se sostiene gracias a las demás',['No pasa nada, porque en un arco cada piedra aguanta su propio peso sin depender de las otras','El arco se vuelve más rígido, porque al quitar peso las demás piedras se aprietan todavía más','Sólo se cae si el arco es de herradura; los de medio punto aguantan aunque les falten piezas'],'Las dovelas se sostienen unas a otras; si falta una, se rompe la cadena de compresión.'),
I_('¿Cuál de estos techos de piedra se partiría primero al cargarlo?','',[['losa','Losa plana sobre dos muros'],['boveda','Bóveda de piedras en arco'],['piramide','Pirámide maciza']],0,'La losa plana trabaja a flexión, y la piedra resiste mal la flexión.'),
I_('Vera ve un arco que se cierra hacia abajo, más que medio círculo. ¿Cuál es?','arc',[['medio',''],['apuntado',''],['herradura',''],['lobulado','']],2,'Es el arco de herradura.'),
M_('Un muro de piedra muy alto y fino se balancea. ¿Qué harías para que fuera más estable sin cambiar de material?','Hacerlo más ancho en la base, como una presa',['Hacerlo más alto para que pese más arriba','Hacerlo más fino para que el viento pase','Quitarle la cimentación para que se mueva'],'Base ancha y peso abajo dan estabilidad.'),
M_('¿Qué forma de techo usarías para cubrir con ladrillos un túnel largo?','Una bóveda: un arco alargado en el que los ladrillos trabajan a compresión',['Una losa plana de ladrillos, que trabajarían sobre todo a flexión','Un techo colgado de cables de ladrillo que trabajen a tracción','Una cercha de ladrillos unidos formando triángulos ligeros'],'La bóveda hace trabajar al ladrillo a compresión.'),
D_('¿Es buena idea construir esto con piedra?',['Buena idea con piedra','Mala idea con piedra'],[['Arco',0],['Muro grueso',0],['Bóveda',0],['Viga larga y plana',1],['Cable colgante',1],['Losa fina muy larga',1]],'La piedra va bien a compresión (arcos, muros, bóvedas) y mal a flexión o tracción.'),
M_('Una presa de gravedad aguanta el empuje del agua sin cables ni barras. ¿Gracias a qué?','A su enorme peso y a su base ancha, que le dan estabilidad',['A unos cables ocultos que la sujetan desde la otra orilla','A que el agua del embalse tira de ella hacia arriba','A que está hecha de barras de acero formando triángulos'],'Es masiva: aguanta por su propio peso.'),
M_('Vera apila piedras sin pegar formando un arco, pero se cae antes de colocar la última. ¿Por qué?','Hasta colocar la dovela central, las demás no pueden apoyarse entre sí',['Los arcos sólo aguantan si sus piedras están pegadas con cemento','La piedra no resiste la compresión y se aplasta al apilarla','Un arco sólo se sostiene si está colgado de un cable'],'El arco funciona cuando todas las dovelas se empujan entre sí.'),
M_('¿Qué pasaría si construyeras una pirámide boca abajo, apoyada en su punta?','Volcaría: su base sería mínima y todo el peso quedaría arriba',['Sería más estable, porque el peso empujaría hacia el suelo','Aguantaría igual, porque la forma no influye en la estabilidad','Sería más ligera y resistiría mejor los terremotos'],'Base pequeña y peso arriba: muy inestable.')
],

I_('Las catedrales góticas usan arcos que terminan en punta. ¿Cuál es?','arc',[['medio',''],['apuntado',''],['herradura',''],['lobulado','']],1,'Es el arco apuntado.'),
I_('Los puentes romanos usan arcos que son exactamente medio círculo. ¿Cuál es?','arc',[['medio',''],['apuntado',''],['herradura',''],['lobulado','']],0,'Es el arco de medio punto.'),
I_('¿Cuál de estos es un arco LOBULADO?','arc',[['medio',''],['apuntado',''],['herradura',''],['lobulado','']],3,'El lobulado está formado por varias curvas pequeñas.'),
S_('Completa la explicación del puente romano:',['Cada ',o_(['dovela','viga','péndola']),' empuja a la de al lado; el arco trabaja a ',o_(['compresión','tracción','torsión']),' y lleva el peso hacia los ',o_(['apoyos','cables','tirantes']),'.'],'Dovelas a compresión que llevan el peso a los apoyos.'),
M_('Hay que contener el mar con un dique usando piedra y hormigón de la zona. ¿Qué estructura elegirías?','Masiva: un muro grueso y pesado, más ancho en la base',['Colgante: una lona sujeta con cables a dos torres altas','Triangulada: barras finas de madera formando triángulos','Entramada: pilares sueltos sin nada entre ellos'],'Un dique aguanta el mar por su peso: estructura masiva.')

D:[
M_('¿Por qué hoy casi nunca se construyen los rascacielos como estructuras masivas?','Pesarían muchísimo y gastarían demasiado material; para grandes alturas se usan estructuras más ligeras',['Porque la piedra y el hormigón se han agotado y hoy sólo se construye con vidrio, plástico y aluminio','Porque las estructuras masivas son muy poco estables y cualquier viento fuerte acabaría volcándolas','Porque en una estructura masiva es imposible abrir ventanas, y un rascacielos necesita muchísimas'],'Una masiva de 300 m pesaría demasiado; se usan entramadas o trianguladas.'),
I_('Llega un fuerte terremoto a una región con construcciones de piedra. ¿Cuál tiene más posibilidades de resistir?','',[['muroFino','Muro alto y delgado'],['piramide','Pirámide ancha y baja'],['torrePesada','Torre con remate pesado arriba']],1,'Base ancha y peso abajo: la pirámide es la más estable.'),
M_('¿Por qué hoy casi no se construyen castillos con muros de varios metros de grosor?','Hay estructuras más ligeras y baratas, como las entramadas de hormigón armado',['Porque la piedra se ha agotado y ya no se encuentra en ninguna parte','Porque los muros gruesos son muy inestables y se caen con facilidad','Porque las masivas no resisten la compresión que produce el tejado'],'Las masivas son caras, pesadas y lentas; hoy hay alternativas más ligeras.'),
M_('Si un arco se construyera con piezas de goma blanda en vez de piedra, ¿qué pasaría?','Se aplastaría y deformaría, porque la goma resiste mal la compresión',['Aguantaría más, porque la goma es más ligera que la piedra','Funcionaría igual, porque en un arco el material no importa','Trabajaría a tracción y sería más resistente que uno de piedra'],'El arco necesita un material que resista bien la compresión.'),
M_('En una presa, ¿dónde conviene que el muro sea más grueso y por qué?','Abajo, porque ahí el agua empuja más y el peso en la base da estabilidad',['Arriba, porque ahí el agua empuja más y conviene tener más peso','En el centro, porque es donde el muro trabaja a torsión','Igual en todas partes, porque el agua empuja lo mismo arriba y abajo'],'El empuje crece con la profundidad.'),
M_('¿Por qué las catedrales tardaban décadas en construirse?','Eran masivas: había que tallar y colocar enormes cantidades de piedra',['Había que esperar a que el acero se enfriara entre una planta y otra','Sus cables tardaban años en tensarse por completo','El hormigón armado tardaba muchos años en fraguar'],'Las masivas necesitan muchísimo material y trabajo.'),
M_('Vera quiere un refugio que aguante tormentas durante siglos y no le importa el peso. ¿Qué elegirías?','Una estructura masiva de piedra con muros gruesos y bóveda',['Una tienda de lona ligera sujeta con cables finos','Una estructura triangulada de palos de madera fina','Una caseta de tablas colgada de las ramas de un árbol'],'Las masivas son muy estables y duraderas.'),
M_('¿Por qué un arco necesita apoyos firmes a ambos lados?','El peso baja por la curva y empuja hacia los apoyos; si ceden, el arco se abre y cae',['El arco tira de los apoyos hacia arriba como si fuera un cable tenso que los levanta','Los apoyos sólo sirven de decoración, porque el arco se sostiene en el aire él solo','El arco trabaja a torsión, y los apoyos sólo impiden que gire sobre sí mismo'],'El arco descarga su peso en los apoyos.'),
M_('Un pueblo quiere un puente de piedra de un solo arco de 500 m sobre un río. ¿Es buena idea?','No: un arco de piedra tan largo pesaría demasiado; mejor un puente colgante',['Sí: cuanto más largo es un arco de piedra, más resistente se vuelve','Sí: la piedra resiste muy bien la tracción en los tramos largos','No: la piedra no resiste la compresión y el arco se estiraría'],'Para grandes distancias, las estructuras colgantes son más ligeras.'),
M_('¿Qué tienen en común una presa, una pirámide y una muralla para ser tan estables?','Mucho peso y una base ancha que baja su centro de gravedad',['Barras en triángulo que impiden que se deformen','Cables tensos que las sujetan al terreno','Un material ligero que el viento no puede empujar'],'Son masivas: estables por su peso y su base.')
]},

S_('Completa la ficha del escáner:',['Las estructuras trianguladas están formadas por ',o_(['barras','muros','bóvedas']),' unidas formando ',o_(['triángulos','cuadrados','arcos']),'. Son ',o_(['ligeras','muy pesadas','macizas']),' y resistentes.'],'Barras en triángulos: ligeras y resistentes.'),

M_('¿Qué es una cercha?','Una estructura de barras en triángulo que sostiene tejados y naves',['Un bloque de hormigón que reparte el peso de un pilar en el suelo','Un cable vertical que cuelga del cable principal de un puente','Una piedra con forma de cuña que forma parte de un arco'],'La cercha es el elemento típico de las trianguladas.'),

C:[
M_('La grúa está hecha de triángulos y no de cuadrados. ¿Por qué?','El triángulo es el único polígono que no se deforma, aunque sus uniones puedan girar',['Porque los triángulos gastan más material y así la grúa pesa más y el viento no la mueve','Porque los cuadrados sólo sirven para estructuras de madera y la grúa está hecha de acero','Sólo por estética: los triángulos quedan más modernos y se ven mejor desde lejos en la obra'],'El cuadrado articulado se deforma; el triángulo no.'),
M_('¿Para qué sirve la zapata que hay debajo de cada pilar?','Aumenta la superficie de apoyo del pilar y reparte su peso sobre el suelo',['Une dos vigas entre sí para que el suelo de cada planta quede horizontal','Protege la base del pilar de la humedad del terreno para que no se oxide','Sujeta el tejado con cables para que el viento no lo levante en las tormentas'],'La zapata reparte el peso del pilar sobre más terreno.'),
M_('¿A qué esfuerzos trabaja principalmente una viga?','Flexión y cortadura',['Sólo a tracción','Torsión y pandeo','Sólo a compresión'],'La viga soporta flexión y cortadura.'),
M_('¿Por qué las trianguladas se usan en construcciones largas y ligeras?','Con poco material consiguen mucha resistencia y rigidez',['Son las estructuras más pesadas y macizas que existen','Sus barras trabajan sólo a torsión, que es muy resistente','No necesitan uniones entre sus barras para sostenerse'],'Ligeras y resistentes: ideales para grandes luces.'),
M_('¿Qué es el hormigón armado?','Hormigón con barras de acero en su interior para resistir mejor',['Hormigón mezclado con virutas de madera para que pese menos','Hormigón pintado por fuera para protegerlo de la lluvia','Hormigón sin agua que se coloca en bloques secos ya hechos'],'El acero le aporta la resistencia a tracción que le falta al hormigón.'),
M_('En una cercha, ¿a qué esfuerzos trabajan sus barras?','A tracción o a compresión, según la barra',['Sólo a torsión, porque giran sobre sus uniones','Sólo a flexión, porque todas se curvan con el peso','A ninguno, porque las barras no soportan esfuerzos'],'Las barras de una triangulada trabajan a tracción o compresión.'),
M_('¿Para qué sirven las viguetas?','Se apoyan en las vigas y sostienen el suelo de cada planta',['Se clavan en el terreno hasta llegar a la roca dura','Sujetan las torres de un puente colgante al suelo','Unen dos pilares en diagonal para formar triángulos'],'Las viguetas se apoyan en las vigas.'),
M_('¿Por qué el perfil doble T se usa tanto en vigas?','Porque resiste muy bien la flexión con poco material',['Porque sólo resiste la tracción, igual que un cable','Porque es el perfil más pesado y por eso aguanta más','Porque es el único perfil que no se oxida nunca'],'El doble T se usa sobre todo para flexión.'),
M_('¿Por qué una estructura entramada pesa mucho menos que una masiva del mismo tamaño?','Porque sólo tiene material en pilares y vigas, y el resto queda hueco',['Porque sus muros son de una piedra más ligera de lo normal','Porque cuelga de cables que le quitan todo el peso','Porque sus barras trabajan a torsión y eso las aligera'],'La retícula de pilares y vigas usa mucho menos material.'),
M_('¿Qué diferencia hay entre una zapata y una losa?','La zapata va bajo un pilar; la losa es una gran base bajo todo el edificio',['La losa va bajo un pilar; la zapata es una gran base bajo todo el edificio','La zapata es de madera y la losa siempre es de acero','Ninguna: son dos nombres distintos para el mismo elemento'],'Zapata: bajo cada pilar. Losa: base grande para suelos blandos.')

M_('La columna muy alta y fina de un mirador empieza a curvarse hacia un lado, aunque sólo recibe peso desde arriba. ¿Qué ocurre y cómo lo arreglarías?','Es pandeo: la haría más gruesa (menos esbelta) o la sujetaría con barras laterales',['Es torsión: la giraría en sentido contrario para que recuperase su forma recta','Es tracción: le colgaría más peso desde arriba para estirarla y enderezarla','Es cortadura: la cortaría por la mitad y la uniría con tornillos más resistentes'],'Pieza esbelta comprimida que se curva: pandeo.'),
M_('El hormigón resiste muy bien la compresión pero mal la tracción. ¿Por qué se ponen barras de acero en la parte de abajo de las vigas de hormigón armado?','Porque al flexionarse la viga, la parte de abajo trabaja a tracción y el acero sí la resiste',['Porque al flexionarse la viga, la parte de abajo trabaja a compresión y el hormigón necesita ayuda','Para que la viga pese menos, ya que el acero es más ligero que el mismo volumen de hormigón','Para que la viga no se oxide, porque el acero protege al hormigón de la humedad del ambiente'],'Abajo hay tracción, y el acero la resiste.'),
M_('¿Por qué los pilares muy altos y finos son peligrosos aunque su material sea resistente?','Porque pueden sufrir pandeo y curvarse de lado antes de romperse',['Porque trabajan a tracción y se estiran hasta romperse','Porque el viento los hace girar y sufren torsión','No lo son: un material resistente nunca falla'],'Las piezas esbeltas comprimidas pueden pandear.'),
M_('Una balda de estantería se dobla mucho. ¿Qué solución es correcta?','Poner un apoyo en el centro o una balda con más canto',['Poner los libros pesados justo en el centro','Hacer la balda más fina para que pese menos','Sujetar la balda sólo por uno de sus extremos'],'Más apoyos o más altura: menos flexión.'),
M_('En una viga de madera muy cargada, ¿por qué suele aparecer la grieta en la parte de abajo?','Porque abajo trabaja a tracción y la madera se abre al estirarse',['Porque abajo trabaja a compresión y la madera se aplasta','Porque abajo la viga gira sobre sí misma por torsión','Porque la parte de abajo no recibe ningún esfuerzo'],'En flexión, la parte inferior se estira.'),
M_('¿Por qué el eje de un motor debe resistir bien la torsión?','Porque el motor lo hace girar y la carga se opone, tendiendo a retorcerlo',['Porque el motor tira de él a lo largo y tiende a alargarlo','Porque el motor lo aplasta contra el suelo con su peso','Porque un eje que gira no sufre ningún esfuerzo, sólo se mueve'],'Giro con resistencia: torsión.'),
M_('Los tornillos que unen las piezas de una estantería se parten de lado. ¿Qué esfuerzo los ha roto?','Cortadura: las piezas tendían a deslizarse y cortarlos',['Tracción: las piezas tiraban de ellos a lo largo','Pandeo: los tornillos eran largos y estaban comprimidos','Torsión: el peso los hizo girar dentro del agujero'],'Piezas que deslizan sobre el tornillo: cortadura.'),
M_('Para el cable de un teleférico, ¿qué material es mejor y por qué?','Acero, porque resiste muchísimo a tracción',['Hormigón, porque resiste muchísimo a tracción','Piedra, porque resiste muy bien la flexión','Madera, porque resiste mejor la torsión'],'El cable trabaja a tracción: acero.'),
M_('Vera salta en un trampolín muy fino y se parte. ¿Qué le recomendarías al fabricante?','Hacerlo más grueso (más canto) para que resista mejor la flexión',['Hacerlo más largo para que se doble más suave y despacio','Hacerlo más fino y ligero para que pese menos en la punta','Cambiarlo por un cable de acero tenso para que no se curve'],'Más canto: más resistencia y rigidez a flexión.'),
M_('Las patas de una mesa alta y muy fina se doblan de lado al cargarla. ¿Qué ocurre y cómo se evita?','Pandeo: patas más gruesas o unidas con travesaños',['Tracción: patas más largas y más finas','Torsión: girar las patas al revés','Cortadura: cortar las patas por la mitad'],'Pandeo de piezas esbeltas.')
]}

M:{R:'Piensa en una pirámide o un castillo: paredes gruesas (muros), techos curvos (bóvedas) y puertas curvas (arcos) hechas de dovelas.',C:'La piedra aguanta muy bien que la aprieten (compresión). Cuanto más peso y más base, más estable.',P:'En un arco, cada piedra depende de las que tiene al lado. Y la piedra se rompe si la doblas, pero no si la aprietas.',A:'Masiva = maciza y pesada, con muros, bóvedas y arcos. Medio punto: medio círculo; apuntado: en punta; herradura: se cierra abajo; lobulado: varias curvas.',D:'Imagina cuánto material y peso necesita una masiva. Base ancha y peso abajo = más estable.'},
E:{R:'Vertical = pilar. Horizontal = viga. Triangulada = barras en triángulo. Bajo el pilar va la cimentación.',C:'Un cuadrado de palitos con chinchetas se aplasta de lado; un triángulo no. La zapata reparte el peso del pilar.',P:'La viga es horizontal; el pilar, vertical; la zapata va enterrada bajo el pilar; las viguetas se apoyan en la viga.',A:'Rejilla de pilares y vigas = entramada. Barras en triángulo = triangulada. Doble T para flexión; cable sólo para tirar.',D:'Busca algo ligero que no se deforme. Si el suelo es blando, hay que repartir el peso o llegar a la roca.'},
K:{R:'Un cable es como una cuerda: sólo trabaja cuando tiran de él. El puente tiene torres, tablero y cables.',C:'¿Qué pasa si empujas una cuerda? Las torres reciben el peso desde arriba; el tablero se comporta como una viga.',P:'Los cables tiran (tracción). La pieza vertical lleva el peso al suelo. La horizontal por la que circulan los coches es una viga.',A:'¿El peso cuelga de cables? Entonces es colgada. En el atirantado los cables salen rectos de la torre.',D:'¿Quién sujeta el tablero entre las torres? Piensa en lo ligeros y fuertes a tracción que son los cables de acero.'},
P:{R:'Estable = no vuelca. Resistente = no se rompe. Rígida = no se deforma.',C:'Peso abajo baja el centro de gravedad. Los triángulos y las uniones rígidas evitan deformaciones. Más altura de la pieza, menos flexión.',P:'Estable = base grande y peso abajo. Rígido = busca triángulos.',A:'Estabilidad: anclajes, base ancha y peso abajo. Rigidez: triangulación y uniones rígidas. Contra la flexión: más altura o más apoyos.',D:'Combínalo todo: base ancha y anclada, triángulos y piezas bien unidas.'},
S:{R:'Tracción = tirar. Compresión = apretar. Flexión = curvar. Torsión = girar. Cortadura = tijera. Pandeo = pieza fina comprimida que se curva de lado.',C:'Dobla una goma de borrar: una cara se arruga y la otra se estira. Piensa en qué hacen las fuerzas con la pieza.',P:'¿Qué parte tira, cuál aprieta y cuál se curva? Fíjate en las flechas de cada dibujo.',A:'Tirar → tracción; aplastar → compresión; curvar → flexión; retorcer → torsión; cortar → cortadura.',D:'Pieza larga, fina y comprimida que se dobla de lado tiene nombre propio. En flexión, la parte de abajo se estira.'}

viga:'Viga',pilar:'Pilar',zapata:'Zapata',vigueta:'Viguetas',torre:'Torre',tablero:'Tablero',pendolas:'Péndolas',cable:'Cable principal',patas:'Patas',travesano:'Travesaño',cadenas:'Cadenas',asiento:'Asiento'};
function ansText(q,a){
  if(a===undefined||a===null||a===''||(Array.isArray(a)&&!a.some(Boolean))||(typeof a==='object'&&!Array.isArray(a)&&!Object.keys(a).length)) return 'Sin responder';
  if(q.t==='build') return a;
  if(q.t==='mc') return q.o[a];
  if(q.t==='img') return q.o[a][1]||NAMES[q.o[a][0]]||q.o[a][0];
  if(q.t==='hot') return NAMES[a]||a;
  if(q.t==='fill') return a;
  if(q.t==='sel') return a.map(x=>x||'(vacío)').join(' / ');
  if(q.t==='drag') return q.items.map((it,k)=>a[k]===undefined?null:`${it[0]} → ${q.bins[a[k]]}`).filter(Boolean).join('; ');
  if(q.t==='match') return Object.keys(a).map(l=>`${q.pairs[l][0]} → ${q.pairs[a[l]][1]}`).join('; ');
  return '';
}
function rightText(q){
  if(q.t==='build') return q.right;
  if(q.t==='mc') return q.o[q.a];
  if(q.t==='img') return q.o[q.a][1]||NAMES[q.o[q.a][0]];
  if(q.t==='hot') return NAMES[q.a]||q.a;
  if(q.t==='fill') return q.acc[0];
  if(q.t==='sel') return q.parts.filter(p=>typeof p!=='string').map(p=>p.o[p.a]).join(' / ');
  if(q.t==='drag') return q.items.map(it=>`${it[0]} → ${q.bins[it[1]]}`).join('; ');
  if(q.t==='match') return q.pairs.map(p=>`${p[0]} → ${p[1]}`).join('; ');
  return '';
}

R:[
M_('¿Qué es una carga?','Toda fuerza que actúa sobre una estructura, como su peso, la nieve o el viento',['La tensión interna que aparece en un material cuando se deforma por dentro','El elemento que lleva el peso de la estructura hasta el terreno firme','La propiedad que permite a una estructura no volcar cuando sopla el viento'],'Las cargas son las fuerzas que actúan sobre la estructura.'),
M_('¿Qué son las cargas fijas o permanentes?','Las que actúan siempre, como el peso propio de la estructura',['Las que aparecen solo a veces, como el viento o la nieve','Las que actúan solo mientras la estructura se construye','Las que soportan los cimientos y nunca las vigas'],'Las cargas fijas actúan siempre: por ejemplo, el peso propio.'),
M_('¿Cuál de estas es una carga variable?','La nieve acumulada sobre un tejado',['El peso de los muros del edificio','El peso de las vigas del forjado','El peso de los pilares de abajo'],'La nieve no está siempre: es una carga variable.'),

X_('Relaciona cada función de una estructura con un ejemplo.',[['Soportar peso','Pilares de un edificio'],['Proteger','Casco de bicicleta'],['Mantener la forma','Armazón de una tienda de campaña'],['Salvar distancias','Puente sobre un río']],'Cada estructura cumple una función principal.'),
M_('¿Qué condiciones debe cumplir toda estructura para funcionar bien?','Ser estable, resistente y rígida',['Ser pesada, maciza y de piedra','Ser ligera, flexible y elástica','Ser alta, estrecha y de acero'],'Estabilidad, resistencia y rigidez.'),
M_('¿Hasta dónde deben llevar las cargas los elementos de una estructura?','Hasta los cimientos y, desde ellos, hasta el terreno',['Hasta el tejado, que las reparte por el aire','Hasta las ventanas, que son las piezas más débiles','A ningún sitio: las cargas desaparecen por sí solas'],'Todas las cargas acaban en el terreno a través de la cimentación.'),
S_('Completa:',['El peso propio de una estructura es una carga ',o_(['fija','variable','dinámica']),'; el viento y la nieve son cargas ',o_(['variables','fijas','permanentes']),'.'],'Peso propio: fija. Viento y nieve: variables.'),

M_('En un edificio, ¿qué recorrido sigue el peso de un mueble?','Suelo (forjado) → vigas → pilares → cimientos → terreno',['Pilares → suelo → vigas → tejado → terreno','Cimientos → pilares → vigas → suelo → mueble','Suelo → ventanas → tejado → vigas → aire'],'Cada elemento pasa la carga al siguiente hasta el terreno.'),
M_('¿Por qué un casco de bicicleta se considera una estructura?','Porque soporta los esfuerzos de un golpe y protege la cabeza',['Porque está hecho de plástico, como las estructuras modernas','Porque transmite las cargas hasta los cimientos de una casa','No lo es: sólo los edificios y puentes son estructuras'],'Proteger es una de las funciones de las estructuras.'),
M_('Si una estructura es resistente y rígida pero no es estable, ¿qué puede pasar?','Puede volcar entera aunque ninguna pieza se rompa ni se deforme',['Puede romperse en trozos aunque no llegue a volcar nunca','Puede deformarse como una goma aunque no llegue a volcar','Nada: con ser resistente y rígida ya es suficiente'],'Le falta estabilidad: vuelca.'),
M_('¿Por qué el viento es más peligroso para un edificio alto que para uno bajo?','Porque empuja sobre más superficie y a más altura, y tiende a volcarlo',['Porque el aire pesa más en lo alto y aplasta el tejado del edificio','Porque en los edificios bajos el viento se convierte en una carga fija','Porque el viento sólo afecta a edificios de más de cien metros'],'Más superficie y más altura: mayor tendencia al vuelco.'),
M_('¿Qué diferencia hay entre una carga fija y una variable?','La fija actúa siempre (peso propio); la variable cambia o aparece a veces',['La variable actúa siempre (peso propio); la fija cambia o aparece a veces','La fija es siempre pequeña y la variable siempre es más grande','La fija actúa sólo en las vigas y la variable sólo en los pilares'],'Fija: siempre. Variable: a veces o cambia.'),
M_('¿Por qué decimos que los elementos de una estructura colaboran entre sí?','Porque cada uno recibe la carga de otro y se la pasa al siguiente hasta el terreno',['Porque todos soportan exactamente la misma carga al mismo tiempo','Porque si uno se rompe, los demás no se ven afectados en nada','Porque cada elemento trabaja solo, sin tocar a ningún otro'],'Las cargas viajan de elemento en elemento.'),

M_('Una estantería está vacía y otra igual, llena de libros. ¿Qué cambia en sus cargas?','La llena tiene además una carga variable: el peso de los libros',['La vacía no tiene ninguna carga, ni siquiera su propio peso','Las dos tienen exactamente las mismas cargas','La llena pierde su peso propio al cargarla de libros'],'El peso propio está en ambas; los libros son carga variable.')

H_('Toca el elemento que entrega finalmente toda la carga al terreno.','frame','zapata','La zapata reparte la carga en el terreno.'),

M_('En un puente colgante, ¿por qué los cables deben acabar en anclajes en el terreno?','Porque la carga debe llegar al terreno; sin anclajes, los cables no tendrían de qué tirar',['Porque así los cables pesan menos y se mueven mejor con el viento','Porque los anclajes convierten la tracción de los cables en torsión','Porque es una norma estética para que el puente sea simétrico'],'Los anclajes llevan al terreno la tracción de los cables.'),

D:[
M_('Un edificio aguantó 20 años, pero se hunde con la primera gran nevada. ¿Qué es lo más probable?','No estaba preparado para una carga variable tan grande como esa nevada',['Su peso propio aumentó de golpe durante ese invierno','La nieve es una carga fija que se acumula durante años','Los edificios sólo aguantan veinte años y luego caen'],'Las cargas variables extraordinarias pueden superar lo previsto.'),
M_('¿Por qué los ingenieros calculan las estructuras para más carga de la esperada?','Porque las cargas reales pueden ser mayores y los materiales tener defectos',['Porque así la estructura pesa menos y resulta más barata','Porque las cargas fijas desaparecen con el paso del tiempo','Porque está prohibido construir estructuras ligeras'],'Es el margen de seguridad.'),
M_('En la ciudad devastada, un pilar de la planta baja está agrietado. ¿Por qué es tan grave?','Recibe la carga de todas las plantas de encima; si falla, cae todo lo que sostiene',['No es grave: los pilares de abajo apenas reciben carga','Porque los pilares de abajo sólo sujetan el tejado','Porque es el único elemento que trabaja a tracción'],'Los pilares bajos acumulan la carga de todo el edificio.'),
M_('Si una casa no tuviera cimientos, ¿qué pasaría con el camino de las cargas?','Los pilares apoyarían en suelo blando, se hundirían y la casa se agrietaría',['Nada, porque las cargas suben al tejado y no llegan al suelo','La casa sería más estable al pesar un poco menos','Las cargas fijas se convertirían en cargas variables'],'Sin cimentación, la carga no se reparte en el terreno.'),
M_('¿Por qué un puente peatonal y otro para camiones del mismo largo no se diseñan igual?','La carga variable de los camiones es mucho mayor y sus elementos deben resistir más',['Porque los peatones son una carga fija y los camiones no','Porque los puentes peatonales no reciben ninguna carga','Porque los camiones sólo cargan los cimientos del puente'],'Distintas cargas exigen distintos elementos.'),
M_('Un armario pesado se hunde en un suelo de madera viejo. ¿Qué parte del camino de cargas ha fallado?','El suelo o las viguetas que reciben primero la carga no eran resistentes',['El armario, porque su peso es una carga fija muy grande','Los cimientos del edificio, que siempre son lo primero que falla','Ninguna, porque un armario no es una carga para el suelo'],'Falló el primer eslabón que recibe la carga.'),
M_('Una tienda de campaña aguanta su peso, pero el viento la arrastra. ¿Qué cambiarías?','Anclarla al suelo con piquetas y vientos para hacerla estable',['Hacerla más alta para que el viento pase por encima','Quitarle las varillas para que pese menos','Cambiar la lona por otra de un color más oscuro'],'Le falta estabilidad frente al viento.'),
M_('Para el depósito de agua elevado, ¿cuándo soportan más carga sus patas?','Cuando está lleno: al peso propio se suma el gran peso del agua',['Cuando está vacío, porque el depósito pesa más sin agua','Igual siempre, porque el agua no añade ninguna carga','Cuando está vacío, porque el agua actúa como contrapeso'],'El agua es una carga variable muy grande.'),
M_('¿Por qué conviene repartir una carga entre varios pilares en vez de uno solo?','Cada pilar recibe menos carga y, si uno falla, los demás pueden compensarlo',['Porque un solo pilar no puede trabajar a compresión','Porque los pilares sólo resisten cargas variables','Porque cuantos más pilares, menos pesa la estructura'],'Repartir la carga reduce el esfuerzo de cada elemento.'),
M_('Un huracán arranca el tejado de chapa de un almacén, pero el resto queda intacto. ¿Qué falló?','La unión del tejado con la estructura: no estaba bien anclado contra el viento',['Los cimientos, que eran demasiado profundos para el terreno','Los pilares, que trabajaban a tracción en lugar de compresión','Nada: los tejados de chapa están hechos para salir volando'],'El viento levanta las cubiertas mal ancladas.')
]};

BANK.T={ /* TIPOS DE ESTRUCTURAS (comparativa) */
R:[
X_('Relaciona cada tipo de estructura con su descripción.',[['Masiva','Maciza y pesada, con muros gruesos'],['Abovedada','Con arcos, bóvedas y cúpulas'],['Entramada','Retícula de pilares y vigas'],['Triangulada','Barras unidas en triángulos'],['Colgante','Sostenida por cables o tirantes']],'Los cinco tipos principales.'),
M_('¿Qué tipo de estructura usa arcos, bóvedas y cúpulas para cubrir espacios?','Abovedada',['Triangulada','Entramada','Colgante'],'Arcos, bóvedas y cúpulas: abovedada.'),
M_('¿Qué tipo de estructura está formada por barras unidas en triángulos?','Triangulada',['Masiva','Abovedada','Entramada'],'Barras en triángulos: triangulada.'),
M_('¿Cuál es el principal inconveniente de las estructuras masivas?','Pesan mucho y gastan mucho material',['Se deforman con mucha facilidad','Sólo resisten esfuerzos de tracción','Duran muy poco tiempo en pie'],'Son estables y duraderas, pero pesadas.'),
F_('Completa: una estructura formada por una retícula de pilares y vigas se llama ________.',['entramada','estructura entramada'],'Es la entramada.'),
S_('Completa:',['Las estructuras ',o_(['trianguladas','masivas','abovedadas']),' son ligeras y rígidas; las ',o_(['masivas','colgantes','trianguladas']),' son pesadas y muy duraderas; y las ',o_(['colgantes','entramadas','masivas']),' salvan grandes distancias con cables.'],'Trianguladas, masivas y colgantes.'),
M_('¿Qué tipo de estructura es la cúpula de una iglesia?','Abovedada',['Colgante','Triangulada','Entramada'],'La cúpula es una estructura abovedada.'),
M_('¿Qué tipo de estructura es un puente atirantado?','Colgante',['Masiva','Abovedada','Entramada'],'Se sostiene con cables: colgante.'),
X_('Relaciona cada construcción con su tipo de estructura.',[['Presa de gravedad','Masiva'],['Cúpula','Abovedada'],['Bloque de pisos','Entramada'],['Grúa torre','Triangulada'],['Teleférico','Colgante']],'Un ejemplo de cada tipo.'),
M_('¿Qué tipo de estructura trabaja principalmente a tracción?','Colgante',['Masiva','Abovedada','Entramada'],'Sus cables trabajan a tracción.')
],
C:[
M_('¿Por qué las estructuras trianguladas pesan mucho menos que las masivas?','Porque usan barras con huecos entre ellas en lugar de material macizo',['Porque sus barras están hechas siempre de plástico ligero','Porque no necesitan apoyarse en el suelo para sostenerse','Porque los triángulos no tienen peso al ser figuras planas'],'Sólo hay material donde hace falta.'),
M_('¿Qué ventaja tiene una bóveda de piedra frente a una losa plana de piedra?','Cubre más espacio, porque la piedra trabaja a compresión, que soporta muy bien',['Pesa menos, porque la piedra de una bóveda es siempre hueca','Trabaja a tracción, que es lo que mejor soporta la piedra','No necesita ningún apoyo firme en sus extremos'],'La forma curva hace trabajar a la piedra a compresión.'),
M_('¿Por qué hoy casi todos los edificios de viviendas son entramados?','Permiten muchas plantas con poco material y dejan espacios interiores libres',['Porque son los únicos que resisten bien la lluvia','Porque no necesitan ningún tipo de cimentación','Porque se pueden construir sin usar materiales'],'Retícula ligera y espacios libres.'),
M_('¿En qué se parecen una estructura colgante y una abovedada?','Ambas llevan la carga a los apoyos con una forma curva: una a tracción y otra a compresión',['Ambas trabajan siempre a tracción gracias a sus cables de acero','Ambas están formadas por barras rectas unidas en triángulos','En nada: no tienen ninguna característica en común'],'El cable cuelga en curva (tracción); el arco se apoya en curva (compresión).'),
M_('¿Por qué los puentes colgantes salvan distancias mayores que los de arco de piedra?','Los cables de acero trabajan a tracción con poco peso; un arco de piedra tan largo pesaría demasiado',['Porque la piedra de los arcos resiste muy mal la compresión','Porque los arcos no pueden construirse nunca sobre agua','Porque los cables de acero trabajan a compresión y no pesan'],'Ligereza y resistencia a tracción del acero.'),
M_('¿Qué tienen en común una grúa torre y la Torre Eiffel?','Son trianguladas: altas, ligeras y rígidas gracias a los triángulos',['Son masivas: muy pesadas, macizas y de piedra','Son colgantes: cuelgan de cables sujetos al suelo','Son abovedadas: tienen arcos y cúpulas de piedra'],'Ambas son trianguladas.'),
M_('¿Por qué una estructura masiva es tan estable?','Por su gran peso y su base ancha',['Por sus cables tensos','Por sus barras en triángulo','Por ser muy ligera'],'Peso y base ancha.'),
M_('¿Qué inconveniente tienen las estructuras colgantes?','Necesitan torres altas y anclajes muy firmes',['Pesan muchísimo y gastan mucho material','No pueden salvar distancias muy largas','Sus cables trabajan siempre a compresión'],'Los cables deben sujetarse a algo firme.'),
M_('¿Por qué una entramada necesita triangulación o uniones rígidas si sopla mucho viento?','Porque su retícula de rectángulos podría deformarse de lado',['Porque sus vigas trabajan sólo a tracción','Porque sus pilares no soportan la compresión','Porque es en realidad una estructura colgante'],'Los rectángulos articulados se deforman.'),
D_('¿A qué trabaja principalmente cada elemento?',['Sobre todo a compresión','Sobre todo a tracción'],[['Arco de piedra',0],['Cúpula',0],['Muro de una presa',0],['Cable de un puente',1],['Tirante de una grúa',1],['Cable de un teleférico',1]],'Abovedadas y masivas: compresión. Colgantes: tracción.')
],
P:[
I_('¿Cuál de estos puentes usa una estructura abovedada?','b',p4(['catenaria','atirantado','arco','vigas']),2,'El puente de arco es abovedado.'),
I_('¿Cuál de estos puentes es colgante de catenaria?','b',p4(['catenaria','atirantado','arco','vigas']),0,'Cable principal curvo con péndolas.'),
I_('¿Cuál de estos puentes es de vigas apoyadas en pilares (entramado)?','b',p4(['catenaria','atirantado','arco','vigas']),3,'Vigas sobre pilares.'),
I_('Los supervivientes sólo tienen piedra para techar un almacén. ¿Qué forma eligen?','',[['losa','Losa plana sobre dos muros'],['boveda','Bóveda de piedras en arco'],['ramas','Tejado de ramas finas'],['columna','Columna de piedras sueltas']],1,'La bóveda hace trabajar a la piedra a compresión.'),
I_('¿Qué edificio es una estructura entramada reforzada con triangulación?','q',[['alto','Alto y sin refuerzos'],['cruces','Con cruces diagonales'],['patas','Sobre patas finas'],['bloques','Bloques apilados']],1,'Retícula de pilares y vigas con diagonales.'),
I_('¿Qué antena combina una estructura triangulada con elementos colgantes?','a',[['mastil','Mástil fino'],['atirantada','Torre triangulada con cables'],['cuadros','Torre de cuadrados'],['plato','Mástil con plato']],1,'Torre triangulada sujeta con cables.'),
M_('Hay que cruzar un río de 1 km con poco material. ¿Qué tipo de estructura eliges?','Colgante',['Masiva','Abovedada de piedra','Entramada de madera'],'Grandes distancias con poco peso: colgante.'),
M_('Hay mucha piedra y se quiere un refugio que dure siglos sin mantenimiento. ¿Qué tipo eliges?','Masiva o abovedada de piedra',['Colgante de cables finos','Triangulada de madera','Entramada de palos'],'Piedra abundante y durabilidad: masiva o abovedada.'),
M_('Hay hormigón y acero para un edificio de 6 plantas con espacios amplios. ¿Qué tipo eliges?','Entramada',['Masiva','Colgante','Abovedada'],'Varias plantas con espacios libres: entramada.'),
M_('Hay que cubrir un almacén de 40 m de ancho sin columnas con acero ligero. ¿Qué eliges?','Cerchas trianguladas',['Muros masivos','Una cúpula de piedra','Vigas de madera maciza'],'Grandes luces con poco peso: cerchas trianguladas.')
],
A:[
D_('Clasifica cada construcción según su tipo:',['Masiva','Abovedada','Entramada','Triangulada','Colgante'],[['Pirámide',0],['Muralla',0],['Cúpula de iglesia',1],['Puente romano de arco',1],['Bloque de pisos',2],['Aparcamiento',2],['Torre eléctrica',3],['Grúa torre',3],['Teleférico',4],['Golden Gate',4]],'Dos ejemplos de cada tipo.'),
D_('Clasifica cada construcción según su tipo:',['Masiva','Abovedada','Entramada','Triangulada','Colgante'],[['Presa de gravedad',0],['Faro de piedra',0],['Bóveda de un túnel',1],['Catedral gótica',1],['Hospital de hormigón',2],['Garaje de plantas',2],['Cercha de tejado',3],['Puente de celosía',3],['Puente atirantado',4],['Lámpara de techo',4]],'Dos ejemplos de cada tipo.'),
X_('Relaciona cada necesidad con el tipo de estructura más adecuado.',[['Cruzar un estrecho de 2 km','Colgante'],['Antena muy alta y ligera','Triangulada'],['Edificio de viviendas de 8 plantas','Entramada'],['Muro para contener tierra','Masiva']],'Cada necesidad pide un tipo.'),
S_('Completa el plan de reconstrucción:',['Para el nuevo hospital usaré una estructura ',o_(['entramada','colgante','masiva']),'; para la antena de radio, una ',o_(['triangulada','masiva','abovedada']),'; y para la pasarela sobre el barranco, una ',o_(['colgante','masiva','abovedada']),'.'],'Entramada, triangulada y colgante.'),
X_('Relaciona cada tipo con su principal ventaja.',[['Masiva','Muy estable y duradera'],['Entramada','Muchas plantas con espacios libres'],['Triangulada','Ligera y rígida'],['Colgante','Salva grandes distancias']],'Ventaja de cada tipo.'),
X_('Relaciona cada tipo con su principal inconveniente.',[['Masiva','Mucho peso y mucho material'],['Colgante','Necesita torres y anclajes firmes'],['Entramada','Se deforma de lado si no se refuerza'],['Abovedada','Empuja hacia los lados y necesita apoyos firmes']],'Inconveniente de cada tipo.'),
M_('Un almacén abovedado de piedra se agrieta porque sus muros se abren hacia fuera. ¿Qué le falta?','Apoyos laterales más firmes o un tirante que frene el empuje hacia fuera',['Más peso en lo alto de la bóveda para que apriete más','Quitar piedras de la bóveda para que pese menos','Nada: es normal que los muros de una bóveda se abran'],'El arco empuja hacia los lados.'),
M_('Los supervivientes tienen cables de acero, dos torres en pie y poco más. ¿Qué pueden construir para cruzar el río?','Un puente colgante',['Un puente de arco de piedra','Un puente masivo de tierra','Un túnel abovedado'],'Cables y torres: estructura colgante.'),
M_('Un puente atirantado con torres metálicas de celosía combina dos tipos de estructura. ¿Cuáles?','Colgante (los cables) y triangulada (las torres)',['Masiva (los cables) y abovedada (las torres)','Entramada (los cables) y masiva (las torres)','Abovedada (los cables) y colgante (las torres)'],'Muchas estructuras reales combinan tipos.'),
S_('Completa:',['En la cubierta del almacén, las cerchas forman una estructura ',o_(['triangulada','masiva','colgante']),' y se apoyan en pilares y vigas de una estructura ',o_(['entramada','abovedada','colgante']),'.'],'Cerchas trianguladas sobre una entramada.')
],
D:[
M_('¿Por qué ya no se construyen bóvedas de piedra para cubrir grandes naves?','Hoy hay estructuras trianguladas y colgantes más ligeras, rápidas y baratas',['Porque la piedra se ha agotado en todo el planeta','Porque las bóvedas de piedra se derrumban a los pocos años','Porque la piedra no resiste la compresión del tejado'],'Las alternativas modernas son más ligeras y rápidas.'),
M_('En una zona de terremotos, ¿qué es más seguro: una masiva de piedra o una entramada de acero triangulada?','La entramada de acero triangulada: es más ligera y se deforma sin romperse',['La masiva de piedra: su enorme peso la mantiene quieta','Las dos igual, porque los terremotos afectan a todas por igual','La masiva, porque la piedra resiste muy bien la tracción'],'Menos masa y más ductilidad: menos daños en un terremoto.'),
M_('¿Por qué la Torre Eiffel no se construyó como una pirámide maciza?','Una masiva tan alta pesaría muchísimo y necesitaría una base enorme',['Porque las pirámides no pueden tener más de cien metros','Porque el hierro no se puede usar en estructuras masivas','Porque una pirámide maciza se deformaría con el viento'],'La triangulada consigue altura con poco peso.'),
M_('¿Por qué el tablero de un puente colgante debe ser rígido?','Porque los cables sólo lo sujetan; sin rigidez oscilaría y se deformaría con el viento',['Porque el tablero es el elemento que trabaja a tracción','Porque así los cables pueden trabajar a compresión','No necesita ser rígido: los cables lo hacen todo'],'Cables y tablero colaboran.'),
M_('Una cúpula de piedra se mantiene en pie sin cemento. ¿Qué la sostiene?','Su forma: cada pieza empuja a las de alrededor y todas trabajan a compresión',['Unos cables ocultos que la cuelgan desde lo alto','El aire de dentro, que la empuja hacia arriba','La tracción de las piedras de la parte de arriba'],'Las abovedadas trabajan a compresión.'),
M_('¿Por qué los rascacielos actuales combinan estructura entramada con diagonales y núcleos rígidos?','La entramada da espacios útiles y las diagonales y núcleos dan rigidez contra el viento',['Porque las diagonales sirven para que los ascensores suban','Porque así el edificio pesa más arriba y es más estable','Porque la estructura entramada no puede tener plantas'],'Cada tipo aporta lo que mejor hace.'),
M_('Una nave industrial triangulada pierde una barra diagonal en un derrumbe. ¿Qué ocurre?','Esa zona deja de estar triangulada y puede deformarse',['Nada, porque las diagonales sólo son decoración','La nave se vuelve más rígida al tener menos barras','La nave pasa a ser una estructura colgante'],'Sin la diagonal queda un recuadro deformable.'),
M_('Hay que montar un refugio provisional en un solo día. ¿Qué tipo de estructura conviene?','Triangulada o colgante ligera, que se monta rápido con pocas piezas',['Masiva de piedra, que dura mucho más tiempo','Abovedada de ladrillo, que no necesita apoyos','Entramada de hormigón, que se hace en una tarde'],'Rapidez y ligereza.'),
M_('¿Por qué los arcos necesitan apoyos muy firmes a ambos lados?','Porque el arco empuja hacia abajo y hacia los lados; si los apoyos ceden, se abre y cae',['Porque el arco tira de sus apoyos hacia arriba, como un cable','Porque los apoyos sirven sólo para decorar el arco','Porque el arco trabaja a torsión y los apoyos lo frenan'],'El arco descarga en sus apoyos.'),
M_('Para una pasarela de 300 m sobre un barranco, transportando poco peso a pie, ¿qué tipo eliges?','Colgante, con cables ligeros que trabajan a tracción',['Masiva, con muros de piedra desde el fondo','Abovedada, con un arco de ladrillo de un tramo','Entramada, con pilares cada pocos metros'],'Poco peso y gran distancia: colgante.')
]};

BANK.L={ /* ELEMENTOS ESTRUCTURALES */
R:[
M_('¿Cuál es la función de los cimientos?','Transmitir todas las cargas de la estructura al terreno',['Sujetar el tejado contra el viento','Unir dos pilares por la parte de arriba','Decorar la base exterior del edificio'],'La cimentación entrega las cargas al terreno.'),
M_('¿Qué es un pilar?','Elemento vertical que lleva las cargas hacia abajo trabajando a compresión',['Elemento horizontal que salva la distancia entre dos apoyos','Cable que sujeta una parte de la estructura tirando de ella','Pieza curva de piedra que forma parte de un arco'],'El pilar es vertical y trabaja a compresión.'),
M_('¿Qué es una viga?','Elemento horizontal que recibe cargas y las lleva a los pilares',['Elemento vertical que lleva las cargas hacia los cimientos','Cable que sujeta el tablero de un puente colgante','Bloque de hormigón enterrado bajo un pilar'],'La viga es horizontal y trabaja a flexión.'),
F_('Completa: el cable que sujeta una parte de la estructura trabajando a tracción se llama tirante o ________.',['tensor','tensores','cable'],'Tirantes, tensores o cables.'),
X_('Relaciona cada elemento con su función.',[['Zapata','Reparte la carga del pilar en el terreno'],['Viga','Salva la distancia entre pilares'],['Pilar','Lleva las cargas hacia abajo'],['Tirante','Sujeta tirando'],['Arco','Cubre un hueco trabajando a compresión']],'Cada elemento cumple su función.'),
S_('Completa:',['En la cimentación, la ',o_(['zapata','viga','cercha']),' va bajo cada pilar, la ',o_(['losa','dovela','péndola']),' es una gran base para suelos blandos y los ',o_(['pilotes','tirantes','arcos']),' se clavan hasta la roca.'],'Zapata, losa y pilotes.'),
M_('¿Cómo se llaman las piezas que se apoyan en las vigas y forman el suelo de cada planta?','Viguetas',['Dovelas','Péndolas','Cartelas'],'Son las viguetas.'),
M_('¿Qué es el forjado de un edificio?','El suelo de cada planta, formado por viguetas y relleno, que reparte la carga a las vigas',['El conjunto de pilotes que se clavan en el terreno hasta la roca','La pieza triangular que refuerza la esquina de un pórtico','El cable principal curvo del que cuelga un puente'],'El forjado es el suelo estructural de cada planta.'),
F_('Completa: cada piedra en forma de cuña que forma un arco se llama ________.',['dovela','dovelas'],'Son las dovelas.'),
M_('¿Qué perfil se usa más en las vigas metálicas?','Doble T',['Cable','Listón plano','Sección en L'],'El doble T resiste muy bien la flexión.')
],
C:[
M_('¿Por qué las vigas necesitan pilares?','Porque necesitan apoyos que reciban su carga y la lleven hacia el suelo',['Porque los pilares tiran de las vigas hacia arriba','Porque los pilares hacen que las vigas trabajen a tracción','No los necesitan: las vigas se sostienen en el aire'],'Viga y pilar colaboran.'),
M_('¿Por qué un pilar necesita una zapata debajo?','Para repartir su carga sobre más terreno y que no se hunda',['Para que el pilar pueda girar libremente sobre ella','Para que el pilar trabaje a tracción en vez de a compresión','Para que el pilar sea más alto y llegue al techo'],'La zapata aumenta la superficie de apoyo.'),
M_('¿Para qué sirve el tirante horizontal de una cercha de tejado?','Une la base de los dos lados del tejado y evita que se abra',['Empuja el tejado hacia arriba para que no se hunda','Sirve para colgar las lámparas del interior','Hace que el tejado gire con el viento'],'El tirante frena el empuje hacia fuera.'),
M_('¿Qué recorrido sigue el peso del tablero en un puente colgante?','Péndolas → cable principal → torres → cimentación',['Torres → péndolas → tablero → cable principal','Cimentación → torres → péndolas → tablero','Cable principal → tablero → péndolas → aire'],'Así colaboran los elementos del puente.'),
M_('¿Por qué la viga trabaja a flexión y el pilar a compresión?','La viga recibe cargas perpendiculares que la curvan; el pilar las recibe a lo largo de su eje',['La viga recibe cargas a lo largo de su eje; el pilar recibe cargas que lo curvan','Porque las vigas siempre son de madera y los pilares de hormigón','Porque la viga está en lo alto y el pilar en lo bajo'],'Depende de cómo llega la carga.'),
M_('¿Qué hace una cartela en la unión de una viga con un pilar?','Refuerza la unión para que no gire y el pórtico no se deforme',['Permite que la unión gire libremente con el viento','Sirve para colgar cables desde la viga','Sustituye al pilar cuando este es demasiado corto'],'Convierte la unión en rígida.'),
M_('¿Por qué se usan pilotes en terrenos blandos?','Porque atraviesan el terreno blando y llevan la carga hasta la roca firme',['Porque son más baratos que cualquier zapata','Porque hacen que el edificio flote sobre el barro','Porque convierten la compresión en tracción'],'Buscan un terreno firme en profundidad.'),
M_('¿Por qué un arco necesita apoyos firmes?','Porque descarga su peso empujando hacia abajo y hacia los lados sobre ellos',['Porque el arco tira de los apoyos hacia arriba','Porque los apoyos sólo sirven para decorarlo','Porque el arco trabaja a torsión sobre sus apoyos'],'El arco empuja sobre sus apoyos.'),

    if(!n||!a||!c){$('#err').textContent='Escribe tu nombre, tus apellidos y tu curso y grupo para que aparezcan en el diploma.';return;}
    ST={name:n+' '+a,curso:c,stop:0,lv:0,v:0,res:{},sel:null,locked:false,inQ:false,log:[],pick:{},done:{}};
    Object.assign(GUARD,{exits:0,pen:0,away:false,allow:false,miss:0,fs:false,fsOn:false,on:false});
    reqFS().then(ok=>{GUARD.fs=ok;GUARD.fsOn=isFS();GUARD.on=true;showStop(0);});};
  $('#go').onclick=go;
  $('#cur').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

function showStop(i){
  ST.stop=i; const s=STOPS[i];
  app.innerHTML=`${hud()}<div class="scene" id="scene">${SCENES[s.key]('ok')}</div>
   <p class="place">${s.place}</p><h2 class="stitle">${s.title}</h2>
   <p class="narr">${s.narr}</p><p class="bubble">${s.say}</p>
   ${i>0&&ST.done[i]?`<p class="donebadge">✓ Prueba hecha: refuerzo del ${Math.round(stopPts(i)/MAXSTOP*100)}%. Puedes volver a inspeccionarla para repasar.</p>`:''}
   <div class="actions"><button class="btn" id="scanBtn">🔍 Inspeccionar la estructura</button></div>
   ${navRow(i)}`;
  $('#scanBtn').onclick=()=>openScan(i);
  wireNav();
  window.scrollTo({top:0});
}

function pendingStops(){return STOPS.map((_,i)=>i).filter(i=>i>0&&!ST.done[i]);}
function navRow(i){
  const last=STOPS.length-1;
  return `<div class="navrow"><span class="navlab">Moverte para repasar:</span>
   <button class="btn ghost small" id="navMap">🗺 Mapa</button>
   ${i>0?`<button class="btn ghost small" data-go="${i-1}">← ${STOPS[i-1].dot}</button>`:''}
   ${i<last?`<button class="btn ghost small" data-go="${i+1}">${STOPS[i+1].dot} →</button>`:''}
   <button class="btn ghost small" id="finBtn">${pendingStops().length?'Terminar y ver mi diploma':'Ver mi diploma'}</button></div>`;
}
function wireNav(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showStop(+b.dataset.go));
  if($('#hudMap'))$('#hudMap').onclick=showMap;
  if($('#finBtn'))$('#finBtn').onclick=finishGame;
  if($('#navMap'))$('#navMap').onclick=showMap;
}
function finishGame(){
  const pend=pendingStops();
  if(!pend.length){showDiploma();return;}
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="dbox" role="alertdialog" aria-labelledby="fT"><div class="sign" id="fT" style="color:var(--sun);font-size:1.7rem">Te faltan pruebas</div>
   <p>Aún no has hecho la prueba de: <b>${pend.map(i=>STOPS[i].title).join(', ')}</b>.</p><p>Si terminas ahora, esas pruebas contarán como <b>0</b> en tu nota.</p>
   <div class="actions" style="justify-content:center"><button class="btn" id="fgo">Ir a la primera pendiente</button><button class="btn ghost" id="fend">Terminar igualmente</button></div></div>`;
  document.body.appendChild(m);
  $('#fgo').onclick=()=>{m.remove();showStop(pend[0]);};
  $('#fend').onclick=()=>{m.remove();showDiploma();};
}
function figFor(k){
  if(k==='arches') return `<div class="fig">${F.arches()}</div>`;
  if(k==='frame') return `<div class="fig">${F.frame(true)}</div>`;
  if(k==='bridge') return `<div class="fig">${F.bridge(true)}</div>`;
  if(k==='swing') return `<div class="fig">${F.swing(true)}</div>`;
  if(k==='rigid') return `<div class="fig">${F.rigid()}</div>`;
  if(k==='esf') return `<div class="icons">${[['traccion','Tracción'],['compresion','Compresión'],['flexion','Flexión'],['torsion','Torsión'],['cortadura','Cortadura'],['pandeo','Pandeo']].map(([k,n])=>`<div>${F.esf(k)}${n}</div>`).join('')}</div>`;
  return '';
}

function openScan(i){
  const s=STOPS[i]; const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="scanner" role="dialog" aria-modal="true" aria-labelledby="scT"><div class="scanline"></div>
   <h2 id="scT">Informe de inspección: ${s.title.toLowerCase()}</h2><p class="sub">Análisis completado en: ${s.place}.</p>
   ${(s.scan==='DESIGN'?DESIGN_SCAN:s.scan).map(x=>`<div class="sec"><h3>${x.h}</h3><p>${x.p}</p>${x.fig?figFor(x.fig):''}${x.html?x.html():''}</div>`).join('')}
   <div class="actions"><button class="btn" id="closeScan">Cerrar el informe</button></div></div>`;
  document.body.appendChild(m); m.scrollTop=0; $('#closeScan').focus({preventScroll:true});
  $('#closeScan').onclick=()=>{m.remove(); if(i===0){afterLanding();} else if(!ST.done[i]) showDanger(i);};
}

function afterLanding(){

}

function showDanger(i){
