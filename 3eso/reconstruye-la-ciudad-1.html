/* ========= prueba ========= */
function stopPts(i){const r=ST.res[i]||{};return Object.values(r).reduce((a,x)=>a+(x&&x.pts?x.pts:0),0);}

function renderQuiz(){
  const i=ST.stop, s=STOPS[i], L=LV[ST.lv], q=s.qs[L.k][ST.pick[L.k][ST.v]];
  const r=ST.res[i]||{};
  const steps=LV.map((l,k)=>{const x=r[l.k];let c='';if(x){c=x.pts===l.w?'ok':x.pts>0?'half':'ko';}else if(k===ST.lv)c='now';return `<span class="${c}" title="${l.n}"></span>`;}).join('');
  const pct=Math.round(stopPts(i)/MAXSTOP*100);
  ST.sel=null; ST.locked=false; ST.inQ=true;
  app.innerHTML=`${hud(false)}<div class="scene mini shake" id="scene">${SCENES[s.key]('scared')}</div>
   <div class="qhead"><span class="lv ${L.k}">${L.n}</span><div class="lvsteps" aria-hidden="true">${steps}</div></div>
   <div class="integ"><div class="lab"><span>Refuerzo de la estructura</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
   ${ST.v===1?'<div class="second">Segunda oportunidad: nueva pregunta del mismo nivel</div>':''}
   <p class="qtext">${q.q||''}</p>${q.inv?'<div class="actions" style="margin:0 0 12px"><button class="btn search" id="srch">Busca información en internet</button></div>':''}<div id="qbody"></div><div class="toast" id="toast" role="status"></div>
   <div id="fb"></div><div class="actions" id="qact"><button class="btn" id="check">Comprobar</button></div>`;
  const api=buildQ(q,$('#qbody'));
  if($('#srch'))$('#srch').onclick=openSearch;
  $('#check').onclick=()=>{
    const res=api.check();
    if(res===null){$('#toast').textContent='Completa la respuesta antes de comprobar.';return;}
    $('#toast').textContent=''; $('#qbody').classList.add('locked'); ST.locked=true;
    (ST.log=ST.log||[]).push({stop:ST.stop,lv:LV[ST.lv].n,try:ST.v+1,q,a:api.val(),ok:res});
    api.mark(ST.v===1||res);
    feedback(res,q);
  };
  window.scrollTo({top:0});
}

function feedback(ok,q,pen){
  const i=ST.stop,s=STOPS[i],L=LV[ST.lv];
  let html='',btn=''; ST.inQ=false;
  const penTxt='<p><b>Has salido del juego mientras respondías, así que este intento cuenta como fallo.</b></p>';
  if(ok){
    const pts=ST.v===0?L.w:L.w*SECOND; ST.res[i][L.k]={pts,w:L.w,try:ST.v+1};
    html=`<div class="fb ok"><h3>${ST.v===0?'¡Correcto a la primera!':'¡Correcto en la segunda oportunidad!'}</h3><p>${q.why}</p></div>`;
    btn='<button class="btn sun" id="nx">Continuar</button>';
  } else if(ST.v===0){
    const pista=HINT[s.blk][L.k];
    html=`<div class="fb no"><h3>Todavía no</h3>${pen?penTxt:'<p>Esa respuesta no refuerza la estructura.</p>'}<p>Tienes otra oportunidad con una pregunta distinta de este nivel.</p><div class="pista"><strong>Pista de Vera:</strong> ${pista}</div></div>`;
    btn='<button class="btn pink" id="retry">Otra pregunta de este nivel</button>';
  } else {
    ST.res[i][L.k]={pts:0,w:L.w,try:2};
    html=`<div class="fb no"><h3>Nivel ${L.n.toLowerCase()} no superado</h3>${pen?penTxt:''}<p>${q.why}</p><p>${pen?'':'La respuesta correcta queda marcada en verde. '}Seguimos: aún puedes salvar la estructura.</p></div>`;
    btn='<button class="btn sun" id="nx">Continuar</button>';
  }
  $('#qact').innerHTML=btn; $('#fb').innerHTML=html;
  const pct=Math.round(stopPts(i)/MAXSTOP*100); document.querySelector('.bar i').style.width=pct+'%'; document.querySelector('.integ .lab span:last-child').textContent=pct+'%';
  if($('#retry')) $('#retry').onclick=()=>{ST.v=1;renderQuiz();};
  if($('#nx')) $('#nx').onclick=()=>{ST.v=0; if(ST.lv<LV.length-1){ST.lv++;renderQuiz();} else stopResult(i);};
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* constructores de preguntas */
function buildQ(q,host){
  const imgOf=(src,k)=> src==='frames'?FRAMES[k]: src==='esf'?F.esf(k): (src&&IMG[src]?IMG[src][k]:IMG[k]);
  if(q.t==='mc'||q.t==='img'){
    const order=shuffle(q.o.map((_,k)=>k));
    host.innerHTML = q.t==='mc'
      ? `<div class="opts" role="radiogroup">${order.map(k=>`<button class="opt" role="radio" aria-checked="false" data-k="${k}">${esc(q.o[k])}</button>`).join('')}</div>`
      : `<div class="imgs" role="radiogroup">${order.map((k,n)=>`<button class="opt img" role="radio" aria-checked="false" data-k="${k}">${imgOf(q.src,q.o[k][0])}<span>${q.o[k][1]||('Opción '+'ABCD'[n])}</span></button>`).join('')}</div>`;
    host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{host.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-checked','false');});b.classList.add('sel');b.setAttribute('aria-checked','true');ST.sel=+b.dataset.k;});
    return {val:()=>ST.sel===null?undefined:ST.sel, check:()=>ST.sel===null?null:ST.sel===q.a,
      mark:(reveal)=>host.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.k;if(b.classList.contains('sel'))b.classList.add(k===q.a?'good':'wrong');if(reveal&&k===q.a)b.classList.add('good');})};
  }
  if(q.t==='fill'){
    host.innerHTML=`<input class="fillin" id="fi" autocomplete="off" placeholder="Escribe tu respuesta" aria-label="Respuesta">`;
    const inp=host.querySelector('#fi'); inp.focus({preventScroll:true});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#check'))$('#check').click();});
    return {val:()=>inp.value.trim()||undefined, check:()=>{const v=norm(inp.value);if(!v)return null;return q.acc.map(norm).includes(v);},
      mark:(reveal)=>{const ok=q.acc.map(norm).includes(norm(inp.value));inp.style.borderColor=ok?'var(--mint)':'var(--bad)';inp.disabled=true;if(!ok&&reveal){inp.insertAdjacentHTML('afterend',`<p>Respuesta correcta: <b>${q.acc[0]}</b></p>`);}}};
  }
  if(q.t==='sel'){
    let n=0;
    host.innerHTML=`<p class="sentence">${q.parts.map(p=>typeof p==='string'?esc(p):`<select data-a="${esc(p.o[p.a])}" aria-label="Hueco ${++n}"><option value="">elige…</option>${shuffle(p.o).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`).join('')}</p>`;
    const sels=[...host.querySelectorAll('select')];
    return {val:()=>sels.map(x=>x.value), check:()=>sels.some(s=>!s.value)?null:sels.every(s=>s.value===s.dataset.a),
      mark:(reveal)=>sels.forEach(s=>{s.classList.add(s.value===s.dataset.a?'good':'wrong');s.disabled=true;if(reveal&&s.value!==s.dataset.a){s.insertAdjacentHTML('afterend',` <b style="color:var(--mint)">(${s.dataset.a})</b>`);}})};
  }
  if(q.t==='drag') return buildDrag(q,host);
  if(q.t==='match') return buildMatch(q,host);
  if(q.t==='hot'){
    host.innerHTML=`<div class="hotwrap">${F[q.fig](false)}</div><p class="hintdrag">Toca una parte del dibujo para seleccionarla.</p>`;
    const zs=[...host.querySelectorAll('.zone')];
    zs.forEach(z=>{z.setAttribute('tabindex','0');z.setAttribute('role','button');
      const pick=()=>{if(ST.locked)return;zs.forEach(x=>x.classList.remove('sel'));z.classList.add('sel');ST.sel=z.dataset.z;};
      z.addEventListener('click',pick); z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});});
    return {val:()=>ST.sel===null?undefined:ST.sel, check:()=>ST.sel===null?null:ST.sel===q.a,
      mark:(reveal)=>zs.forEach(z=>{if(z.classList.contains('sel')){z.classList.remove('sel');z.classList.add(z.dataset.z===q.a?'good':'wrong');}if(reveal&&z.dataset.z===q.a)z.classList.add('good');})};
  }
}

const FRAMES={
  f1:IMG.fr('20,90 90,90 90,20 20,20'),
  f2:IMG.fr('14,80 106,80 106,30 14,30'),
  f3:IMG.fr('20,90 90,90 90,20 20,20','<line x1="20" y1="90" x2="90" y2="20" stroke="#FF4FA3"/>'),
  f4:IMG.fr('55,14 98,44 82,92 28,92 12,44')
};

function buildDrag(q,host){
  const items=shuffle(q.items.map((it,k)=>({t:it[0],b:it[1],k})));
  host.innerHTML=`<p class="hintdrag">Arrastra cada tarjeta a su caja, o tócala y luego toca la caja.</p>
   <div class="pool" id="pool">${items.map(it=>`<div class="chip" tabindex="0" data-b="${it.b}" data-k="${it.k}">${esc(it.t)}</div>`).join('')}</div>
   <div class="bins">${q.bins.map((b,k)=>`<div class="bin" data-i="${k}" tabindex="0" role="button" aria-label="Caja ${esc(b)}"><h4>${esc(b)}</h4><div class="drop"></div></div>`).join('')}</div>`;
  const pool=host.querySelector('#pool');
  let sel=null;
  const place=(ch,target)=>{ if(target.classList.contains('bin')) target.querySelector('.drop').appendChild(ch); else pool.appendChild(ch); ch.classList.remove('sel'); sel=null; };
  const toggle=ch=>{ if(sel===ch){ch.classList.remove('sel');sel=null;return;} if(sel)sel.classList.remove('sel'); sel=ch; ch.classList.add('sel'); };
  host.querySelectorAll('.chip').forEach(ch=>{
    let d=null,ghost=null;
    ch.addEventListener('pointerdown',e=>{ if(ST.locked)return; e.preventDefault(); const r=ch.getBoundingClientRect(); d={sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,moved:false,w:r.width}; ch.setPointerCapture(e.pointerId); });
    ch.addEventListener('pointermove',e=>{ if(!d)return; if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>6){ d.moved=true; ghost=ch.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel'); ghost.style.width=d.w+'px'; document.body.appendChild(ghost); ch.classList.add('lifting'); }
      if(d.moved){ ghost.style.left=(e.clientX-d.ox)+'px'; ghost.style.top=(e.clientY-d.oy)+'px'; host.querySelectorAll('.bin').forEach(b=>b.classList.remove('over')); const el=document.elementFromPoint(e.clientX,e.clientY); const b=el&&el.closest('.bin'); if(b)b.classList.add('over'); } });
    const end=e=>{ if(!d)return; if(d.moved){ const el=document.elementFromPoint(e.clientX,e.clientY); const t=el&&(el.closest('.bin')||el.closest('.pool')); if(t&&host.contains(t))place(ch,t); ghost.remove(); ch.classList.remove('lifting'); host.querySelectorAll('.bin').forEach(b=>b.classList.remove('over')); } else toggle(ch); d=null; };
    ch.addEventListener('pointerup',end); ch.addEventListener('pointercancel',e=>{if(ghost)ghost.remove();ch.classList.remove('lifting');d=null;});
    ch.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(ch);}});
  });
  const targetClick=t=>e=>{ if(ST.locked||e.target.closest('.chip'))return; if(sel)place(sel,t); };
  host.querySelectorAll('.bin').forEach(b=>{b.addEventListener('click',targetClick(b));b.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&sel){e.preventDefault();place(sel,b);sel&&0;}});});
  pool.addEventListener('click',targetClick(pool));
  return {val:()=>{const v={};host.querySelectorAll('.bin').forEach(b=>b.querySelectorAll('.chip').forEach(c=>v[c.dataset.k]=+b.dataset.i));return v;}, check:()=>{ if(pool.querySelector('.chip'))return null; return [...host.querySelectorAll('.bin')].every(b=>[...b.querySelectorAll('.chip')].every(c=>c.dataset.b===b.dataset.i)); },
    mark:(reveal)=>host.querySelectorAll('.bin').forEach(b=>b.querySelectorAll('.chip').forEach(c=>{const ok=c.dataset.b===b.dataset.i;c.classList.add(ok?'good':'wrong');if(reveal&&!ok)c.insertAdjacentHTML('beforeend',` <small>→ ${esc(q.bins[+c.dataset.b])}</small>`);}))};
}

function buildMatch(q,host){
  const COL=['#FFD23F','#5CF2C6','#43C6F0','#FF8FC4','#B79CFF'];
  const L=shuffle(q.pairs.map((p,k)=>({t:p[0],k}))), R=shuffle(q.pairs.map((p,k)=>({t:p[1],k})));
  host.innerHTML=`<p class="hintdrag">Toca un elemento de la izquierda y después su pareja de la derecha. Toca un elemento emparejado para deshacer la pareja.</p>
   <div class="match"><div class="col">${L.map(x=>`<button class="mitem" data-s="L" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div>
   <div class="col">${R.map(x=>`<button class="mitem" data-s="R" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div></div>`;
  const pairs={}; let pick=null;
  const btn=(s,k)=>host.querySelector(`.mitem[data-s="${s}"][data-k="${k}"]`);
  const paint=()=>{ host.querySelectorAll('.mitem').forEach(b=>{b.style.borderColor='';const t=b.querySelector('.tag');if(t)t.remove();});

  });

/* ========= Diseña tu estructura triangulada ========= */
const TCOL={ten:'#2F7DE1',com:'#E5484D',zero:'#9A93B8',given:'#3A2585',user:'#F29E38'};
function gauss(A,b){ // resuelve A x = b (A cuadrada)
  const n=A.length, M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];
    const v=M[c][c]; if(Math.abs(v)<1e-14) continue; for(let k=c;k<=n;k++)M[c][k]/=v;
    for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c];if(f)for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}}
  return M.map(r=>r[n]);
}
function rref(A){ // devuelve {R,piv}
  const R=A.map(r=>r.slice()), rows=R.length, cols=rows?R[0].length:0, piv=[]; let r=0;
  for(let c=0;c<cols&&r<rows;c++){let p=r;for(let i=r+1;i<rows;i++)if(Math.abs(R[i][c])>Math.abs(R[p][c]))p=i;
    if(Math.abs(R[p][c])<1e-9)continue; [R[r],R[p]]=[R[p],R[r]]; const v=R[r][c]; for(let k=0;k<cols;k++)R[r][k]/=v;
    for(let i=0;i<rows;i++){if(i===r)continue;const f=R[i][c];if(f)for(let k=0;k<cols;k++)R[i][k]-=f*R[r][k];} piv.push(c); r++;}
  return {R,piv};
}
function trSolve(L,bars){
  const N=L.nodes, free=[], idx={};
  N.forEach((p,i)=>[0,1].forEach(d=>{const s=L.sup[i]; if(!(s==='pin'||(s==='roller'&&d===1))){idx[i+'_'+d]=free.length;free.push([i,d]);}}));
  const nf=free.length, m=bars.length;
  const E=Array.from({length:nf},()=>new Array(m).fill(0)), len=[];
  bars.forEach(([i,j],b)=>{const dx=N[j][0]-N[i][0],dy=N[j][1]-N[i][1],l=Math.hypot(dx,dy),u=[dx/l,dy/l];len.push(l);
    [0,1].forEach(d=>{const a=idx[i+'_'+d],c=idx[j+'_'+d]; if(a!==undefined)E[a][b]+=u[d]; if(c!==undefined)E[c][b]-=u[d];});});
  const F=new Array(nf).fill(0);
  Object.entries(L.loads).forEach(([i,l])=>[l.f[0],l.f[1]].forEach((v,d)=>{const a=idx[i+'_'+d]; if(a!==undefined)F[a]+=v;}));
  const rank=m?rref(E).piv.length:0, rigid=rank===nf;
  let t=new Array(m).fill(0);
  if(m){const A=Array.from({length:m},(_,p)=>Array.from({length:m},(_,q)=>{let s=0;for(let k=0;k<nf;k++)s+=E[k][p]*E[k][q];return s+(p===q?1e-9:0);}));
    const bb=Array.from({length:m},(_,p)=>{let s=0;for(let k=0;k<nf;k++)s-=E[k][p]*F[k];return s;}); t=gauss(A,bb);}
  let mech=null;
  if(!rigid){ // vector de mecanismo: núcleo de la matriz de compatibilidad
    const B=m?Array.from({length:m},(_,b)=>Array.from({length:nf},(_,k)=>E[k][b])):[];
    const {R,piv}=m?rref(B):{R:[],piv:[]}; const fc=[...Array(nf).keys()].find(c=>!piv.includes(c));
    const u=new Array(nf).fill(0); u[fc]=1; piv.forEach((pc,r)=>{u[pc]=-R[r][fc];});
    const mx=Math.max(...u.map(Math.abs))||1; mech=N.map(()=>[0,0]); free.forEach(([i,d],k)=>{mech[i][d]=u[k]/mx;});
  }
  return {rigid,t,len};
}

/* dibujo de una celosía */
function trSVG(L,bars,o={}){
  const N=o.disp||L.nodes, xs=L.nodes.map(p=>p[0]), ys=L.nodes.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const W=400,H=o.h||270,pad=46, s=Math.min((W-2*pad)/((x1-x0)||1),(H-2*pad-10)/((y1-y0)||1));
  const ox=(W-(x1-x0)*s)/2, oy=H-pad-((H-2*pad-10)-(y1-y0)*s)/2;
  const P=([x,y])=>[ox+(x-x0)*s, oy-(y-y0)*s];
  let g=`<rect width="${W}" height="${H}" fill="#fff"/>`;
  // suelo / pared
  if(L.wall) g+=`<rect x="${P([x0,0])[0]-26}" y="16" width="16" height="${H-32}" fill="#E6E0FF"/><line x1="${P([x0,0])[0]-10}" y1="16" x2="${P([x0,0])[0]-10}" y2="${H-16}" stroke="#8C7BD1" stroke-width="3"/>`;
  else { const hang=Object.entries(L.loads).some(([i,l])=>l.f[1]<0&&L.nodes[i][1]===y0); const gy=P([0,y0])[1]+(hang?50:16); g+=`<rect x="0" y="${gy}" width="${W}" height="${H-gy}" fill="#EFE6D6"/><line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="#C9B8A0" stroke-width="2"/>`; }
  // apoyos
  Object.entries(L.sup).forEach(([i,sp])=>{const [x,y]=P(L.nodes[i]);
    if(L.wall) g+=`<polygon points="${x-6},${y} ${x-16},${y-8} ${x-16},${y+8}" fill="#8C7BD1"/>`;
    else if(sp==='pin') g+=`<polygon points="${x},${y+2} ${x-10},${y+16} ${x+10},${y+16}" fill="#8C7BD1"/>`;
    else g+=`<polygon points="${x},${y+2} ${x-9},${y+12} ${x+9},${y+12}" fill="#8C7BD1"/><circle cx="${x-5}" cy="${y+15}" r="3" fill="#8C7BD1"/><circle cx="${x+5}" cy="${y+15}" r="3" fill="#8C7BD1"/>`;});
  // fantasma (posición original) si hay deformación
  if(o.disp){ bars.forEach(([i,j])=>{const a=P(L.nodes[i]),b=P(L.nodes[j]);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#D9D3F0" stroke-width="3" stroke-dasharray="5 4"/>`;}); }
  // barras
  const PN=p=>{const [x,y]=p;return [ox+(x-x0)*s, oy-(y-y0)*s];};
  const mx=o.t?Math.max(...o.t.map(Math.abs),1e-6):1;
  bars.forEach(([i,j],b)=>{const a=PN(N[i]),c=PN(N[j]);let col,w;
    if(o.t){const f=o.t[b];col=Math.abs(f)<0.05*mx?TCOL.zero:(f>0?TCOL.ten:TCOL.com);w=3+6*Math.abs(f)/mx;}
    else {col=b<(o.nGiven??bars.length)?TCOL.given:TCOL.user;w=5;}
    if(o.bad&&o.bad.includes(b)) g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#FFD23F" stroke-width="${w+8}" stroke-linecap="round" opacity=".8"/>`;
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
    if(o.edit&&b>=o.nGiven) g+=`<line class="ubar" data-b="${b-o.nGiven}" x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="transparent" stroke-width="20" style="cursor:pointer"/>`;});
  // cargas
  if(!o.noLoads) Object.entries(L.loads).forEach(([i,l])=>{const [x,y]=PN(N[i]);const len=34,dx=l.f[0],dy=-l.f[1],m=Math.hypot(dx,dy)||1;
    const below=dy>0&&L.nodes[i][1]===y0&&!L.wall;
    let sx=x-dx/m*(len+12), sy=y-dy/m*(len+12), ex=x-dx/m*12, ey=y-dy/m*12;
    if(below){sx=x;sy=y+9;ex=x;ey=y+9+len;}
    g+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#FF4FA3" stroke-width="4" marker-end="url(#ta)"/><text x="${sx+(dx?-4:6)}" y="${sy-(dy?4:6)}" font-size="11" font-weight="700" fill="#B8277A" text-anchor="${dx>0?'end':'start'}" font-family="Nunito,sans-serif">${below?'':l.label}</text>${below&&l.label?`<text x="${x+6}" y="${ey-2}" font-size="11" font-weight="700" fill="#B8277A" font-family="Nunito,sans-serif">${l.label}</text>`:''}`;});
  // nudos
  N.forEach((p,i)=>{const [x,y]=PN(p);g+=`<circle cx="${x}" cy="${y}" r="7" fill="${o.sel===i?'#FFD23F':'#fff'}" stroke="#3A2585" stroke-width="3"/>`;
    if(o.labels) g+=`<text x="${x+10}" y="${y-9}" font-size="12" font-weight="800" fill="#3A2585" font-family="Nunito,sans-serif">${LET[i]}</text>`;
    if(o.edit) g+=`<circle class="node" data-n="${i}" cx="${x}" cy="${y}" r="19" fill="transparent" style="cursor:pointer"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="trsvg"><defs><marker id="ta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#FF4FA3"/></marker></defs>${g}</svg>`;
}

let TRS={lv:0,bars:[],sel:null,att:0,stop:0};

/* ideas para triangular (contenido del escáner de la parada de diseño) */
function cap(t){return `<p class="figcap">${t}</p>`;}
const DESIGN_SCAN=[
 {h:'¿Por qué triangular?',p:'Un recuadro de barras unidas con nudos que giran se deforma con cualquier empujón. El triángulo es el único polígono que no se deforma. Por eso, para que una estructura de barras sea rígida, <b>cada recuadro necesita al menos una diagonal</b>.',html:()=>`<div class="fig">${F.rigid()}</div>`},

function startBuild(i){ ST.res[i]={}; TRS.stop=i; ST.inQ=false; showBuild(0); }
function buildHead(k){
  const r=ST.res[TRS.stop]||{}; const n=TLV.length+1;
  const steps=Array.from({length:n},(_,j)=>{const x=r['c'+j];let c='';if(x){c=x.pts>=x.w-1e-9?'ok':x.pts>0?'half':'ko';}else if(j===k)c='now';return `<span class="${c}"></span>`;}).join('');
  return `${hud(false)}<div class="qhead"><span class="lv A">Construcción ${k+1} de ${n}</span><div class="lvsteps" aria-hidden="true">${steps}</div></div>`;
}
function showBuild(k,keep){
  const L=TLV[k]; TRS.lv=k; if(!keep){TRS.bars=[];TRS.att=0;} TRS.sel=null;
  app.innerHTML=`${buildHead(k)}
   ${TRS.att?'<div class="second">Segundo y último intento: corrige tu diseño</div>':''}
   <h2 class="stitle">${L.t}</h2><p class="narr">${L.txt} <b>Toca un nudo y luego otro</b> para poner una barra; toca una barra naranja para quitarla.</p>
   <div class="trwrap" id="tw"></div><div class="toast" id="ttoast" role="status"></div>
   <div class="actions"><button class="btn ghost" id="tundo">Deshacer</button><button class="btn ghost" id="tclr">Quitar todas</button><button class="btn sun" id="tchk">¿Aguantará? Comprobar</button></div>
   <div id="tfb"></div>`;
  drawTr();
  $('#tundo').onclick=()=>{TRS.bars.pop();TRS.sel=null;drawTr();};
  $('#tclr').onclick=()=>{TRS.bars=[];TRS.sel=null;drawTr();};
  $('#tchk').onclick=checkTr;
  window.scrollTo({top:0});
}
function drawTr(){
  const L=TLV[TRS.lv], all=L.given.concat(TRS.bars);
  $('#tw').innerHTML=trSVG(L,all,{edit:true,nGiven:L.given.length,sel:TRS.sel,labels:true});
  $('#tfb').innerHTML=''; $('#ttoast').textContent=`Barras añadidas: ${TRS.bars.length}`;
  $('#tw').querySelectorAll('.node').forEach(c=>c.onclick=()=>{
    const n=+c.dataset.n;
    if(TRS.sel===null){TRS.sel=n;drawTr();return;}
    if(TRS.sel===n){TRS.sel=null;drawTr();return;}
    const a=Math.min(TRS.sel,n),b=Math.max(TRS.sel,n);
    const exists=L.given.concat(TRS.bars).some(([i,j])=>Math.min(i,j)===a&&Math.max(i,j)===b);
    const bothFixed=L.sup[a]==='pin'&&L.sup[b]==='pin';
    TRS.sel=null;
    if(exists){drawTr();$('#ttoast').textContent='Esa barra ya existe.';return;}
    if(bothFixed){drawTr();$('#ttoast').textContent='Esos dos nudos ya están fijos al suelo o a la pared: una barra entre ellos no sirve.';return;}
    TRS.bars.push([a,b]);drawTr();});
  $('#tw').querySelectorAll('.ubar').forEach(l=>l.onclick=()=>{TRS.bars.splice(+l.dataset.b,1);TRS.sel=null;drawTr();});
}
function mechOf(L,all){
  const N=L.nodes,free=[],idx={};N.forEach((p,i)=>[0,1].forEach(d=>{const s=L.sup[i];if(!(s==='pin'||(s==='roller'&&d===1))){idx[i+'_'+d]=free.length;free.push([i,d]);}}));
  const m=all.length,nf=free.length,B=Array.from({length:m},()=>new Array(nf).fill(0));
  all.forEach(([i,j],b)=>{const dx=N[j][0]-N[i][0],dy=N[j][1]-N[i][1],l=Math.hypot(dx,dy),u=[dx/l,dy/l];[0,1].forEach(d=>{const a=idx[i+'_'+d],c=idx[j+'_'+d];if(a!==undefined)B[b][a]+=u[d];if(c!==undefined)B[b][c]-=u[d];});});
  const {R:RR,piv}=m?rref(B):{R:[],piv:[]};const fc=[...Array(nf).keys()].find(c=>!piv.includes(c));const u=new Array(nf).fill(0);if(fc!==undefined){u[fc]=1;piv.forEach((pc,r)=>{u[pc]=-RR[r][fc];});}
  const mx=Math.max(...u.map(Math.abs))||1;const mv=N.map(()=>[0,0]);free.forEach(([i,d],k)=>{mv[i][d]=u[k]/mx;});
  let dot=0;Object.entries(L.loads).forEach(([i,l])=>{dot+=mv[i][0]*l.f[0]+mv[i][1]*l.f[1];});if(dot<0)mv.forEach(v=>{v[0]=-v[0];v[1]=-v[1];});return mv;
}
function animDeform(host,L,all,draw){
  const mv=mechOf(L,all), xs=L.nodes.map(p=>p[0]), ys=L.nodes.map(p=>p[1]);
  const span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))||1; let t0=null;
  const step=ts=>{if(t0===null)t0=ts;const k=Math.min(1,(ts-t0)/1400),amp=0.12*span*k;
    const disp=L.nodes.map((p,i)=>[p[0]+mv[i][0]*amp,p[1]+mv[i][1]*amp]); host.innerHTML=draw(disp); if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function checkTr(){
  const L=TLV[TRS.lv], all=L.given.concat(TRS.bars), R=trSolve(L,all), nG=L.given.length, key='c'+TRS.lv, i=TRS.stop;
  const logIt=(ok,res)=>{(ST.log=ST.log||[]).push({stop:i,lv:'Construcción',try:TRS.att+1,q:{t:'build',q:`${L.t}. ${L.txt}`,right:'Una solución válida: '+barTxt(L.sol)},a:`Barras: ${barTxt(TRS.bars)}. ${res}`,ok});};
  if(!R.rigid){
    animDeform($('#tw'),L,all,disp=>trSVG(L,all,{disp,nGiven:nG,labels:true}));
    if(TRS.att===0){
      logIt(false,'Se deforma.');
      $('#tfb').innerHTML=`<div class="fb no"><h3>¡Se deforma!</h3><p>Todavía no es rígida: hay algún recuadro o algún nudo sin triangular. Mira qué parte se mueve. Tienes un segundo intento.</p><div class="pista"><strong>Pista de Vera:</strong> ${L.tip}</div></div><div class="actions"><button class="btn pink" id="tre">Corregir mi diseño</button></div>`;
      $('#tre').onclick=()=>{TRS.att=1;showBuild(TRS.lv,true);};
    } else {
      logIt(false,'Se deforma.'); ST.res[i][key]={pts:0,w:L.w,try:2};
      $('#tfb').innerHTML=`<div class="fb no"><h3>Construcción no superada</h3><p>Así quedaría una solución que sí aguanta (barras ${barTxt(L.sol)}):</p><div class="fig">${trSVG(L,L.given.concat(L.sol),{t:trSolve(L,L.given.concat(L.sol)).t,labels:true,h:220})}</div>${TLEG}</div><div class="actions"><button class="btn sun" id="tnx">Siguiente →</button></div>`;
      $('#tnx').onclick=nextBuild;
    }
    $('#tfb').scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  const bad=[]; TRS.bars.forEach((_,k)=>{const b=nG+k;if(R.t[b]<-0.25&&R.len[b]>=1.3)bad.push(b);});
  const minOK=TRS.bars.length<=L.need, noBad=bad.length===0, stars=1+(minOK?1:0)+(noBad?1:0);
  const quality=TRS.lv<3?1:(1-(minOK?0:0.25)-(noBad?0:0.25));
  const pts=L.w*(TRS.att?SECOND:1)*quality; ST.res[i][key]={pts,w:L.w,try:TRS.att+1};
  logIt(true,`Aguanta (${stars} de 3 estrellas).`);
  $('#tw').innerHTML=trSVG(L,all,{t:R.t,bad,labels:true});
  $('#tfb').innerHTML=`<div class="fb ok"><h3>¡Aguanta! ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</h3>
   <p>✓ Es rígida: no se deforma con la carga.${TRS.att?' (Conseguido en el segundo intento.)':''}</p>
   <p>${minOK?'✓':'✗'} Barras añadidas: ${TRS.bars.length}. ${minOK?'Has usado las justas.':`Bastaba con ${L.need}: sobran barras y la estructura pesa y cuesta más.`}</p>
   <p>${bad.length?'✗ Las barras resaltadas en amarillo son largas y trabajan a <b>compresión</b>: podrían pandear. Colocadas en la otra dirección trabajarían a tracción.':'✓ Ninguna barra larga de las que has puesto trabaja a compresión.'}</p>
   ${TRS.lv>=3?'<p style="font-size:.9rem;opacity:.85">En esta construcción cuentan para la nota las barras justas y que las largas no trabajen a compresión.</p>':''}
   ${TLEG}<div class="pista"><strong>Idea:</strong> ${L.tip}</div></div><div class="actions"><button class="btn sun" id="tnx">Siguiente →</button></div>`;
  $('#tnx').onclick=nextBuild;
  $('#tfb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nextBuild(){ if(TRS.lv<TLV.length-1) showBuild(TRS.lv+1); else showTower(); }

/* ========= torre libre ========= */
const TWR={LMAX:2.5,TMAX:6,BMAX:30,HTARGET:9,W:0.8};
let TW=null;
const WX0=-2.4,WX1=5.4,WY0=-0.6,WY1=10.6,SW=400,SH=560;
const w2s=([x,y])=>[(x-WX0)/(WX1-WX0)*SW, SH-(y-WY0)/(WY1-WY0)*SH];
function showTower(keep){
  if(!keep) TW={nodes:[[0,0],[3,0]].concat(Array.from({length:10},(_,k)=>[-1.9+(k%2)*0.7,0.6+Math.floor(k/2)*0.75])),bars:[],sel:null,att:0,best:0,passed:false,done:false};
  TRS.lv=TLV.length;
  app.innerHTML=`${buildHead(TLV.length)}
   <h2 class="stitle">La torre más alta de Kromb</h2>
   <p class="narr">Construye la <b>torre más alta posible que se mantenga estable</b> sobre las dos cimentaciones. Tienes <b>10 nudos</b> en el almacén: <b>arrástralos</b> a donde quieras. Después <b>toca un nudo y luego otro</b> para unirlos con una barra (máximo ${fmtN(TWR.LMAX)} m). En lo alto soplará el viento y se colocará una antena.</p>
   <div class="trwrap" id="twr"></div><div class="toast" id="wtoast" role="status"></div>
   <div class="actions"><button class="btn ghost" id="wundo">Quitar última barra</button><button class="btn ghost" id="wclr">Quitar todas las barras</button><button class="btn sun" id="wchk">¿Aguantará? Comprobar</button></div>
   <p class="hintdrag">Tienes 2 comprobaciones. Puntúa la altura de la torre si es estable: a partir de ${TWR.HTARGET} m consigues la nota máxima.</p>
   <div id="wfb"></div>`;
  drawTower();
  $('#wundo').onclick=()=>{if(TW.done)return;TW.bars.pop();TW.sel=null;drawTower();};
  $('#wclr').onclick=()=>{if(TW.done)return;TW.bars=[];TW.sel=null;drawTower();};
  $('#wchk').onclick=checkTower;
  window.scrollTo({top:0});
}
function towerSVG(o={}){
  const N=o.disp||TW.nodes; let g=`<rect width="${SW}" height="${SH}" fill="#fff"/>`;
  for(let y=0;y<=10;y++){const [,sy]=w2s([0,y]);g+=`<line x1="${w2s([-0.9,0])[0]}" y1="${sy}" x2="${SW}" y2="${sy}" stroke="#EEE9FB" stroke-width="1"/><text x="${SW-4}" y="${sy-3}" font-size="10" fill="#9A93B8" text-anchor="end" font-family="Nunito,sans-serif">${y} m</text>`;}
  const [gx,gy]=w2s([WX0,0]); g+=`<rect x="0" y="${gy+12}" width="${SW}" height="${SH-gy}" fill="#EFE6D6"/>`;
  g+=`<rect x="4" y="${w2s([0,5.0])[1]}" width="${w2s([-0.9,0])[0]-6}" height="${w2s([0,0.2])[1]-w2s([0,5.0])[1]}" rx="10" fill="#F6F3FF" stroke="#D9D3F0" stroke-dasharray="4 3"/><text x="${(w2s([-0.9,0])[0])/2}" y="${w2s([0,5.25])[1]}" font-size="11" font-weight="700" fill="#8C7BD1" text-anchor="middle" font-family="Nunito,sans-serif">almacén</text>`;
  [0,1].forEach(i=>{const [x,y]=w2s(TW.nodes[i]);g+=`<rect x="${x-22}" y="${y+4}" width="44" height="18" fill="#8C7BD1"/><polygon points="${x},${y+2} ${x-11},${y+14} ${x+11},${y+14}" fill="#3A2585"/>`;});
  if(o.disp) TW.bars.forEach(([i,j])=>{const a=w2s(TW.nodes[i]),b=w2s(TW.nodes[j]);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#D9D3F0" stroke-width="3" stroke-dasharray="5 4"/>`;});
  const mx=o.t?Math.max(...o.t.map(Math.abs),1e-6):1;
  TW.bars.forEach(([i,j],b)=>{const a=w2s(N[i]),c=w2s(N[j]);const L=Math.hypot(TW.nodes[j][0]-TW.nodes[i][0],TW.nodes[j][1]-TW.nodes[i][1]);let col=TCOL.user,w=5,dash='';
    if(o.t){const f=o.t[b];col=Math.abs(f)<0.05*mx?TCOL.zero:(f>0?TCOL.ten:TCOL.com);w=3+6*Math.abs(f)/mx;}
    if(L>TWR.LMAX+1e-9){col='#E5484D';dash='stroke-dasharray="6 4"';}
    if(o.bad&&o.bad.includes(b)) g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="#FFD23F" stroke-width="${w+8}" stroke-linecap="round" opacity=".85"/>`;
    g+=`<line class="vb" data-a="${i}" data-c="${j}" x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${dash}/>`;
    if(!o.t&&!o.disp&&!TW.done) g+=`<line class="wbar vb" data-a="${i}" data-c="${j}" data-b="${b}" x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="transparent" stroke-width="18" style="cursor:pointer"/>`;});
  if(o.loads) o.loads.forEach(([i,fx,fy,lab])=>{const [x,y]=w2s(N[i]);const m=Math.hypot(fx,fy),dx=fx/m,dy=-fy/m;const sx=x-dx*44,sy=y-dy*44,ex=x-dx*12,ey=y-dy*12;
    g+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#FF4FA3" stroke-width="4" marker-end="url(#wa)"/><text x="${sx}" y="${sy-5}" font-size="11" font-weight="700" fill="#B8277A" text-anchor="middle" font-family="Nunito,sans-serif">${lab}</text>`;});
  N.forEach((p,i)=>{const [x,y]=w2s(p);const fixed=i<2;g+=`<circle id="wv${i}" cx="${x}" cy="${y}" r="${fixed?8:9}" fill="${TW.sel===i?'#FFD23F':fixed?'#3A2585':'#fff'}" stroke="#3A2585" stroke-width="3"/>`;
    if(!fixed&&!o.disp) g+=`<text id="wt${i}" x="${x}" y="${y+3.5}" font-size="9" font-weight="800" fill="#3A2585" text-anchor="middle" font-family="Nunito,sans-serif" pointer-events="none">${i-1}</text>`;
    if(!o.t&&!o.disp&&!TW.done) g+=`<circle class="wnode" data-n="${i}" cx="${x}" cy="${y}" r="20" fill="transparent" style="cursor:${fixed?'pointer':'grab'};touch-action:none"/>`;});
  return `<svg viewBox="0 0 ${SW} ${SH}" xmlns="http://www.w3.org/2000/svg" class="trsvg" id="towsvg"><defs><marker id="wa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#FF4FA3"/></marker></defs>${g}</svg>`;
}
function usedNodes(){const u=new Set();TW.bars.forEach(([a,b])=>{u.add(a);u.add(b);});return u;}
function towerHeight(){let h=0;usedNodes().forEach(i=>{if(i>=2)h=Math.max(h,TW.nodes[i][1]);});return h;}
function drawTower(){
  const host=$('#twr'); host.innerHTML=towerSVG();
  $('#wtoast').textContent=`Barras: ${TW.bars.length} · Altura de tu torre: ${fmtN(towerHeight())} m`;
  const svg=$('#towsvg'); if(TW.done) return;
  const toW=(cx,cy)=>{const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const p=pt.matrixTransform(svg.getScreenCTM().inverse());return [WX0+p.x/SW*(WX1-WX0), WY0+(SH-p.y)/SH*(WY1-WY0)];};
  svg.querySelectorAll('.wnode').forEach(c=>{
    const n=+c.dataset.n; let d=null;
    c.addEventListener('pointerdown',e=>{e.preventDefault();d={sx:e.clientX,sy:e.clientY,moved:false};c.setPointerCapture(e.pointerId);});
    c.addEventListener('pointermove',e=>{if(!d||n<2)return;if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>6)d.moved=true;
      if(d.moved){let [x,y]=toW(e.clientX,e.clientY);x=Math.max(-2.2,Math.min(5.2,x));y=Math.max(0.15,Math.min(10.3,y));TW.nodes[n]=[Math.round(x*10)/10,Math.round(y*10)/10];
        const s=w2s(TW.nodes[n]);[c,svg.querySelector('#wv'+n)].forEach(el=>{if(el){el.setAttribute('cx',s[0]);el.setAttribute('cy',s[1]);}});
        const tx=svg.querySelector('#wt'+n);if(tx){tx.setAttribute('x',s[0]);tx.setAttribute('y',s[1]+3.5);}
        svg.querySelectorAll('.vb').forEach(l=>{if(+l.dataset.a===n){l.setAttribute('x1',s[0]);l.setAttribute('y1',s[1]);}if(+l.dataset.c===n){l.setAttribute('x2',s[0]);l.setAttribute('y2',s[1]);}});
        $('#wtoast').textContent=`Nudo ${n-1}: ${fmtN(TW.nodes[n][0])} m, altura ${fmtN(TW.nodes[n][1])} m`; }});
    c.addEventListener('pointerup',()=>{if(!d)return;const moved=d.moved;d=null;
      if(moved){TW.sel=null;drawTower();return;}
      if(TW.sel===null){TW.sel=n;drawTower();return;}
      if(TW.sel===n){TW.sel=null;drawTower();return;}
      const a=Math.min(TW.sel,n),b=Math.max(TW.sel,n);TW.sel=null;
      if(a<2&&b<2){drawTower();$('#wtoast').textContent='Las dos cimentaciones ya están fijas: no hace falta unirlas.';return;}
      if(TW.bars.some(([i,j])=>i===a&&j===b)){drawTower();$('#wtoast').textContent='Esa barra ya existe.';return;}
      const L=Math.hypot(TW.nodes[b][0]-TW.nodes[a][0],TW.nodes[b][1]-TW.nodes[a][1]);
      if(L>TWR.LMAX){drawTower();$('#wtoast').textContent=`Esa barra mediría ${fmtN(L)} m: el máximo es ${fmtN(TWR.LMAX)} m. Acerca los nudos.`;return;}
      TW.bars.push([a,b]);drawTower();});
    c.addEventListener('pointercancel',()=>{d=null;});
  });
  svg.querySelectorAll('.wbar').forEach(l=>l.onclick=()=>{TW.bars.splice(+l.dataset.b,1);TW.sel=null;drawTower();});
}
function towerModel(){
  const used=[...usedNodes()].filter(i=>i>=2).sort((a,b)=>a-b), map={0:0,1:1}; used.forEach((n,k)=>map[n]=k+2);
  const nodes=[TW.nodes[0],TW.nodes[1]].concat(used.map(n=>TW.nodes[n]));
  const top=used.reduce((b,n)=>b===null||TW.nodes[n][1]>TW.nodes[b][1]?n:b,null);
  const loads={}; used.forEach(n=>{loads[map[n]]={f:[0,-0.2],label:''};});
  if(top!==null) loads[map[top]]={f:[0.6,-0.7],label:''};
  return {L:{nodes,sup:{0:'pin',1:'pin'},loads},bars:TW.bars.map(([a,b])=>[map[a],map[b]]),top,used};
}
function checkTower(){
  if(TW.done) return;
  const {L,bars,top,used}=towerModel(), i=TRS.stop;
  if(!used.length){$('#wtoast').textContent='Coloca nudos y únelos con barras antes de comprobar.';return;}
  const long=TW.bars.map(([a,b],k)=>Math.hypot(TW.nodes[b][0]-TW.nodes[a][0],TW.nodes[b][1]-TW.nodes[a][1])>TWR.LMAX+1e-9?k:-1).filter(k=>k>=0);
  const R=trSolve(L,bars), h=towerHeight();
  let ok=false, why='';
  const loadsDraw=top!==null?[[top,0.6,0,'viento'],[top,0,-0.7,'antena']]:[];
  if(long.length){why=`Hay ${long.length===1?'una barra':'barras'} de más de ${fmtN(TWR.LMAX)} m (en rojo discontinuo): no se pueden fabricar tan largas.`;}
  else if(!R.rigid){why='La torre no es rígida: se deforma o gira. Revisa que todos los recuadros estén triangulados y que la torre se apoye en <b>las dos cimentaciones</b>.';
    const mv=mechOf(L,bars); const map=[0,1].concat(used); let t0=null;
    const step=ts=>{if(t0===null)t0=ts;const k=Math.min(1,(ts-t0)/1400),amp=1.2*k;const disp=TW.nodes.map(p=>p.slice());map.forEach((n,j)=>{disp[n]=[TW.nodes[n][0]+mv[j][0]*amp,TW.nodes[n][1]+mv[j][1]*amp];});
      $('#twr').innerHTML=towerSVG({disp,loads:loadsDraw});if(k<1)requestAnimationFrame(step);}; requestAnimationFrame(step);}
  else {
    const tmax=Math.max(...R.t.map(Math.abs)); const bad=[]; R.t.forEach((f,k)=>{if(Math.abs(f)>TWR.TMAX||(f<0&&-f*R.len[k]*R.len[k]>TWR.BMAX))bad.push(k);});
    $('#twr').innerHTML=towerSVG({t:R.t,bad,loads:loadsDraw});
    if(bad.length) why='La torre es rígida, pero las barras resaltadas en amarillo soportan demasiado esfuerzo: se romperían o pandearían. Haz la base más ancha o la torre menos esbelta.';
    else ok=true;
  }
  if(long.length) $('#twr').innerHTML=towerSVG({loads:loadsDraw});
  const pts=ok?TWR.W*(0.4+0.6*Math.min(1,h/TWR.HTARGET))*((TW.att===1&&!TW.passed)?SECOND:1):0;
  (ST.log=ST.log||[]).push({stop:i,lv:'Construcción',try:TW.att+1,q:{t:'build',q:'La torre más alta: construir la torre más alta posible que se mantenga estable con 10 nudos.',right:`Torre estable; nota máxima a partir de ${TWR.HTARGET} m de altura`},a:`Altura ${fmtN(h)} m con ${TW.bars.length} barras. ${ok?'Estable.':'No estable.'}`,ok});
  if(ok){TW.passed=true; TW.best=Math.max(TW.best,pts);}
  TW.att++;
  const last=TW.att>=2;
  if(last){TW.done=true; ST.res[i]['c'+TLV.length]={pts:TW.best,w:TWR.W,try:TW.att};}
  const res=ok?`<div class="fb ok"><h3>¡Tu torre aguanta! Altura: ${fmtN(h)} m</h3><p>Es rígida y ninguna barra supera su esfuerzo máximo, aunque sople el viento y pongas la antena en lo alto.</p>${h<TWR.HTARGET?`<p>Con ${TWR.HTARGET} m o más conseguirías la nota máxima de esta prueba.</p>`:'<p>¡Has alcanzado la altura máxima de nota!</p>'}${TLEG}</div>`
    :`<div class="fb no"><h3>Tu torre no aguanta</h3><p>${why}</p>${TW.att===1?`<div class="pista"><strong>Pista de Vera:</strong> apoya la torre en las dos cimentaciones, triangula cada tramo con una diagonal y no la hagas demasiado estrecha: una base ancha reparte mejor el esfuerzo.</div>`:''}</div>`;
  $('#wfb').innerHTML=res+`<div class="actions">${!last?`<button class="btn pink" id="wre">${ok?'Intentar una torre más alta (2.ª comprobación)':'Corregir mi torre (2.ª comprobación)'}</button>`:''}<button class="btn sun" id="wend">${last?'Terminar la construcción':'Terminar con esta torre'}</button></div>`;
  if($('#wre'))$('#wre').onclick=()=>{showTower(true);};
  $('#wend').onclick=()=>{if(!TW.done){TW.done=true;ST.res[i]['c'+TLV.length]={pts:TW.best,w:TWR.W,try:TW.att};} stopResult(i);};
  $('#wfb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ========= control de salidas (opción B: solo sin penalización con el botón de búsqueda) ========= */
const PEN=0.5;
const GUARD={on:false,fs:false,fsOn:false,exits:0,pen:0,away:false,allow:false,miss:0,blurT:null};
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function reqFS(){const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)return Promise.resolve(false);
  try{return Promise.resolve(f.call(el)).then(()=>true,()=>false);}catch(e){return Promise.resolve(false);}}
function exitDetected(kind){
  if(!GUARD.on||GUARD.away)return;
  GUARD.away=true;
  if(GUARD.allow){backFromSearch();return;}
  GUARD.exits++;
  const penal=false;
  const txt=`Salidas: ${GUARD.exits} (−${fmtN(GUARD.exits*PEN)})`;
  const ex=document.querySelector('.exits'); if(ex)ex.textContent=txt;
  else { const w=document.querySelector('.hud .who'); if(w)w.insertAdjacentHTML('afterend',`<span class="exits">${txt}</span>`); }
  const why=kind==='fs'?'Has salido de la pantalla completa.':'Has cambiado de pestaña, de ventana o de programa.';
  const d=document.createElement('div');d.className='pause';
  d.innerHTML=`<div class="dbox" role="alertdialog" aria-labelledby="pT"><div class="sign" id="pT">¡Salida detectada!</div>
    <p>${why} Se resta <b>${fmtN(PEN)} puntos</b> de tu nota final.</p>
    <p>Salidas: <b>${GUARD.exits}</b>. Penalización acumulada: <b>−${fmtN(GUARD.exits*PEN)}</b>. Queda registrado en tu diploma.</p>
    ${penal?'<p><b>Además, estabas respondiendo una pregunta: ese intento cuenta como fallo.</b></p>':''}
    <button class="btn sun" id="resume">${GUARD.fs?'Volver a pantalla completa':'Volver al juego'}</button></div>`;
  document.body.appendChild(d);
  $('#resume').onclick=()=>{const done=()=>{d.remove();GUARD.away=false;GUARD.fsOn=isFS();}; if(GUARD.fs&&!isFS())reqFS().then(done);else done();};
}
const fmtN=n=>n.toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});

function watchLoop(){ if(!GUARD.on||GUARD.away){GUARD.miss=0;return;}
  if(document.hidden){exitDetected('tab');return;}
  if(GUARD.fsOn&&!isFS()){exitDetected('fs');return;}
  if(!document.hasFocus()){ if(++GUARD.miss>=2) exitDetected('win'); } else GUARD.miss=0; }
setInterval(watchLoop,500);
document.addEventListener('visibilitychange',()=>{if(document.hidden)exitDetected('tab');});
window.addEventListener('pagehide',()=>exitDetected('tab'));
window.addEventListener('blur',()=>{if(!GUARD.on)return;clearTimeout(GUARD.blurT);GUARD.blurT=setTimeout(()=>{if(!document.hasFocus())exitDetected('win');},900);});
window.addEventListener('focus',()=>clearTimeout(GUARD.blurT));
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(GUARD.fsOn&&!isFS())exitDetected('fs');}));
/* botón de búsqueda permitido (solo en preguntas de investigación) */
function openSearch(){ GUARD.allow=true; try{window.open('https://www.google.es/','_blank','noopener');}catch(e){} }
function backFromSearch(){
  const d=document.createElement('div');d.className='pause';
  d.innerHTML=`<div class="dbox" role="alertdialog"><div class="sign" style="color:var(--mint)">¡Bienvenido de vuelta!</div><p>Has salido con el botón <b>Busca información en internet</b>, así que esta salida <b>no penaliza</b>.</p><button class="btn" id="resume">Volver a pantalla completa</button></div>`;
  document.body.appendChild(d);
  $('#resume').onclick=()=>{const done=()=>{d.remove();GUARD.allow=false;GUARD.away=false;GUARD.fsOn=isFS();}; if(GUARD.fs&&!isFS())reqFS().then(done); else done();};
}

showStart();
</script>
